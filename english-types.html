<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语题型选择</title>
<link rel="stylesheet" href="shared/common.css">
<link rel="stylesheet" href="shared/tokens.css">
<style>
    body {
        background: linear-gradient(160deg, #d6e8fa 0%, #4A90D9 45%, #F5A623 110%);
        min-height: 100vh;
    }
    .type-card:hover { border-color: rgba(255,255,255,0.9); }
    .type-card .t-name { color: #38a169; }
    .section-label { border-left-color: #38a169; }
    .grade-badge { color: #38a169; }
</style>
</head>
<body class="type-page">
<div class="wrapper">
    <a href="index.html" class="back-home">← 返回首页</a>

    <div class="page-header">
        <div class="logo"><img src="assets/logo-english.png" alt="英语"></div>
        <h1>英语练习<span class="grade-badge" id="gradeBadge">一年级</span></h1>
        <p>请选择要练习的题型</p>
    </div>

    <div class="card">
        <div class="section-label">📚 选择题型</div>
        <div class="type-grid" id="typeGrid">
            <!-- 动态生成 -->
        </div>
    </div>

    <div class="foot-tip">💡 更多英语题型持续开发中，敬请期待</div>
</div>

<script src="shared/common.js"></script>
<script src="plugins/registry.js"></script>
<script>
(function () {
  'use strict';

  var SUBJECT = 'english';
  var grade = App.currentGrade();
  document.getElementById('gradeBadge').textContent = App.getGradeName(grade);

  // 学科题型图标（按插件 ID）；非数学学科无 category 图标，缺省回退
  var PLUGIN_ICONS = {
    'english-alphabet': '🔠'
  };
  // 友好的题型描述（英语暂无知识库，作为回退展示）
  var PLUGIN_DESC = {
    'english-alphabet': '26个字母名与字母音 · 例词跟读 · 发音提示'
  };
  function iconOf(p) { return PLUGIN_ICONS[p.id] || '📘'; }
  function descOf(p) { return PLUGIN_DESC[p.id] || ''; }

  var registry = (typeof window.PLUGIN_REGISTRY !== 'undefined') ? window.PLUGIN_REGISTRY : [];

  // 统一走 App.PluginLoader：按年级加载本学科全部插件并读取其元数据（含竞态安全与缓存）
  App.PluginLoader.loadSubjectPlugins(SUBJECT, grade).then(function (plugins) {
    var applicable = plugins.filter(function (p) {
      return p.grades && p.grades.indexOf(grade) !== -1;
    });

    var html = '';
    applicable.forEach(function (p) {
      var name = p.name || p.id;
      var desc = descOf(p);
      html += '<a href="' + App.buildPluginLink(p.id) + '" class="type-card" title="' + desc + '">' +
        '<span class="t-icon">' + iconOf(p) + '</span>' +
        '<span class="t-name">' + name + '</span>' +
        (desc ? '<span class="t-desc">' + desc + '</span>' : '') +
        '</a>';
    });

    document.getElementById('typeGrid').innerHTML =
      html || '<div class="load-hint">该年级暂无可用题型</div>';

    // 预热缓存，配合 Service Worker 让点击进入练习页更快
    App.PluginLoader.prefetch(applicable);
  }).catch(function (err) {
    document.getElementById('typeGrid').innerHTML =
      '<div class="load-hint">题型加载失败：' + (err && err.message) + '</div>';
  });
})();
</script>
</body>
</html>
