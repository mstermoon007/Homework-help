<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>语文题型选择</title>
<link rel="stylesheet" href="common.css">
<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        min-height: 100vh;
        padding: 30px 20px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .type-card:hover { border-color: #f5576c; }
    .type-card .t-name { color: #f5576c; }
    .section-label { border-left-color: #f5576c; }
    .grade-badge { color: #f5576c; }
</style>
</head>
<body>
<div class="wrapper">
    <a href="index.html" class="back-home">← 返回首页</a>

    <div class="page-header">
        <div class="logo">📖</div>
        <h1>语文练习<span class="grade-badge" id="gradeBadge">一年级</span></h1>
        <p>请选择要练习的题型</p>
    </div>

    <div class="card">
        <div class="section-label">📚 选择题型</div>
        <div class="type-grid">
            <a href="pinyin-practice.html" class="type-card" id="pinyinLink">
                <span class="t-icon">🔤</span>
                <div class="t-name">拼音练习</div>
                <div class="t-desc" id="pinyinDesc">拼音抄写 · 汉字注音 · 混合填空 · 词语注音</div>
            </a>
        </div>
    </div>

    <div class="foot-tip">💡 更多题型持续更新中，敬请期待</div>
</div>

<script src="common.js"></script>
<script>
var grade = App.currentGrade();
document.getElementById('gradeBadge').textContent = App.getGradeName(grade);
document.getElementById('pinyinLink').href = App.buildLink('pinyin-practice.html');
// 一年级显示拼音抄写/注音/混合，二年级及以上显示词语注音
if (grade === 1) {
    document.getElementById('pinyinDesc').textContent = '拼音抄写 · 汉字注音 · 拼音汉字混合填空';
} else {
    document.getElementById('pinyinDesc').textContent = '看两字词语写拼音，词库按年级分级，巩固字词基础';
}
</script>
</body>
</html>
