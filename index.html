<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小学练习本</title>
<link rel="stylesheet" href="common.css">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #667eea;
        min-height: 100vh;
    }

    /* ============ Hero ============ */
    .hero {
        text-align: center;
        color: #fff;
        padding: 36px 20px 24px;
    }
    .hero-logo {
        font-size: 3rem;
        display: inline-block;
        animation: float 3.5s ease-in-out infinite;
        margin-bottom: 10px;
    }
    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
    }
    .hero h1 {
        font-size: 2.2rem;
        font-weight: 900;
        letter-spacing: 2px;
        margin-bottom: 8px;
    }
    .hero p {
        font-size: 0.95rem;
        opacity: 0.85;
        max-width: 480px;
        margin: 0 auto;
        line-height: 1.6;
    }

    /* ============ 卡片容器 ============ */
    .wrapper {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 16px 50px;
    }
    .home-card {
        background: #fff;
        border-radius: 12px;
        padding: 36px 40px;
        margin-bottom: 16px;
        border: 1px solid #e8e8e8;
    }
    .section-label {
        font-size: 1.1rem;
        font-weight: 700;
        color: #333;
        margin-bottom: 20px;
        padding-left: 12px;
        border-left: 4px solid #667eea;
    }

    /* ============ 科目选择 ============ */
    .home-card.subject-section { padding: 24px 32px; }
    .subject-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
    }
    .subject-option { display: none; }
    .subject-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px 14px 18px;
        border: 1.5px solid #e0e0e0;
        border-radius: 10px;
        cursor: pointer;
        text-align: center;
        transition: all 0.2s;
        user-select: none;
        background: #fff;
    }
    .subject-card .s-icon {
        font-size: 2.2rem;
        margin-bottom: 8px;
    }
    .subject-card .s-name {
        font-size: 1.15rem;
        font-weight: 800;
        margin-bottom: 4px;
    }
    .subject-card .s-desc {
        font-size: 0.8rem;
        color: #999;
        line-height: 1.4;
    }
    .subject-card.math .s-name { color: #667eea; }
    .subject-card.chinese .s-name { color: #f5576c; }
    .subject-card.english .s-name { color: #38a169; }
    .subject-card:hover { border-color: #aaa; background: #fafafa; }
    .subject-option:checked + .subject-card.math {
        border-color: #667eea;
        background: #eef2ff;
    }
    .subject-option:checked + .subject-card.chinese {
        border-color: #f5576c;
        background: #fff0f3;
    }
    .subject-option:checked + .subject-card.english {
        border-color: #38a169;
        background: #f0fff4;
    }

    /* ============ 年级选择 ============ */
    .home-card.grade-section { padding: 32px 40px; }
    .grade-grid {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 14px;
    }
    .grade-option { display: none; }
    .grade-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 24px 12px 22px;
        border: 1.5px solid #e0e0e0;
        border-radius: 10px;
        cursor: pointer;
        text-align: center;
        transition: all 0.2s;
        user-select: none;
        background: #fff;
    }
    .grade-card .g-icon {
        font-size: 2.4rem;
        margin-bottom: 8px;
    }
    .grade-card .g-name {
        font-size: 1.2rem;
        font-weight: 700;
        color: #555;
    }
    .grade-card:hover { border-color: #aaa; background: #fafafa; }
    .grade-option:checked + .grade-card {
        border-color: #667eea;
        background: #eef2ff;
    }
    .grade-option:checked + .grade-card .g-name { color: #667eea; }

    /* ============ 摘要 + CTA ============ */
    .home-summary {
        text-align: center;
        padding: 14px 24px;
        margin-bottom: 16px;
        background: rgba(255,255,255,0.18);
        border-radius: 10px;
        font-size: 1rem;
        color: rgba(255,255,255,0.9);
    }
    .home-summary b { color: #fff; font-size: 1.05rem; }
    .home-cta {
        text-align: center;
        margin-bottom: 16px;
    }
    .start-btn {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 20px 72px;
        font-size: 1.3rem;
        font-weight: 800;
        color: #fff;
        background: #764ba2;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.2s;
        letter-spacing: 2px;
    }
    .start-btn:hover:not(:disabled) {
        background: #5a3a80;
    }
    .start-btn:active:not(:disabled) {
        background: #4a2e6e;
    }
    .start-btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
    }

    /* ============ 底部 ============ */
    .home-footer {
        text-align: center;
        color: rgba(255,255,255,0.7);
        font-size: 0.9rem;
        padding-bottom: 6px;
    }
    .home-feedback {
        text-align: center;
        color: rgba(255,255,255,0.55);
        font-size: 0.8rem;
        padding-bottom: 16px;
    }

    /* ============ 响应式 ============ */
    @media (max-width: 768px) {
        .hero { padding: 30px 20px 20px; }
        .hero-logo { font-size: 2.5rem; }
        .hero h1 { font-size: 1.8rem; }
        .hero p { font-size: 0.85rem; }
        .wrapper { padding: 0 12px 40px; }
        .home-card { padding: 24px 20px; border-radius: 10px; }
        .home-card.subject-section { padding: 20px 20px; }
        .home-card.grade-section { padding: 24px 20px; }
        .subject-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .subject-card { padding: 16px 8px 14px; }
        .subject-card .s-icon { font-size: 1.8rem; }
        .subject-card .s-name { font-size: 1rem; }
        .subject-card .s-desc { font-size: 0.72rem; }
        .grade-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .grade-card { padding: 20px 8px 18px; }
        .grade-card .g-icon { font-size: 2rem; }
        .grade-card .g-name { font-size: 1.05rem; }
        .start-btn { padding: 18px 56px; font-size: 1.15rem; width: 100%; justify-content: center; }
    }

    @media (max-width: 480px) {
        .hero { padding: 24px 16px 16px; }
        .hero-logo { font-size: 2.2rem; }
        .hero h1 { font-size: 1.6rem; }
        .subject-grid { grid-template-columns: 1fr; gap: 8px; }
        .subject-card { flex-direction: row; padding: 14px 16px; gap: 12px; text-align: left; }
        .subject-card .s-icon { font-size: 1.6rem; margin-bottom: 0; }
        .grade-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .grade-card { padding: 16px 6px 14px; }
        .grade-card .g-icon { font-size: 1.8rem; }
        .grade-card .g-name { font-size: 0.95rem; }
        .home-card { padding: 18px 14px; }
        .home-card.subject-section { padding: 16px 14px; }
        .home-card.grade-section { padding: 20px 14px; }
        .start-btn { padding: 16px 40px; font-size: 1.1rem; }
    }
</style>
</head>
<body>
<div class="hero">
    <div class="hero-logo">📓</div>
    <h1>小学练习本</h1>
    <p>口算练习 · 应用题 · 拼音练习 · 英语启蒙 · 在线答题 · 智能评分</p>
</div>

<div class="wrapper">
    <form onsubmit="goTo(event)">
        <div class="home-card subject-section">
            <div class="section-label">📚 请选择科目</div>
            <div class="subject-grid">
                <input type="radio" name="subject" id="sMath" class="subject-option" value="math" checked>
                <label for="sMath" class="subject-card math">
                    <span class="s-icon">🧮</span>
                    <div>
                        <div class="s-name">数学</div>
                        <div class="s-desc">口算 · 应用题 · 凑十法</div>
                    </div>
                </label>
                <input type="radio" name="subject" id="sChinese" class="subject-option" value="chinese">
                <label for="sChinese" class="subject-card chinese">
                    <span class="s-icon">📖</span>
                    <div>
                        <div class="s-name">语文</div>
                        <div class="s-desc">拼音 · 字词练习</div>
                    </div>
                </label>
                <input type="radio" name="subject" id="sEnglish" class="subject-option" value="english">
                <label for="sEnglish" class="subject-card english">
                    <span class="s-icon">🔤</span>
                    <div>
                        <div class="s-name">英语</div>
                        <div class="s-desc">字母 · 单词 · 启蒙</div>
                    </div>
                </label>
            </div>
        </div>

        <div class="home-card grade-section">
            <div class="section-label">🎓 请选择年级</div>
            <div class="grade-grid">
                <input type="radio" name="grade" id="g1" class="grade-option" value="1" checked>
                <label for="g1" class="grade-card">
                    <span class="g-icon">🌱</span>
                    <span class="g-name">一年级</span>
                </label>
                <input type="radio" name="grade" id="g2" class="grade-option" value="2">
                <label for="g2" class="grade-card">
                    <span class="g-icon">🌿</span>
                    <span class="g-name">二年级</span>
                </label>
                <input type="radio" name="grade" id="g3" class="grade-option" value="3">
                <label for="g3" class="grade-card">
                    <span class="g-icon">🌳</span>
                    <span class="g-name">三年级</span>
                </label>
                <input type="radio" name="grade" id="g4" class="grade-option" value="4">
                <label for="g4" class="grade-card">
                    <span class="g-icon">🌲</span>
                    <span class="g-name">四年级</span>
                </label>
                <input type="radio" name="grade" id="g5" class="grade-option" value="5">
                <label for="g5" class="grade-card">
                    <span class="g-icon">🍀</span>
                    <span class="g-name">五年级</span>
                </label>
                <input type="radio" name="grade" id="g6" class="grade-option" value="6">
                <label for="g6" class="grade-card">
                    <span class="g-icon">🌾</span>
                    <span class="g-name">六年级</span>
                </label>
            </div>
        </div>

        <div class="home-summary" id="summary">当前选择：<b>数学 · 一年级</b></div>
        <div class="home-cta">
            <button type="submit" class="start-btn" id="startBtn">🚀 开始练习</button>
        </div>
    </form>

    <div class="home-footer">💡 选择科目与年级后，点击"开始练习"进入对应题型页</div>
    <div class="home-feedback">问题反馈 V+13369372133</div>
</div>

<script src="common.js"></script>
<script>
function getSelected() {
    var grade = document.querySelector('input[name="grade"]:checked').value;
    var subject = document.querySelector('input[name="subject"]:checked').value;
    return { grade: grade, subject: subject };
}
function updateSummary() {
    var sel = getSelected();
    var gradeName = App.GRADE_NAMES[sel.grade];
    var subjName = App.SUBJECT_NAMES[sel.subject];
    document.getElementById('summary').innerHTML = '当前选择：<b>' + subjName + ' · ' + gradeName + '</b>';
}
function goTo(e) {
    e.preventDefault();
    var sel = getSelected();
    var target = {
        math: 'math-types.html',
        chinese: 'chinese-types.html',
        english: 'english-types.html'
    }[sel.subject];
    window.location.href = target + '?grade=' + encodeURIComponent(sel.grade);
}
document.querySelectorAll('.grade-card, .subject-card').forEach(function(el) {
    el.addEventListener('click', function() { setTimeout(updateSummary, 0); });
});
updateSummary();
</script>
</body>
</html>
