<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>选择年级</title>
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/base.css">
<link rel="stylesheet" href="shared/states.css">
<style>
    body {
        font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", -apple-system, sans-serif;
        background: var(--bg);
        min-height: 100vh;
        font-size: 14px;
        -webkit-tap-highlight-color: transparent;
    }
    .top-nav {
        background: var(--card);
        height: 56px;
        display: flex;
        align-items: center;
        padding: 0 24px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        position: sticky;
        top: 0;
        z-index: 100;
    }
    .top-nav .nav-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 1.1rem;
        font-weight: 800;
        color: var(--brand);
    }
    .top-nav .nav-logo {
        width: 36px;
        height: 36px;
        background: var(--grad-logo);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.3rem;
        color: #fff;
    }
    .top-nav .nav-logo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 10px;
        display: block;
    }
    .main-wrapper {
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px 24px 40px;
    }
    .select-card {
        background: var(--card);
        border-radius: var(--radius-card);
        padding: 28px 32px;
        margin-bottom: 20px;
        box-shadow: var(--shadow);
    }
    .col-title {
        font-size: 1rem;
        font-weight: 700;
        color: var(--ink);
        margin-bottom: 18px;
        padding-left: 12px;
        border-left: 4px solid var(--brand);
    }
    .grade-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
    }
    .grade-radio { display: none; }
    .grade-chip {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 14px 10px;
        border: 2px solid var(--line);
        border-radius: 14px;
        cursor: pointer;
        transition: all 0.2s;
        user-select: none;
        background: var(--bg);
    }
    .grade-chip .g-icon {
        font-size: 1.5rem;
        line-height: 1;
    }
    .grade-chip .g-name {
        font-size: 0.9rem;
        font-weight: 700;
        color: var(--muted);
    }
    .grade-chip:hover { border-color: #C0C8D0; }
    .grade-radio:checked + .grade-chip {
        border-color: var(--brand);
        background: var(--math-bg);
    }
    .grade-radio:checked + .grade-chip .g-name { color: var(--brand); }
    .action-area { margin-bottom: 0; }
    .btn-start {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        max-width: 320px;
        margin: 0 auto;
        padding: 16px 32px;
        font-size: 1.1rem;
        font-weight: 800;
        color: #fff;
        background: var(--grad-cta);
        border: none;
        border-radius: 24px;
        cursor: pointer;
        box-shadow: 0 6px 20px rgba(245,166,35,0.35);
        transition: all 0.2s;
        letter-spacing: 1px;
    }
    .btn-start:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 8px 28px rgba(245,166,35,0.45);
    }
    .btn-start:active:not(:disabled) {
        transform: translateY(0);
        box-shadow: 0 4px 16px rgba(245,166,35,0.35);
    }
    .btn-start:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
    .btn-start .arrow {
        font-size: 1.3rem;
        transition: transform 0.2s;
    }
    .btn-start:hover:not(:disabled) .arrow { transform: translateX(3px); }
    .site-footer {
        max-width: 1200px;
        margin: 24px auto 0;
        padding: 16px;
        text-align: center;
        color: var(--muted);
        font-size: 0.78rem;
        line-height: 1.8;
    }
    .site-footer .footer-inner {
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: center;
    }
    .site-footer .footer-copy { font-weight: 700; }
    .site-footer .footer-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        justify-content: center;
    }
    .site-footer a { color: var(--muted); text-decoration: none; }
    .site-footer a:hover { color: var(--brand); text-decoration: underline; }
    .site-footer .footer-sep { opacity: 0.5; }
    .site-footer .footer-version,
    .site-footer .footer-time { font-variant-numeric: tabular-nums; }
    @media (max-width: 640px) {
        .site-footer { margin: 18px 12px 0; padding: 12px; }
    }
    @media (max-width: 768px) {
        .main-wrapper { padding: 20px 16px 32px; }
        .select-card { padding: 20px 18px; }
    }
    @media (max-width: 480px) {
        .main-wrapper { padding: 16px 12px 28px; }
        .select-card { padding: 16px 14px; border-radius: 12px; }
        .col-title { font-size: 0.92rem; margin-bottom: 14px; }
        .grade-grid { gap: 8px; }
        .grade-chip { padding: 12px 8px; border-radius: 12px; }
        .grade-chip .g-icon { font-size: 1.3rem; }
        .grade-chip .g-name { font-size: 0.8rem; }
        .btn-start { max-width: 100%; padding: 14px 24px; font-size: 1rem; border-radius: 22px; }
    }
    .feedback-entry-btn {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 1000;
        color: #555;
        text-decoration: none;
        font-size: 13px;
    }
    .feedback-entry-btn:hover { color: #333; }
</style>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebPage",
  "name": "选择年级 · Homework Help",
  "description": "选择小学 1-6 年级，进入对应题型目录。"
}
</script>
</head>
<body>
<a href="feedback/feedback.html" class="feedback-entry-btn">问题反馈</a>
<nav class="top-nav">
    <div class="nav-brand">
        <div class="nav-logo"><img id="subjectLogo" src="" alt="" width="36" height="36"></div>
        <span id="subjectName">数学</span>
    </div>
</nav>
<div class="main-wrapper">
    <form id="gradeForm" onsubmit="goTo(event)">
        <div class="select-card">
            <div class="col-title">🎓 选择年级</div>
            <div class="grade-grid">
                <input type="radio" name="grade" id="g1" class="grade-radio" value="1" checked>
                <label for="g1" class="grade-chip">
                    <span class="g-icon">🌱</span>
                    <span class="g-name">一年级</span>
                </label>
                <input type="radio" name="grade" id="g2" class="grade-radio" value="2">
                <label for="g2" class="grade-chip">
                    <span class="g-icon">🌿</span>
                    <span class="g-name">二年级</span>
                </label>
                <input type="radio" name="grade" id="g3" class="grade-radio" value="3">
                <label for="g3" class="grade-chip">
                    <span class="g-icon">🌳</span>
                    <span class="g-name">三年级</span>
                </label>
                <input type="radio" name="grade" id="g4" class="grade-radio" value="4">
                <label for="g4" class="grade-chip">
                    <span class="g-icon">🌲</span>
                    <span class="g-name">四年级</span>
                </label>
                <input type="radio" name="grade" id="g5" class="grade-radio" value="5">
                <label for="g5" class="grade-chip">
                    <span class="g-icon">🍀</span>
                    <span class="g-name">五年级</span>
                </label>
                <input type="radio" name="grade" id="g6" class="grade-radio" value="6">
                <label for="g6" class="grade-chip">
                    <span class="g-icon">🌾</span>
                    <span class="g-name">六年级</span>
                </label>
            </div>
        </div>
        <div class="action-area">
            <button type="submit" class="btn-start" id="startBtn">
                进入题型 <span class="arrow">→</span>
            </button>
        </div>
    </form>
</div>
<footer class="site-footer">
    <div class="footer-inner">
        <div class="footer-copy">© <span id="footYear"></span> 甘肃源始人广告传媒有限公司 版权所有</div>
        <div class="footer-meta">
            <span class="footer-beian">
                <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">陇ICP备2026008157号-1</a>
                <span class="footer-sep">|</span>
                <a href="http://www.beian.gov.cn/" target="_blank" rel="noopener">粤公网安备 XXXXXXXXXXXX号</a>
            </span>
            <span class="footer-sep">|</span>
            <span class="footer-version">版本 <span id="footVersion"></span></span>
            <span class="footer-sep">|</span>
            <span class="footer-time" id="footTime"></span>
        </div>
    </div>
</footer>
<script src="shared/version.js"></script>
<script src="shared/common.js"></script>
<script>
(function () {
    var yEl = document.getElementById('footYear');
    var tEl = document.getElementById('footTime');
    function pad(n) { return n < 10 ? '0' + n : '' + n; }
    function tick() {
        var d = new Date();
        if (yEl) yEl.textContent = d.getFullYear();
        if (tEl) tEl.textContent = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
            ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    }
    tick();
    setInterval(tick, 1000);
    var vEl = document.getElementById('footVersion');
    if (vEl) vEl.textContent = (typeof APP_VERSION !== 'undefined') ? APP_VERSION : '4.0.0';
    // 科目配置
    var params = new URLSearchParams(window.location.search);
    var subject = params.get('subject') || 'math';
    var SUBJECT_CONFIG = {
        math: { name: '数学', logo: 'assets/logo-math.webp' },
        chinese: { name: '语文', logo: 'assets/logo-chinese.webp' },
        english: { name: '英语', logo: 'assets/logo-english.webp' }
    };
    var cfg = SUBJECT_CONFIG[subject] || SUBJECT_CONFIG.math;
    document.getElementById('subjectLogo').src = cfg.logo;
    document.getElementById('subjectName').textContent = cfg.name;
    function getSelectedGrade() {
        return document.querySelector('input[name="grade"]:checked').value;
    }
    function goTo(e) {
        if (e) e.preventDefault();
        var grade = getSelectedGrade();
        var target = {
            math: 'math-types.html',
            chinese: 'subject-types.html?subject=chinese',
            english: 'subject-types.html?subject=english'
        }[subject];
        window.location.href = App.buildLink(target, grade);
    }
    document.querySelectorAll('.grade-chip').forEach(function (chip) {
        var input = document.getElementById(chip.getAttribute('for'));
        chip.addEventListener('click', function () { input.checked = true; goTo(); });
        chip.addEventListener('dblclick', function () { input.checked = true; goTo(); });
    });
})();
</script>
</body>
</html>
