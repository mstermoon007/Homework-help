<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>选择练习方式 · 小学练习本</title>
<style>
  :root { --grad: linear-gradient(160deg, #4A90D9 0%, #6DB3F2 40%, #7EB6F0 100%); --cta: linear-gradient(135deg, #F5A623, #FB7E3C); }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100vh; font-family: "PingFang SC", "Noto Sans SC", system-ui, sans-serif; color: #22314a; background: #eef5ff; }
  .top-nav { display: flex; align-items: center; justify-content: space-between; padding: 14px 26px; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.04); }
  .nav-brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: #22314a; font-weight: 800; }
  .hero { background: var(--grad); color: #fff; padding: 40px 24px 34px; text-align: center; }
  .hero h1 { margin: 0 0 8px; font-size: 1.7rem; }
  .hero p { margin: 0; opacity: .92; }
  .wrap { max-width: 760px; margin: 26px auto; padding: 0 18px; }
  .card { background: #fff; border-radius: 16px; padding: 22px 22px 26px; box-shadow: 0 6px 22px rgba(74,144,217,.12); }
  .blk { margin-bottom: 20px; }
  .blk-title { font-weight: 800; margin-bottom: 10px; }
  .seg { display: flex; flex-wrap: wrap; gap: 10px; }
  .seg button { flex: 1 1 30%; min-width: 120px; padding: 12px 10px; border: 1px solid #d8e6f7; background: #f5f9ff; border-radius: 12px; cursor: pointer; font-weight: 700; color: #2b4a73; transition: all .15s; }
  .seg button.on { background: var(--grad); color: #fff; border-color: transparent; box-shadow: 0 6px 16px rgba(74,144,217,.3); }
  .foot { text-align: center; margin-top: 8px; }
  .btn-go { display: inline-block; padding: 14px 40px; border: none; border-radius: 24px; background: var(--cta); color: #fff; font-weight: 800; font-size: 1.05rem; letter-spacing: 1px; cursor: pointer; text-decoration: none; box-shadow: 0 6px 18px rgba(245,166,35,.35); }
  .btn-go:hover { transform: translateY(-2px); }
  .hint { margin-top: 14px; font-size: .85rem; color: #8aa0bd; text-align: center; }
</style>
</head>
<body>
<nav class="top-nav">
  <a href="index.html" class="nav-brand"><span>小学练习本</span></a>
  <div><a href="select.html" class="nav-brand" style="font-weight:600;color:#4A90D9;">直接进入练习</a></div>
</nav>

<header class="hero">
  <h1>选择练习方式</h1>
  <p>先选模式与科目年级，再进入对应配置页生成练习（本阶段数学已就绪，语文/英语为预留入口）。</p>
</header>

<main class="wrap">
  <div class="card">
    <div class="blk">
      <div class="blk-title">练习模式</div>
      <div class="seg" id="modeSeg">
        <button type="button" data-v="quick" class="on">快速模式</button>
        <button type="button" data-v="teacher">教师模式</button>
        <button type="button" data-v="competition">竞赛模式</button>
      </div>
    </div>
    <div class="blk">
      <div class="blk-title">科目</div>
      <div class="seg" id="subjectSeg">
        <button type="button" data-v="math" class="on">数学</button>
        <button type="button" data-v="chinese">语文（接入中）</button>
        <button type="button" data-v="english">英语（接入中）</button>
      </div>
    </div>
    <div class="blk">
      <div class="blk-title">年级</div>
      <div class="seg" id="gradeSeg">
        <button type="button" data-v="1" class="on">一年级</button>
        <button type="button" data-v="2">二年级</button>
        <button type="button" data-v="3">三年级</button>
        <button type="button" data-v="4">四年级</button>
        <button type="button" data-v="5">五年级</button>
        <button type="button" data-v="6">六年级</button>
      </div>
    </div>
    <div class="foot">
      <a href="#" class="btn-go" id="goBtn">下一步：配置练习</a>
    </div>
    <div class="hint">竞赛模式仅支持数学；选择语文/英语将进入预留配置空间（暂不生成）。</div>
  </div>
</main>

<script>
  (function () {
    'use strict';
    var sel = { mode: 'quick', subject: 'math', grade: '1' };
    function bind(segId, key, enforce) {
      var seg = document.getElementById(segId);
      seg.addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        Array.prototype.forEach.call(seg.children, function (c) { c.classList.remove('on'); });
        b.classList.add('on');
        sel[key] = b.getAttribute('data-v');
        if (enforce) enforce();
      });
    }
    bind('modeSeg', 'mode', function () {
      // 竞赛模式仅数学
      if (sel.mode === 'competition' && sel.subject !== 'math') {
        sel.subject = 'math';
        Array.prototype.forEach.call(document.getElementById('subjectSeg').children, function (c) {
          c.classList.toggle('on', c.getAttribute('data-v') === 'math');
        });
      }
    });
    bind('subjectSeg', 'subject', function () {
      if (sel.mode === 'competition' && sel.subject !== 'math') {
        sel.mode = 'quick';
        Array.prototype.forEach.call(document.getElementById('modeSeg').children, function (c) {
          c.classList.toggle('on', c.getAttribute('data-v') === 'quick');
        });
      }
    });
    bind('gradeSeg', 'grade');

    document.getElementById('goBtn').addEventListener('click', function (e) {
      e.preventDefault();
      // 统一出口：进入对应学科配置页（数学=select.html 完整配置；语文/英语=预留空间）
      var url = 'select.html?mode=' + encodeURIComponent(sel.mode) +
        '&subject=' + encodeURIComponent(sel.subject) + '&grade=' + sel.grade;
      window.location.href = url;
    });
  })();
</script>
</body>
</html>
