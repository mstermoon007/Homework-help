<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>题型选择</title>
<meta name="description" content="小学 1-6 年级语文与英语题型目录：按知识点分组的拼音、写字、综合练习、字母与单词，支持在线练习与打印。">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/base.css">
<link rel="stylesheet" href="shared/components.css">
<link rel="stylesheet" href="shared/states.css">
<link rel="stylesheet" href="shared/subjects.css">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "CollectionPage",
  "name": "题型选择 · Homework Help",
  "url": "https://home.modouyu.top/subject-types.html",
  "description": "小学 1-6 年级语文与英语题型选择页，按知识点分组提供拼音、写字、综合练习与字母跟读。"
}
</script>
<link rel="canonical" href="https://home.modouyu.top/subject-types.html">
</head>
<body class="type-page">
<noscript><div class="noscript-types" style="max-width:860px;margin:24px auto;padding:0 20px;font-family:sans-serif;line-height:1.8;"><p>请启用 JavaScript 查看完整题型列表。</p></div></noscript>
<div class="wrapper">
    <a href="index.html" class="back-home">← 返回首页</a>

    <div class="page-header">
        <div class="page-title">
            <span class="pt-logo"><img id="subjectLogo" src="" alt="" width="56" height="56"></span>
            <span class="pt-grade" id="gradeBadge">一年级</span>
            <h1 class="pt-subject" id="subjectTitle"></h1>
        </div>
        <p id="subjectDesc">请选择要练习的题型</p>
    </div>

    <div class="card">
        <div class="section-label" id="sectionLabel">📚 选择题型</div>
        <div class="type-grid" id="typeGrid">
            <div class="skel-grid" aria-hidden="true">
                <div class="type-card skel-card"><div class="skel-line i"></div><div class="skel-line t"></div><div class="skel-line s"></div></div>
                <div class="type-card skel-card"><div class="skel-line i"></div><div class="skel-line t"></div><div class="skel-line s"></div></div>
                <div class="type-card skel-card"><div class="skel-line i"></div><div class="skel-line t"></div><div class="skel-line s"></div></div>
                <div class="type-card skel-card"><div class="skel-line i"></div><div class="skel-line t"></div><div class="skel-line s"></div></div>
                <div class="type-card skel-card"><div class="skel-line i"></div><div class="skel-line t"></div><div class="skel-line s"></div></div>
                <div class="type-card skel-card"><div class="skel-line i"></div><div class="skel-line t"></div><div class="skel-line s"></div></div>
            </div>
        </div>
    </div>

    <div class="foot-tip" id="footTip">💡 更多题型持续更新中，敬请期待</div>
</div>

<script src="shared/common.js"></script>
<script src="shared/knowledge-bank.js"></script>
<script src="shared/module-catalog.js"></script>
<script src="shared/capability-resolver.js"></script>
<script src="shared/catalog-utils.js"></script>
<script>
(function () {
  'use strict';

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = (s == null) ? '' : String(s);
    return d.innerHTML;
  }

  function renderErrorState(icon, errTitle, desc) {
    document.getElementById('typeGrid').innerHTML =
      '<div class="error-state">' +
      '  <div class="es-icon">' + icon + '</div>' +
      '  <div class="es-title">' + errTitle + '</div>' +
      '  <div class="es-desc">' + desc + '</div>' +
      '  <div class="es-actions">' +
      '    <a class="es-btn primary" href="index.html">返回首页</a>' +
      '    <a class="es-btn ghost" href="?grade=1&subject=' + encodeURIComponent(subject || '') + '">从一年级开始</a>' +
      '  </div>' +
      '</div>';
  }

  // 学科配置
  var SUBJECT_CONFIG = {
    math: {
      name: '数学', logo: 'assets/logo-math.webp', desc: '请选择要练习的题型',
      sectionLabel: '📐 选择题型', footTip: '💡 选择题型后进入对应练习页面，每个题型按知识点生成题目',
      qtLabels: { calc: '计算', oral: '口算', vertical: '竖式', mixed: '混合', judge: '判断', choice: '选择', fill: '填空', cushi: '凑十法', word: '应用题', geometry: '几何', stats: '统计', clock: '钟表', money: '人民币', unit: '单位换算', pattern: '找规律' },
      moduleOrder: ['M0','M1','M2','M3','M4','M5','M6','M7','M8','M9','M10','M11','M12','M13','C1','C2','C3','C4','C5','C6','C7','C8','C9']
    },
    chinese: {
      name: '语文', logo: 'assets/logo-chinese.webp', desc: '拼音、写字与综合练习',
      sectionLabel: '📚 选择题型', footTip: '💡 更多题型持续更新中，敬请期待',
      qtLabels: { pinyin: '拼音', char: '写字', word: '词语', sentence: '句式', poem: '古诗', reading: '阅读', writing: '写作', comprehensive: '综合' },
      moduleOrder: ['N1','N2','N3','N4','N5','N6','N7','N8']
    },
    english: {
      name: '英语', logo: 'assets/logo-english.webp', desc: '字母与单词启蒙练习',
      sectionLabel: '🔠 选择题型', footTip: '💡 更多英语题型持续开发中，敬请期待',
      qtLabels: { alphabet: '字母', vocab: '词汇', grammar: '语法', dialogue: '对话', reading: '阅读', comprehensive: '综合' },
      moduleOrder: ['E1','E2','E3','E4','E5','E6']
    }
  };

  var params = new URLSearchParams(window.location.search);
  var subject = params.get('subject') || 'math';
  var config = SUBJECT_CONFIG[subject];

  if (!config) {
    document.title = '学科参数有误';
    renderErrorState('🧭', '学科参数好像不对',
      '收到的学科参数是「' + esc(String(subject).slice(0, 20)) + '」，目前支持 数学 / 语文 / 英语。<br>请从首页重新选择科目。');
    return;
  }

  // 年级校验
  var rawGrade = params.get('grade');
  var GRADE_VALID = ['1', '2', '3', '4', '5', '6'];
  if (rawGrade !== null && GRADE_VALID.indexOf(rawGrade) === -1) {
    document.title = '年级参数有误 · ' + config.name + '练习';
    renderErrorState('🧭', '年级参数好像不对',
      '收到的年级参数是「' + esc(String(rawGrade).slice(0, 20)) + '」，有效范围为 1~6。<br>请从首页重新选择年级。');
    return;
  }

  // 科目主题色
  var subjectTheme = {
    math: { primary: 'var(--math-primary)', primarySoft: 'rgba(74,144,217,0.12)', cardBg: 'linear-gradient(135deg, rgba(74,144,217,0.15), rgba(74,144,217,0.05))', cardBorder: 'rgba(74,144,217,0.2)', bodyBg: 'linear-gradient(160deg, #eaf3ff 0%, #dbeafe 48%, #cfe6ff 100%)' },
    chinese: { primary: 'var(--cn-primary)', primarySoft: 'rgba(56,161,105,0.12)', cardBg: 'linear-gradient(135deg, rgba(56,161,105,0.15), rgba(56,161,105,0.05))', cardBorder: 'rgba(56,161,105,0.2)', bodyBg: 'linear-gradient(160deg, #eafaf1 0%, #d6f2e3 48%, #c8ecd8 100%)' },
    english: { primary: 'var(--en-primary)', primarySoft: 'rgba(245,166,35,0.12)', cardBg: 'linear-gradient(135deg, rgba(245,166,35,0.15), rgba(245,166,35,0.05))', cardBorder: 'rgba(245,166,35,0.2)', bodyBg: 'linear-gradient(160deg, #fff6e8 0%, #ffeccb 48%, #ffe2bb 100%)' }
  };
  var theme = subjectTheme[subject] || subjectTheme.math;
  document.documentElement.style.setProperty('--subject-primary', theme.primary);
  document.documentElement.style.setProperty('--subject-primary-soft', theme.primarySoft);
  document.documentElement.style.setProperty('--type-card-bg', theme.cardBg);
  document.documentElement.style.setProperty('--type-card-border', theme.cardBorder);
  document.documentElement.style.setProperty('--subject-body-bg', theme.bodyBg);

  var grade = App.currentGrade();

  // 设置页面内容
  document.getElementById('subjectLogo').src = config.logo;
  document.getElementById('subjectLogo').alt = config.name;
  document.getElementById('subjectTitle').textContent = config.name;
  document.getElementById('subjectDesc').textContent = config.desc;
  document.getElementById('sectionLabel').textContent = config.sectionLabel;
  document.getElementById('footTip').textContent = config.footTip;
  document.getElementById('gradeBadge').textContent = App.getGradeName(grade);
  document.title = App.getGradeName(grade) + config.name + '练习';

  // 主渲染
  function renderCatalog() {
    var grouped = window.CatalogUtils.groupKPsByModule(subject, grade);
    if (!grouped || Object.keys(grouped).length === 0) {
      document.getElementById('typeGrid').innerHTML =
        window.App.UIState.emptyHtml('📭', '该年级暂无可用题型',
          '这个年级的' + config.name + '题型还在准备中，试试切换其他年级。',
          '<a class="est-btn" href="?grade=1&subject=' + encodeURIComponent(subject) + '">🌱 从一年级开始</a>');
      return;
    }

    var html = '';
    config.moduleOrder.forEach(function (mid) {
      var g = grouped[mid];
      if (!g) return;
      var qts = window.CatalogUtils.getModuleQuestionTypes(subject, grade, mid);
      if (!qts.length) return;

      html += window.CatalogUtils.renderModuleCard({
        subject: subject,
        grade: grade,
        module: g.module,
        questionTypes: qts
      });
    });

    // 综合练习卡（若有对应插件）
    var compId = subject === 'chinese' ? 'chinese-comprehensive' : (subject === 'english' ? 'english-comprehensive' : 'math-comprehensive');
    html += '<a href="' + window.App.buildPluginLink(compId) + '" class="type-card comprehensive">' +
      '<span class="t-title">综合练习</span></a>';

    document.getElementById('typeGrid').innerHTML = html;
  }

  function waitForKnowledgeBank(cb) {
    if (typeof window.KnowledgeBank !== 'undefined' &&
        window.KnowledgeBank[subject === 'math' ? 'math' : subject] &&
        window.KnowledgeBank[subject === 'math' ? 'math' : subject].length > 0) {
      cb();
    } else {
      setTimeout(function () { waitForKnowledgeBank(cb); }, 50);
    }
  }

  waitForKnowledgeBank(renderCatalog);
})();
</script>
</body>
</html>
