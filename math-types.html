<script>
(function () {
  'use strict';

  // ---- 年级参数校验：显式传入但非法（如 grade=99/abc）→ 友好错误页，不再静默回退 ----
  var rawGrade = new URLSearchParams(location.search).get('grade');
  var GRADE_VALID = ['1', '2', '3', '4', '5', '6'];
  // HTML 转义：URL 参数等不可信文本不得直插 innerHTML（防脚本注入）
  function esc(s) {
    var d = document.createElement('div');
    d.textContent = (s == null) ? '' : String(s);
    return d.innerHTML;
  }
  function renderErrorState(icon, errTitle, desc) {
    document.getElementById('typeGrid').innerHTML =
      '<div class="error-state">' +
      '  <div class="es-icon">' + icon + '</div>' +
      '  <div class="es-title">' + errTitle + '</div>' +
      '  <div class="es-desc">' + desc + '</div>' +
      '  <div class="es-actions">' +
      '    <a class="es-btn primary" href="index.html">返回首页</a>' +
      '    <a class="es-btn ghost" href="?grade=1">从一年级开始</a>' +
      '  </div>' +
      '</div>';
  }

  if (rawGrade !== null && GRADE_VALID.indexOf(rawGrade) === -1) {
    document.title = '年级参数有误 · 数学练习';
    renderErrorState('🧭', '年级参数好像不对',
      '收到的年级参数是「' + esc(String(rawGrade).slice(0, 20)) + '」，有效范围为 1~6。<br>请从首页重新选择年级。');
    return;
  }

  var grade = App.currentGrade();
  document.getElementById('gradeBadge').textContent = App.getGradeName(grade);
  // 页面标题动态更新：「{年级}年级{学科}练习」
  document.title = App.getGradeName(grade) + '数学练习';

  // 领域内部顺序（分组不显示标题，仅用于排序）
  var CATEGORY_ORDER = ['number', 'geometry', 'statistics'];

  // 难度近似（MODULE_CATALOG 无 difficulty 字段）：基础=1 / 进阶=2 / 竞赛=3
  function diffProxy(p) {
    var mid = p.moduleId;
    var mod = mid && window.MODULE_CATALOG && window.MODULE_CATALOG.byId ? window.MODULE_CATALOG.byId(mid) : null;
    if (!mod) return 5;
    return mod.level === 'competition' ? 3 : (mod.level === 'advanced' ? 2 : 1);
  }

  var COMPREHENSIVE = {
    id: 'math-comprehensive',
    name: '综合练习'
  };

  var registry = (typeof window.PLUGIN_REGISTRY !== 'undefined') ? window.PLUGIN_REGISTRY : [];
  var regById = {};
  registry.forEach(function (p) { regById[p.id] = p; });

  // 知识点数据来自统一知识库（按科目分片）。math 分片已由 <script src="shared/knowledge-math.js">
  // 在文档头部同步注入（global.KnowledgeBank.math），故此处可直接摄取，驱动排序与标签。
  var unitOrder = {};   // pluginId -> 知识点在知识库中首次出现的位置（模块序 + 模块内序）
  var kTags = {};       // pluginId -> [具体题型名称, ...]（卡片标签展示）
  var kWeight = {};     // pluginId -> 知识点 weight 之和（用于排序）
  var kModule = {};     // pluginId -> 所属模块 ID（取首个知识点）
  function ingestKEntries() {
    var kEntries = (typeof window.KnowledgeBank !== 'undefined')
      ? window.KnowledgeBank.getEntries('math', grade) : [];
    kEntries.forEach(function (e, idx) {
      if (!unitOrder[e.pluginId]) unitOrder[e.pluginId] = idx + 1;
      if (!kTags[e.pluginId]) kTags[e.pluginId] = [];
      if (e && e.name) kTags[e.pluginId].push(e.name);
      kWeight[e.pluginId] = (kWeight[e.pluginId] || 0) + (e.weight || 0);
      if (e && e.moduleId && !kModule[e.pluginId]) kModule[e.pluginId] = e.moduleId;
    });
  }

  // 模块目录（moduleId -> 名称），用于卡片主标题；插件名/描述作辅助
  var MODULE_NAMES = {};
  if (typeof window.MODULE_CATALOG !== 'undefined') {
    window.MODULE_CATALOG.forEach(function (m) { MODULE_NAMES[m.id] = m.name; });
  }
  function moduleNameOf(p) {
    var mid = kModule[p.id] || p.moduleId;
    return (mid && MODULE_NAMES[mid]) ? MODULE_NAMES[mid] : null;
  }

  // 统一走 App.PluginLoader：按年级加载本学科全部插件并读取其元数据（含竞态安全与缓存）
  App.PluginLoader.loadSubjectPlugins('math', grade).then(function (plugins) {
    // 分片已就绪：摄取知识点元数据（排序权重/模块归属）
    ingestKEntries();
    // 普通题型（排除综合插件、已并入「单位的认识」的 math-money、
    // 已并入「看图列式」的 math-patterns，单独渲染其专属样式）
    var applicable = plugins.filter(function (p) {
      return p.id !== COMPREHENSIVE.id && p.id !== 'math-money' && p.id !== 'math-patterns'
        && p.grades && p.grades.indexOf(grade) !== -1;
    });

    // 排序：难度近似升序（基础→进阶→竞赛）优先，其次按知识库出现顺序，同级按 weight 降序
    // 竞赛占位插件无知识库条目，按模块目录 C 系列顺序排在基础题型之后
    var compModules = (typeof window.COMPETITION_MODULES !== 'undefined') ? window.COMPETITION_MODULES : [];
    var compOrder = {};
    compModules.forEach(function (m, i) { compOrder[m.id] = i; });
    applicable.sort(function (a, b) {
      var da = diffProxy(a), db = diffProxy(b);
      if (da !== db) return da - db;
      var oa = unitOrder[a.id] || 9999;
      var ob = unitOrder[b.id] || 9999;
      if (oa !== ob) return oa - ob;
      return (kWeight[b.id] || 0) - (kWeight[a.id] || 0);
    });

    // 渲染项展开：普通插件 1:1；占位插件按 registry 条目声明的 moduleIds 展开为多个卡片
    // （四年级基础占位 math-g4-* 与竞赛占位共享同一运行时文件，身份区分须以 registry 为准）
    var moduleById = {};
    var moduleOrder = {};
    if (typeof window.MODULE_CATALOG !== 'undefined') {
      window.MODULE_CATALOG.forEach(function (m, mi) {
        moduleById[m.id] = m;
        moduleOrder[m.id] = mi;
      });
    }
    // 占位运行时对象按加载到的插件（文件相同则共享同一对象，取其一即可作渲染模板）
    var placeholderByFile = {};
    plugins.forEach(function (p) {
      if (p.isPlaceholder) {
        var rec = regById[p.id] || {};
        placeholderByFile[rec.file || p.id] = p;
      }
    });
    var items = [];
    // 非占位插件直接追加（math-preview 例外：特殊模块卡，在综合练习之后单独渲染）
    applicable.forEach(function (p) {
      if (!p.isPlaceholder && p.id !== 'math-g1-multiplication-table') items.push({ p: p, mod: null });
    });
    // 占位插件按「当前年级该模块仍为 placeholder」展开为卡片（grade 感知）：
    // 五年级 C1/C4/C6/C8 等未实现模块以占位卡片展示；四年级已实现模块不重复出现占位卡。
    registry.forEach(function (rec) {
      if (!rec.isPlaceholder) return;
      if (rec.grades && rec.grades.indexOf(grade) === -1) return;
      var obj = placeholderByFile[rec.file] || placeholderByFile[rec.id] || placeholderByFile[rec.runtimeId];
      if (!obj) return;
      var pMods = compModules.filter(function (m) {
        if (!m.gradeStatus || m.gradeStatus[grade] !== 'placeholder') return false;
        // 仅展示该年级确实登记了知识点的模块（避免空模块占位卡）
        var gb = (typeof window.KnowledgeBank !== 'undefined' && window.KnowledgeBank.findGrade) ? window.KnowledgeBank.findGrade("math", grade) : null;
        var hasKp = gb && gb.modules.some(function (bm) { return bm.moduleId === m.id && bm.knowledgePoints.length > 0; });
        return hasKp;
      });
      if (!pMods.length) return;
      pMods.forEach(function (m) {
        items.push({ p: obj, mod: m });
      });
    });
    // 占位卡片按模块目录顺序排序（基础 M 系列在前，竞赛 C 系列在后）
    items.sort(function (a, b) {
      if (a.mod && b.mod) {
        var oa = moduleOrder[a.mod.id], ob = moduleOrder[b.mod.id];
        if (oa !== ob) return oa - ob;
      }
      return 0;
    });

    var html = '';
    // 指定题型的显示覆盖：仅调整题型卡片的主标题，不改知识库与注册表。
    // 「数的认识」主标题由模块名「填空题」改为知识点名，具体题型以标签展示。
    // 「单位的认识」合并认识钟表与认识人民币两张卡片，主标题/标签按指定文案展示。
    var DISPLAY_OVERRIDES = {
      'math-number-sense': { name: '数的认识' },
      'math-clock': { name: '单位的认识' },
      'math-shapes': { name: '认识图形' },
      'math-word-problems': { name: '应用题' }
    };

    // 是否为竞赛题型：C 系列模块占位卡，或 math-competition-* 插件
    function isCompetitionItem(it) {
      if (it.m && it.m.id && it.m.id.charAt(0) === 'C') return true;
      var pid = it.p && it.p.id;
      return typeof pid === 'string' && pid.indexOf('math-competition') === 0;
    }
    // 单张卡片 HTML（不含分区标题）
    function renderCard(it) {
      var p = it.p, m = it.mod;
      var kp = (regById[p.id] && regById[p.id].name) ? regById[p.id] : null;
      var ov = DISPLAY_OVERRIDES[p.id] || null;
      var modName = m ? m.name : moduleNameOf(p);
      var name = ov ? ov.name : (modName || (kp && kp.name) || p.name);
      var desc = (kp && kp.desc) || '';
      var href = m ? (App.buildPluginLink(p.id) + '&module=' + m.id) : App.buildPluginLink(p.id);
      // 具体题型标签：严格只来自知识库该插件覆盖的知识点（最多展示 3 个 +「+N」）
      var tags = ov ? (ov.tags || (kTags[p.id] || [])).slice() : (kTags[p.id] || []).slice();
      var tagHtml = '';
      if (tags.length) {
        var shown = tags.slice(0, 3);
        tagHtml = '<span class="t-tags">' +
          shown.map(function (t) { return '<span class="t-tag" title="' + t.replace(/"/g, '&quot;') + '">' + t + '</span>'; }).join('') +
          (tags.length > shown.length ? '<span class="t-tag more" title="还有 ' + (tags.length - shown.length) + ' 个知识点">+' + (tags.length - shown.length) + '</span>' : '') +
          '</span>';
      }
      return (p.isPlaceholder
        ? '<div class="type-card competition" title="' + desc + '">'
        : '<a href="' + href + '" class="type-card' + (p.isPlaceholder ? ' competition' : '') + '" title="' + desc + '">') +
        '<span class="t-title">' + name + '</span>' + tagHtml +
        (p.isPlaceholder ? '</div>' : '</a>');
    }
    // 综合练习按钮（随注册表/插件元数据命名）；点击进入综合练习页，
    // 「期末模拟卷」作为综合练习内的一种试卷模式（练习页内可选，不单独占卡片）
    function renderComprehensive() {
      var kc = (regById[COMPREHENSIVE.id]) ? regById[COMPREHENSIVE.id] : null;
      var base = '<a href="' + App.buildPluginLink(COMPREHENSIVE.id) + '" class="type-card comprehensive">' +
        '<span class="t-title">' + ((kc && kc.name) || COMPREHENSIVE.name) + '</span></a>';
      // 二年级新增「期末模拟卷」入口：走固定试卷模板（practice.html?...&subtype=exam）
      var exam = (grade === 2)
        ? '<a href="' + App.buildPluginLink(COMPREHENSIVE.id) + '&subtype=exam" class="type-card comprehensive exam"' +
          ' title="二年级期末模拟卷 · 十大部分固定模板"><span class="t-title">期末模拟卷</span></a>'
        : '';
      return base + exam;
    }
    // M13 提前预习特殊卡（草绿，仅一年级）
    function renderPreview() {
      var m13 = (grade === 1) ? moduleById['M13'] : null;
      if (!m13 || !m13.display) return '';
      var pvTags = (m13.display.tags || []).map(function (t) { return '<span class="t-tag">' + t + '</span>'; }).join('');
      return '<a href="' + App.buildPluginLink('math-g1-multiplication-table') + '" class="type-card preview-card"' +
        ' title="乘法表 · 除法表 · 乘除法填空（二年级上册预习）">' +
        '<span class="t-title">' + m13.name + '</span>' + (pvTags ? '<span class="t-tags">' + pvTags + '</span>' : '') + '</a>';
    }

    // 1-3 年级：无竞赛题型，统一归入「选择常规题型」单板块；4-6 年级：拆为「选择常规题型 / 竞赛题型」两大板块
    // 每个板块末尾均置「综合练习」卡（样式一致，紫色 .type-card.comprehensive）；竞赛板块的综合为板块末卡
    if (grade >= 4) {
      html += '<div class="section-heading">常规题型</div>';
      html += items.filter(function (it) { return !isCompetitionItem(it); }).map(renderCard).join('');
      html += renderComprehensive();
      html += '<div class="section-heading">竞赛题型</div>';
      // 竞赛综合（C9 模块）固定为板块末卡；其余竞赛题按原序
      var compItems = items.filter(isCompetitionItem);
      compItems.sort(function (a, b) {
        var aC9 = (a.mod && a.mod.id === 'C9') ? 1 : 0;
        var bC9 = (b.mod && b.mod.id === 'C9') ? 1 : 0;
        return aC9 - bC9;
      });
      html += compItems.map(renderCard).join('');
    } else {
      html += '<div class="section-heading">常规题型</div>';
      html += items.map(renderCard).join('');
      html += renderPreview();
      html += renderComprehensive();
    }

    document.getElementById('typeGrid').innerHTML = html;

    // 预热：当前年级插件已加载并缓存，配合 Service Worker 让点击进入练习页更快
    App.PluginLoader.prefetch(plugins);
  }).catch(function (err) {
    document.getElementById('typeGrid').innerHTML =
      App.UIState.bannerHtml('⚠️', '题型加载失败', (err && err.message) || '未知错误',
        '<button type="button" class="eb-btn eb-btn--primary" onclick="location.reload()">重试</button>');
  });
})();
</script>
</body>
</html>
