<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数学题型选择</title>
<link rel="stylesheet" href="common.css">
<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
        min-height: 100vh;
        padding: 30px 20px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .type-card:hover { border-color: #667eea; }
    .type-card:hover .t-name { color: #667eea; }
    .section-label { border-left-color: #667eea; }
    .grade-badge { color: #667eea; }
</style>
</head>
<body>
<div class="wrapper">
    <a href="index.html" class="back-home">← 返回首页</a>

    <div class="page-header">
        <div class="logo">🧮</div>
        <h1>数学练习<span class="grade-badge" id="gradeBadge">一年级</span></h1>
        <p>请选择要练习的题型</p>
    </div>

    <div class="card">
        <div class="section-label">📐 选择题型</div>
        <div class="type-grid two-col" id="typeGrid">
            <a href="math-practice.html" class="type-card" id="calcLink">
                <span class="t-icon">🔢</span>
                <div class="t-name">口算练习</div>
                <div class="t-desc">加减乘除 · 在线答题<br>自动评分 · 错题重做</div>
            </a>
            <a href="math-word-problems.html" class="type-card" id="wordLink">
                <span class="t-icon">📝</span>
                <div class="t-name">应用题</div>
                <div class="t-desc">生活场景 · 分年级<br>解题思路 · 在线批改</div>
            </a>
            <a href="math-make-ten.html" class="type-card" id="cushiLink" style="border-color:#f6ad55;">
                <span class="t-icon">🧩</span>
                <div class="t-name" style="color:#dd6b20;">凑十法·平十法</div>
                <div class="t-desc">凑十法加法 · 平十法减法<br>一年级数学基础</div>
            </a>
        </div>
    </div>

    <div class="foot-tip">💡 选择题型后进入对应练习页面，每个题型独立生成题目</div>
</div>

<script src="common.js"></script>
<script>
const grade = App.currentGrade();
document.getElementById('gradeBadge').textContent = App.getGradeName(grade);
document.getElementById('calcLink').href = App.buildLink('math-practice.html');
document.getElementById('wordLink').href = App.buildLink('math-word-problems.html');
document.getElementById('cushiLink').href = App.buildLink('math-make-ten.html');
if (grade !== 1) { document.getElementById('cushiLink').style.display = 'none'; }
</script>
</body>
</html>
