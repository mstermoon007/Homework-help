name: Homework Help CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  verify:
    name: Run Verification Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 项目零运行时依赖，npm install 仅为锁定环境兼容（无 install 脚本）
      - name: Install dependencies
        run: npm install

      # ---- 冻结基线（v4.3.0）门禁链 ----
      - name: check:sw-version（SW 缓存名与 APP_VERSION 同步）
        run: npm run check:sw-version

      - name: check-lint（静态质量检查）
        run: npm run check-lint

      - name: verify:syntax（全量 JS 语法门禁）
        run: npm run verify:syntax

      # ---- Node 单元/契约测试全套 ----
      - name: npm test
        run: npm test

      # ---- M0 聚合门禁（kbl validate+runtime+uniqueness+access+dir）----
      - name: verify（M0 gate）
        run: npm run verify

      # ---- 结果汇总 ----
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-results
          path: |
            dev/reports/
          retention-days: 30
