name: Homework Help CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  verify:
    name: check-all
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 项目零运行时依赖，npm install 仅为锁定环境兼容（无 install 脚本）
      - name: Install dependencies
        run: npm install

      # ---- 唯一全量检查入口（与本地 npm run check-all 完全一致）----
      - name: check-all（17 域全量门禁）
        run: npm run check-all

      # ---- 结果汇总 ----
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-results
          path: |
            dev/reports/
          retention-days: 30
