name: Homework Help CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  verify:
    name: Run Verification Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # ---- 核心验证 ----
      - name: verify-setup
        run: node dev/verify-setup.js

      # ---- 任务1.2 / 1.3：版本与注册表一致性（CI 捕获不一致） ----
      - name: check:sw-version
        run: npm run check:sw-version

      - name: check:registry
        run: npm run check:registry

      - name: check:contrast
        run: npm run check:contrast

      # ---- P1-R01：UI→Engine 边界（唯一生成入口 = GenerationEngine.generate）----
      - name: check:ui-boundary
        run: node dev/check-ui-boundary.js

      # ---- P4-R05：Legacy 下线条件门禁（生产调用=0/Adapter调用=0/R30通过）----
      - name: check:p4-legacy-gate
        run: node dev/check-p4-legacy-gate.js

      # ---- P3-R04：Practice 页面职责（无 Plugin/Strategy/Generator/Legacy/难度/SVG 判断）----
      - name: check:practice-page
        run: node dev/check-practice-page.js

      - name: verify-knowledge-bank
        run: node dev/verify-knowledge-bank.js

      - name: regression-check
        run: node dev/regression-check.js

      # ---- 新增检查 ----
      - name: concurrency-check
        run: node dev/concurrency-check.js

      - name: performance-budget
        run: node dev/performance-budget.js

      # ---- P9：Frozen Core 保护门禁（核心文件完整性校验）----
      - name: check:frozen-core
        run: node dev/check-frozen-core.js --check

      # ---- 插件接口合规性 ----
      - name: check-plugin-interfaces
        run: node dev/check-plugin-interfaces.js --report

      # ---- 任务4.1 / 4.2：Node 单元与插件生成测试 ----
      - name: test:plugins
        run: npm run test:plugins

      - name: test:unit
        run: npm run test:unit

      # ---- 结果汇总 ----
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-results
          path: |
            dev/reports/
            **.html
            **.txt
          retention-days: 30