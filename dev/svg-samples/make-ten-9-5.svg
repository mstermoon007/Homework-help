<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 194.4" width="300" height="194.4" role="img" preserveAspectRatio="xMidYMid meet"><text x="150" y="26" font-size="15" font-family="Menlo, Consolas, monospace" fill="#7a879c" text-anchor="middle" font-weight="700">凑十法</text><text x="150" y="58" font-size="22" font-family="Menlo, Consolas, monospace" text-anchor="middle" font-weight="700"><tspan fill="#27324a">9 + 5 = ?</tspan></text><text x="150" y="92.1" font-size="22" font-family="Menlo, Consolas, monospace" text-anchor="middle" font-weight="700"><tspan fill="#27324a">5 = </tspan><tspan fill="#3f6fd1">1</tspan><tspan fill="#27324a"> + </tspan><tspan fill="#d9822b">4</tspan></text><text x="150" y="126.2" font-size="22" font-family="Menlo, Consolas, monospace" text-anchor="middle" font-weight="700"><tspan fill="#27324a">(</tspan><tspan fill="#3f6fd1">9 + 1</tspan><tspan fill="#27324a">) ＋ </tspan><tspan fill="#d9822b">4</tspan></text><text x="150" y="160.3" font-size="22" font-family="Menlo, Consolas, monospace" text-anchor="middle" font-weight="700"><tspan fill="#27324a">= 10 + 4 = </tspan><tspan fill="#e05252">14</tspan></text></svg>