<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小学1-3年级数学应用题练习</title>
<link rel="stylesheet" href="common.css">
<style>
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(180deg,#eaf2ff 0%,#f3f7fb 220px,#f3f7fb 100%);
    color:var(--ink);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1200px;margin:0 auto;padding:16px 16px 60px}

  header.hero{
    text-align:center;padding:18px 10px 10px;
  }
  header.hero h1{
    margin:0;font-size:26px;letter-spacing:1px;
    background:linear-gradient(90deg,#5b8def,#7c5cff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  header.hero p{margin:8px 0 0;color:var(--muted);font-size:14px}

  .panel{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    box-shadow:var(--shadow);padding:18px 18px;margin:16px 0;
  }
  .panel h2{margin:0 0 12px;font-size:15px;color:var(--muted);font-weight:700;letter-spacing:.5px}

  .seg{display:flex;flex-wrap:wrap;gap:10px}
  .seg button{
    flex:1 1 auto;min-width:84px;max-width:200px;cursor:pointer;border:1.5px solid var(--line);
    background:#fff;color:var(--ink);border-radius:12px;padding:12px 10px;font-size:15px;
    font-weight:600;transition:.15s;
  }
  .seg button .sub{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-top:2px}
  .seg button:hover{border-color:var(--brand)}
  .seg button.active{background:var(--brand);border-color:var(--brand);color:#fff}
  .seg button.active .sub{color:rgba(255,255,255,.85)}

  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:14px}
  .count-group{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .count-group .lbl{font-size:14px;color:var(--muted);margin-right:2px}
  .chip{
    cursor:pointer;border:1.5px solid var(--line);background:#fff;color:var(--ink);
    border-radius:10px;padding:8px 14px;font-size:14px;font-weight:600;transition:.15s;
  }
  .chip:hover{border-color:var(--brand)}
  .chip.active{background:var(--brand-d);border-color:var(--brand-d);color:#fff}
  .count-group input[type=number]{
    width:74px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;
    font-size:14px;color:var(--ink);text-align:center;
  }

  .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .btn{
    cursor:pointer;border:none;border-radius:12px;padding:12px 20px;font-size:15px;font-weight:700;
    transition:.15s;
  }
  .btn-primary{background:linear-gradient(90deg,#5b8def,#6f6bff);color:#fff;box-shadow:0 6px 16px rgba(91,141,239,.35)}
  .btn-primary:hover{filter:brightness(1.05)}
  .btn-ghost{background:#eef3fb;color:var(--brand-d)}
  .btn-ghost:hover{background:#e2ebf9}

  .info{font-size:13px;color:var(--muted);margin-top:12px}
  .info b{color:var(--ink)}

  .problem-title{
    text-align:center;font-size:20px;font-weight:800;color:var(--ink);
    margin:0 0 10px;padding:0;
  }

  .meta{display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:8px}
  .meta .pill{background:#eef3fb;color:var(--brand-d);border-radius:999px;padding:4px 12px;font-weight:600}

  .problem{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    box-shadow:var(--shadow);padding:16px 16px 16px 52px;margin:12px 0;position:relative;
  }
  .problem .num{
    position:absolute;left:14px;top:16px;width:26px;height:26px;border-radius:50%;
    background:#eef3fb;color:var(--brand-d);font-weight:800;font-size:14px;
    display:flex;align-items:center;justify-content:center;
  }
  .problem .q{font-size:16px;margin:0 0 10px;line-height:1.7}
  .problem .ans{
    display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  }
  .problem .ans .formula-hint{
    font-size:14px;font-weight:600;white-space:nowrap;
  }
  .problem .ans .formula-placeholder{
    color:var(--muted);
  }
  .problem .ans .input-group{
    display:flex;align-items:center;gap:8px;flex-shrink:0;
  }
  .problem input{
    width:120px;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;
    font-size:16px;color:var(--ink);outline:none;transition:.15s;
  }
  .problem input:focus{border-color:var(--brand)}
  .problem .unit{font-size:14px;color:var(--muted)}
  .problem .feedback{font-size:13px;font-weight:700;min-height:18px}
  .problem.correct{border-color:var(--ok);background:var(--ok-bg)}
  .problem.wrong{border-color:var(--bad);background:var(--bad-bg)}
  .problem .reveal{font-size:13px;color:var(--warn);font-weight:600}
  .problem .reveal.hide{display:none}
  .problem .badge{position:absolute;right:14px;top:14px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px}
  .problem .badge.adv{background:#fdeccd;color:#c87a16}
.problem .badge.basic{background:#eef3fb;color:#5b8def}
.problem .badge.high{background:#fdeef0;color:#e0556b}
  .problem .step-hint{
    font-size:12px;color:var(--brand-d);margin-top:6px;padding:6px 10px;
    background:#eef3fb;border-radius:8px;display:none;
  }
  .problem .step-hint.show{display:block}

  .result{
    background:linear-gradient(135deg,#eef4ff,#f6efff);border:1px solid var(--line);
    border-radius:16px;padding:18px;margin:16px 0;text-align:center;box-shadow:var(--shadow);
  }
  .result .score{font-size:34px;font-weight:800;color:var(--brand-d)}
  .result .detail{font-size:14px;color:var(--ink);margin-top:4px}
  .result .tips{font-size:13px;color:var(--muted);margin-top:8px}

  .empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}

  .history-box{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:14px 18px;margin:12px 0;box-shadow:var(--shadow);
  }
  .history-box h3{font-size:14px;color:var(--muted);margin:0 0 8px}
  .history-item{font-size:13px;color:var(--ink);padding:4px 0;border-bottom:1px dashed var(--line)}
  .history-item:last-child{border-bottom:none}

  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <div style="margin-bottom:10px;">
    <a href="math-types.html" class="back-home" id="backLink">← 返回题型选择</a>
  </div>

  <header class="hero">
    <h1>🧮 <span id="gradeTitle">一年级</span>数学应用题</h1>
    <p>参考人教版教材与常见练习册题型 · 随机生成 · 在线作答 · 一键打印</p>
  </header>

  <section class="panel controls">
    <div class="row">
      <div class="count-group">
        <span class="lbl">① 题目数量：</span>
        <button class="chip active" data-count="5">5题</button>
        <button class="chip" data-count="10">10题</button>
        <button class="chip" data-count="20">20题</button>
        <input type="number" id="customCount" min="1" max="50" placeholder="自定义">
      </div>
      <div class="helper-note" style="margin-top:6px">推荐 5-10 题，打印输出刚好填满一张 A4 纸</div>
    </div>

    <div class="row">
      <div class="count-group">
        <span class="lbl">② 难度：</span>
        <button class="chip active" data-diff="mix">混合</button>
        <button class="chip" data-diff="basic">基础</button>
        <button class="chip" data-diff="adv">进阶</button>
        <button class="chip" data-diff="high">高阶</button>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="genBtn">🎲 生成练习题</button>
      <button class="btn btn-primary" id="checkBtn">✅ 检查答案</button>
      <button class="btn btn-ghost" id="hintBtn">💡 解题思路</button>
      <button class="btn btn-ghost" id="revealBtn">👀 显示答案</button>
      <button class="btn btn-ghost" id="printBtn">📄 生成打印文件</button>
    </div>

    <div class="row" style="margin-top:16px;border-top:1px dashed var(--line);padding-top:12px">
      <div class="count-group">
        <span class="lbl" style="color:var(--muted)">③ 后续功能：</span>
        <span style="font-size:13px;color:var(--muted)">敬请期待更多功能…</span>
      </div>
    </div>
  </section>

  <section id="problemsArea">
    <div class="empty">点击「生成练习题」开始吧～ 可以切换题量和难度哦。</div>
  </section>

  <div id="resultArea"></div>

  <div class="history-box" id="historyBox" style="display:none;">
    <h3>📊 练习记录</h3>
    <div id="historyList"></div>
  </div>

  <footer>题目由程序随机生成，仅供参考练习。如有疑问以教材为准。</footer>
</div>

<script src="common.js"></script>
<script src="print.js"></script>
<script src="math-word-problem-agent.js"></script>
<script>
// 使用 App.randInt, App.shuffle, App.rand（来自 common.js）
function rnd(min,max){ return App.randInt(min,max); }
function shuffleArr(arr) { return App.shuffle(arr); }
function pick(arr){ return App.rand(arr); }

/* ============ 三年级：万以内加减、倍、多位数乘、周长、除法、时分秒、分数 ============ */
const G3 = [
  // 万以内加法
  function(){let a=rnd(100,5000),b=rnd(100,Math.max(200,5000-a));
    return {q:`果园里有 ${a} 棵苹果树，又栽了 ${b} 棵梨树，现在一共有多少棵果树？`,a:a+b,unit:"棵",hint:`列竖式相加：${a}+${b}=${a+b}，注意数位对齐`};},
  // 万以内减法
  function(){let a=rnd(500,5000),b=rnd(100,a-1);
    return {q:`图书馆有 ${a} 本书，借出去 ${b} 本，还剩多少本？`,a:a-b,unit:"本",hint:`从总数中减去借出的：${a}-${b}=${a-b}`};},
  // 倍的认识
  function(){let a=rnd(4,20),b=rnd(2,8);
    return {q:`池塘里有 ${a} 只鸭，鹅的只数是鸭的 ${b} 倍，鹅有多少只？`,a:a*b,unit:"只",hint:`求 ${a} 的 ${b} 倍：${a}×${b}=${a*b}`};},
  // 求一个数是另一个数的几倍
  function(){let b=rnd(2,9),a=b*rnd(3,15);
    return {q:`红气球有 ${a} 个，蓝气球有 ${b} 个，红气球是蓝气球的几倍？`,a:a/b,unit:"倍",hint:`求 ${a} 是 ${b} 的几倍：${a}÷${b}=${a/b}`};},
  // 多位数乘一位数
  function(){let a=rnd(12,999),b=rnd(2,9);
    return {q:`买 ${b} 盒彩笔，每盒 ${a} 元，一共要多少元？`,a:a*b,unit:"元",hint:`${b} 个 ${a} 元：${a}×${b}=${a*b} 元`};},
  // 除数是一位数的除法
  function(){let b=rnd(2,9),a=b*rnd(11,99);
    return {q:`把 ${a} 个苹果平均分给 ${b} 个班，每班分到几个？`,a:a/b,unit:"个",hint:`平均分：${a}÷${b}=${a/b} 个`};},
  // 长方形周长
  function(){let a=rnd(5,40),b=rnd(3,a-1);
    return {q:`一个长方形花坛长 ${a} 米，宽 ${b} 米，它的周长是多少米？`,a:2*(a+b),unit:"米",hint:`长方形周长=(长+宽)×2：(${a}+${b})×2=${2*(a+b)} 米`};},
  // 正方形周长
  function(){let a=rnd(4,40);
    return {q:`一个正方形手帕边长 ${a} 厘米，它的周长是多少厘米？`,a:4*a,unit:"厘米",hint:`正方形周长=边长×4：${a}×4=${4*a} 厘米`};},
  // 两步应用题
  function(){let a=rnd(2,9),b=rnd(3,12),c=rnd(2,Math.max(3,a*b-5));
    return {q:`小明买了 ${a} 盒铅笔，每盒 ${b} 支，送给同学 ${c} 支，还剩几支铅笔？`,a:a*b-c,unit:"支",hint:`先算一共有多少支：${a}×${b}=${a*b}，再减去送出的：${a*b}-${c}=${a*b-c}`};},
  // 时分秒换算
  function(){let a=rnd(1,9);
    return {q:`${a} 分钟等于多少秒？`,a:a*60,unit:"秒",hint:`1分钟=60秒，${a}×60=${a*60} 秒`};},
  // 经过时间
  function(){let a=rnd(1,9),b=rnd(a+1,12);
    return {q:`电影从 ${a} 时开始，到 ${b} 时结束，放映了几小时？`,a:b-a,unit:"小时",hint:`用结束时间减开始时间：${b}-${a}=${b-a} 小时`};},
  // 简单分数
  function(){let a=rnd(2,10),b=rnd(1,a-1);
    return {q:`把一个蛋糕平均分成 ${a} 块，小明吃了 ${b} 块，小明吃了这个蛋糕的几分之几？`,a:`${b}/${a}`,frac:true,hint:`分母是总块数 ${a}，分子是吃的块数 ${b}：${b}/${a}`};},
  // 面积(长方形)
  function(){let a=rnd(5,30),b=rnd(3,a-1);
    return {q:`一个长方形操场长 ${a} 米，宽 ${b} 米，它的面积是多少平方米？`,a:a*b,unit:"平方米",hint:`长方形面积=长×宽：${a}×${b}=${a*b} 平方米`};},
  // 归一问题
  function(){let a=rnd(2,5),b=a*rnd(2,9),c=rnd(2,6);
    return {q:`买 ${a} 个同样的文具盒用了 ${b} 元，照这样计算，买 ${c} 个这样的文具盒要用多少元？`,a:b/a*c,unit:"元",hint:`先算1个的价格：${b}÷${a}=${b/a}，再算${c}个：${b/a}×${c}=${b/a*c} 元`};},
];

/* ============ 进阶/深度题型（三年级） ============ */
const ADV3 = [
  function(){let b=rnd(2,6),segs=rnd(3,12),a=b*segs;
    return {q:`一个圆形花坛周长 ${a} 米，每隔 ${b} 米放一盆花，一共放几盆？`,a:segs,unit:"盆",depth:"adv",hint:`圆形：段数=棵数。${a}÷${b}=${segs} 段，所以放 ${segs} 盆`};},
  function(){let a=rnd(2,6),b=a*rnd(2,9),c=rnd(2,6);
    return {q:`买 ${a} 支笔用了 ${b} 元，照这样计算，买 ${c} 支笔要用多少元？`,a:b/a*c,unit:"元",depth:"adv",hint:`先求单价：${b}÷${a}=${b/a}，再求${c}支：${b/a}×${c}=${b/a*c} 元`};},
  function(){let b=rnd(2,5),base=rnd(2,9),a=(b+1)*base;
    return {q:`小明和小红一共有 ${a} 颗糖，小红的糖是小明的 ${b} 倍，小明有几颗糖？`,a:base,unit:"颗",depth:"adv",hint:`和倍问题：总份数=${b}+1，小明：${a}÷${b+1}=${base} 颗`};},
  function(){let a=rnd(2,5),b=rnd(3,8),c=rnd(6,12);
    return {q:`教学楼有 ${a} 层，每层 ${b} 间教室，每间坐 ${c} 人，一共可坐多少人？`,a:a*b*c,unit:"人",depth:"adv",hint:`连乘：${a}×${b}=${a*b}，${a*b}×${c}=${a*b*c} 人`};},
  function(){let b=rnd(2,9),c=rnd(2,9),rem=rnd(1,b-1),a=b*c+rem;
    return {q:`有 ${a} 块巧克力，平均分给 ${b} 个小朋友，每人 ${c} 块，还剩几块？`,a:a-b*c,unit:"块",depth:"adv",hint:`已分：${b}×${c}=${b*c}，剩余：${a}-${b*c}=${a-b*c} 块`};},
  function(){let a=rnd(20,60),b=rnd(8,30);
    return {q:`果园里有 ${a} 棵苹果树，${b} 棵梨树，还有 6 只小鸟在树上，苹果树和梨树一共有多少棵？`,a:a+b,unit:"棵",depth:"adv",hint:`6只小鸟是多余条件。只算树：${a}+${b}=${a+b} 棵`};},
  function(){let a=rnd(20,60),b=rnd(8,30),c=rnd(2,5);
    return {q:`一个书包 ${a} 元，一个文具盒 ${b} 元，买这样一套 ${c} 套一共要多少元？`,a:(a+b)*c,unit:"元",depth:"adv",hint:`一套：${a}+${b}=${a+b}，${c}套：${a+b}×${c}=${(a+b)*c} 元`};},
  function(){let a=rnd(2,6),b=rnd(2,8),c=rnd(2,9);
    return {q:`一辆卡车每次运 ${a} 吨，每天运 ${b} 次，运了 ${c} 天，一共运了多少吨？`,a:a*b*c,unit:"吨",depth:"adv",hint:`每天：${a}×${b}=${a*b}吨，${c}天：${a*b}×${c}=${a*b*c}吨`};},
  function(){let a=rnd(10,50),b=rnd(2,8);
    return {q:`一本书有 ${a} 页，每天读 ${b} 页，读了几天后还剩 5 页没读，读了几天？`,a:Math.floor((a-5)/b),unit:"天",depth:"adv",hint:`已读：${a}-5=${a-5}页，天数：${a-5}÷${b}=${Math.floor((a-5)/b)} 天`};},
  function(){let a=rnd(100,500),b=rnd(2,6);
    return {q:`一个工程队修一条 ${a} 米的路，已经修了 ${b} 天，每天修 40 米，还剩多少米？`,a:a-b*40,unit:"米",depth:"adv",hint:`已修：${b}×40=${b*40}米，剩余：${a}-${b*40}=${a-b*40}米`};},
];

/* ============ 高阶题型（三年级） ============ */
const HIGH3 = [
  function(){let a=rnd(20,50),b=rnd(10,30),c=rnd(2,5);
    return {q:`仓库有 ${a} 吨粮食，运走 ${b} 吨后，剩下的分 ${c} 次运完，每次运多少吨？`,a:Math.floor((a-b)/c),unit:"吨",depth:"high",hint:`剩下：${a}-${b}=${a-b}吨，每次：${a-b}÷${c}=${Math.floor((a-b)/c)}吨`};},
  function(){let base=rnd(10,40),b=rnd(2,5),a=base*(b+1);
    return {q:`甲乙两个书架上共有 ${a} 本书，甲书架的书是乙书架的 ${b} 倍，甲书架上有多少本书？`,a:a-base,unit:"本",depth:"high",hint:`和倍问题：乙=总÷(${b}+1)=${a}÷${b+1}=${base}本，甲=${base}×${b}=${a-base}本`};},
  function(){let a=rnd(3,8),b=rnd(2,6),c=rnd(2,5),d=rnd(2,4);
    return {q:`每箱有 ${a} 个苹果，${b} 箱苹果和 ${c} 箱梨，每箱梨 ${d} 个，苹果比梨多几个？`,a:a*b-c*d,unit:"个",depth:"high",hint:`苹果：${a}×${b}=${a*b}个，梨：${c}×${d}=${c*d}个，多：${a*b}-${c*d}=${a*b-c*d}个`};},
  function(){let a=rnd(100,500),b=rnd(20,80),c=rnd(2,5);
    return {q:`修一条 ${a} 米的路，已经修了 ${c} 天，每天修 ${b} 米，还剩多少米没修？`,a:a-b*c,unit:"米",depth:"high",hint:`已修：${b}×${c}=${b*c}米，剩余：${a}-${b*c}=${a-b*c}米`};},
  function(){let a=rnd(20,60),b=rnd(10,40),c=rnd(2,6);
    return {q:`学校买 ${a} 个篮球和 ${b} 个足球，篮球每个 ${c*10} 元，足球每个 ${c*8} 元，买篮球比买足球多用多少元？`,a:a*c*10-b*c*8,unit:"元",depth:"high",hint:`篮球：${a}×${c*10}=${a*c*10}元，足球：${b}×${c*8}=${b*c*8}元，多：${a*c*10}-${b*c*8}=${a*c*10-b*c*8}元`};},
  function(){let a=rnd(20,80),b=rnd(10,40),c=rnd(2,5);
    return {q:`一堆煤重 ${a} 吨，先用去 ${b} 吨，剩下的分 ${c} 天用完，每天用多少吨？`,a:Math.floor((a-b)/c),unit:"吨",depth:"high",hint:`剩下：${a}-${b}=${a-b}吨，每天：${a-b}÷${c}=${Math.floor((a-b)/c)}吨`};},
  function(){let a=rnd(2,5),b=rnd(2,6),c=rnd(2,6);
    return {q:`每袋大米 ${a} 千克，${b} 袋大米和 ${c} 袋面粉，每袋面粉 ${a+2} 千克，大米和面粉一共多少千克？`,a:a*b+c*(a+2),unit:"千克",depth:"high",hint:`大米：${a}×${b}=${a*b}千克，面粉：${c}×${a+2}=${c*(a+2)}千克，合计：${a*b}+${c*(a+2)}=${a*b+c*(a+2)}千克`};},
  function(){let a=rnd(3,8),b=rnd(2,6),c=rnd(2,5);
    return {q:`每本笔记本 ${a} 元，买 ${b} 本送 ${c} 本，付 ${b} 本的钱实际得到 ${b+c} 本，平均每本多少元？`,a:Math.round(a*b/(b+c)*100)/100,unit:"元",depth:"high",hint:`总价：${a}×${b}=${a*b}元，实际${b+c}本，均价：${a*b}÷${b+c}≈${Math.round(a*b/(b+c)*100)/100}元`};},
];

// 标记深度
G3.forEach(f=>f.depth='basic');
ADV3.forEach(f=>f.depth='adv');
HIGH3.forEach(f=>f.depth='high');
const GEN = {3:[...G3,...ADV3,...HIGH3]};
let state = {grade:1, count:5, difficulty:'mix', problems:[], revealed:false, hints:false, timer:null, start:0};
let history = [];

const problemsArea = document.getElementById('problemsArea');
const resultArea = document.getElementById('resultArea');
const customCount = document.getElementById('customCount');

// 初始化年级（使用 App 路由）
const initGrade = App.getGradeParam();
state.grade = initGrade;
const gradeName = App.getGradeName(initGrade);
document.getElementById('gradeTitle').textContent = gradeName;
// 设置返回链接
document.getElementById('backLink').href = App.buildLink('math-types.html');

document.querySelectorAll('[data-count]').forEach(chip=>{
  chip.addEventListener('click',()=>{
    document.querySelectorAll('[data-count]').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    state.count = +chip.dataset.count;
    customCount.value='';
  });
});
customCount.addEventListener('input',()=>{
  if(customCount.value){
    document.querySelectorAll('[data-count]').forEach(c=>c.classList.remove('active'));
    let v=Math.max(1,Math.min(50,parseInt(customCount.value)||1));
    state.count=v;
  }
});

document.querySelectorAll('.count-group [data-diff]').forEach(chip=>{
  chip.addEventListener('click',()=>{
    document.querySelectorAll('.count-group [data-diff]').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    state.difficulty = chip.dataset.diff;
    if(state.problems.length) generate();
  });
});

function norm(v){return (v==null?'':(''+v)).trim().replace(/\s+/g,'').toLowerCase();}

function generate(){
  console.group('📝 应用题生成器 - 开始生成');
  console.log('年级:', state.grade, '| 数量:', state.count, '| 难度:', state.difficulty);

  let pool;
  if (state.grade === 1 || state.grade === 2) {
    // 一年级和二年级使用模板化 agent
    var agent = new MathWordProblemAgent({ grade: state.grade, difficulty: state.difficulty });
    pool = agent.getPool();
    console.log(`${state.grade}年级模板化生成: ${pool.length} 种题型`);
  } else {
    pool = GEN[state.grade];
    const poolTotal = pool.length;
    if(state.difficulty!=='mix'){
      pool = pool.filter(f=>f.depth===state.difficulty);
      console.log(`难度筛选: ${state.difficulty}, 可用题型 ${pool.length}/${poolTotal}`);
    } else {
      const basicCount = pool.filter(f=>f.depth==='basic').length;
      const advCount = pool.filter(f=>f.depth==='adv').length;
      const highCount = pool.filter(f=>f.depth==='high').length;
      console.log(`混合模式: 基础 ${basicCount} 种 + 进阶 ${advCount} 种 + 高阶 ${highCount} 种 = 共 ${pool.length} 种题型`);
    }
  }

  // 洗牌选型：Fisher-Yates 打乱后依次取用，保证不重复 + 高随机性
  const list = [];
  let shuffledPool = shuffleArr(pool);
  let poolIdx = 0;

  for(let i=0;i<state.count;i++){
    if (poolIdx >= shuffledPool.length) {
      // 题目类型不够，重新洗牌再循环
      shuffledPool = shuffleArr(pool);
      poolIdx = 0;
    }
    const fn = shuffledPool[poolIdx];
    poolIdx++;
    const q = fn();
    list.push(q);
  }

  // 验证是否有重复题目文本
  const qTexts = list.map(q=>q.q);
  const uniqueTexts = new Set(qTexts);
  const dupCount = qTexts.length - uniqueTexts.size;

  console.log('--- 生成结果 ---');
  console.log(`题目文本去重: ${qTexts.length} 题, 唯一文本 ${uniqueTexts.size} 个` + (dupCount>0?` ⚠️ 仍有 ${dupCount} 个重复!`:' ✅ 全部唯一'));
  console.log('题目列表:');
  list.forEach((q,i)=>console.log(`  ${i+1}. [${q.depth}] ${q.q} → ${q.a}${q.unit||''}`));
  console.groupEnd();

  state.problems = list;
  state.revealed = false;
  state.hints = false;
  renderProblems();
  resultArea.innerHTML='';
  startTimer();
}

function renderProblems(){
  if(!state.problems.length){
    problemsArea.innerHTML='<div class="empty">点击「生成练习题」开始吧～</div>';
    return;
  }
  const diffName = state.difficulty==='mix'?'混合':(state.difficulty==='basic'?'基础':(state.difficulty==='adv'?'进阶':'高阶'));
  const gradeName = App.getGradeName(state.grade);
  const title = `<h2 class="problem-title">${state.problems.length}题${gradeName}数学应用题（${diffName}）</h2>`;
  const meta = `<div class="meta">
      <span class="pill">${state.grade}年级</span>
      <span class="pill">共 ${state.problems.length} 题</span>
      <span class="pill" id="timer">⏱ 00:00</span>
    </div>`;
  const cards = state.problems.map((p,i)=>{
    const fracHint = p.frac?'（填几分之几，如 2/5）':'（只填数字）';
    const hintHtml = p.hint?`<div class="step-hint" id="hint${i}">💡 ${p.hint}</div>`:'';
    return `<div class="problem" data-i="${i}">
      <div class="num">${i+1}</div>
      <span class="badge ${p.depth}">${p.depth==='high'?'高阶':p.depth==='adv'?'进阶':'基础'}</span>
      <p class="q">${p.q}</p>
      <div class="ans">
        <span class="formula-hint">答：<span class="formula-placeholder">写算式</span></span>
        <div class="input-group">
          <input type="text" inputmode="text" placeholder="${fracHint}" autocomplete="off">
          ${p.unit?`<span class="unit">${p.unit}</span>`:''}
          <span class="feedback"></span>
          <span class="reveal hide">正确答案：${p.a}${p.unit||''}</span>
        </div>
      </div>
      ${hintHtml}
    </div>`;
  }).join('');
  problemsArea.innerHTML = title + meta + cards;
}

function startTimer(){
  stopTimer();
  state.start = Date.now();
  state.timer = setInterval(()=>{
    const t=Math.floor((Date.now()-state.start)/1000);
    const m=String(Math.floor(t/60)).padStart(2,'0');
    const s=String(t%60).padStart(2,'0');
    const el=document.getElementById('timer');
    if(el) el.textContent=`⏱ ${m}:${s}`;
  },1000);
}
function stopTimer(){ if(state.timer){clearInterval(state.timer);state.timer=null;} }

function getElapsed(){return Math.floor((Date.now()-state.start)/1000);}

function check(){
  if(!state.problems.length) return;
  stopTimer();
  let correct=0;
  const elapsed = getElapsed();
  const cards = problemsArea.querySelectorAll('.problem');

  console.group('✅ 检查答案');
  state.problems.forEach((p,i)=>{
    const card=cards[i];
    const input=card.querySelector('input');
    const fb=card.querySelector('.feedback');
    const user=norm(input.value);
    const right=norm(p.a);
    card.classList.remove('correct','wrong');
    if(user===''){
      fb.textContent='未作答'; fb.style.color='var(--warn)'; card.classList.add('wrong');
      console.log(`  ${i+1}. 未作答 | 期望: ${right}${p.unit||''}`);
    }else if(user===right){
      fb.textContent='✓ 正确'; fb.style.color='var(--ok)'; card.classList.add('correct'); correct++;
      console.log(`  ${i+1}. ✅ 正确 | 输入: ${user}, 期望: ${right}`);
    }else{
      fb.textContent=`✗ 正确答案：${p.a}${p.unit||''}`; fb.style.color='var(--bad)'; card.classList.add('wrong');
      console.log(`  ${i+1}. ❌ 错误 | 输入: ${user}, 期望: ${right}${p.unit||''}`);
    }
  });
  const total=state.problems.length;
  const pct=Math.round(correct/total*100);
  const mins = Math.floor(elapsed/60);
  const secs = elapsed%60;
  const timeStr = mins>0?`${mins}分${secs}秒`:`${secs}秒`;
  const tips = correct===total?'太棒了，全部答对！👏'
    : correct>=total*0.8?'表现很好，再练练就满分啦！💪'
    : '别灰心，把错题弄懂，下次一定行！🌟';
  resultArea.innerHTML=`<div class="result">
    <div class="score">${correct} / ${total}</div>
    <div class="detail">正确率 ${pct}% &nbsp;·&nbsp; 用时 ${timeStr} &nbsp;·&nbsp; ${tips}</div>
    <div class="tips">提示：点击「解题思路」查看每道题的解法；点击「显示答案」查看所有正确答案。</div>
  </div>`;
  // 保存练习记录
  addHistory(correct, total, elapsed);
}

function toggleReveal(){
  state.revealed=!state.revealed;
  problemsArea.querySelectorAll('.reveal').forEach(r=>r.classList.toggle('hide',!state.revealed));
  document.getElementById('revealBtn').textContent = state.revealed?'🙈 隐藏答案':'👀 显示答案';
}

function toggleHints(){
  state.hints=!state.hints;
  problemsArea.querySelectorAll('.step-hint').forEach(h=>h.classList.toggle('show',state.hints));
  document.getElementById('hintBtn').textContent = state.hints?'💡 隐藏思路':'💡 解题思路';
}

function addHistory(correct, total, elapsed){
  const now = new Date();
  const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
  const pct = Math.round(correct/total*100);
  const diffName = state.difficulty==='mix'?'混合':(state.difficulty==='basic'?'基础':(state.difficulty==='adv'?'进阶':'高阶'));
  history.unshift({time:timeStr, grade:state.grade, diff:diffName, correct, total, pct});
  if(history.length>10) history.length=10;
  renderHistory();
}

function renderHistory(){
  const box = document.getElementById('historyBox');
  const list = document.getElementById('historyList');
  if(history.length===0){box.style.display='none';return;}
  box.style.display='block';
  list.innerHTML = history.map(h=>{
    const emoji = h.pct===100?'🌟':h.pct>=80?'👍':h.pct>=60?'📚':'💪';
    return `<div class="history-item">${emoji} ${h.time} · ${h.grade}年级(${h.diff}) · ${h.correct}/${h.total} · ${h.pct}%</div>`;
  }).join('');
}

document.getElementById('genBtn').addEventListener('click',generate);
document.getElementById('checkBtn').addEventListener('click',check);
document.getElementById('revealBtn').addEventListener('click',toggleReveal);
document.getElementById('hintBtn').addEventListener('click',toggleHints);
document.getElementById('printBtn').addEventListener('click',printFile);

function printFile() {
  if (!state.problems.length) { alert('请先生成练习题！'); return; }
  var title = document.getElementById('gradeTitle').textContent + '数学应用题';
  Print.open('#problemsArea', title, { pageType: 'word' });
}
App.initPageController('mathWord', 'math');
</script>
