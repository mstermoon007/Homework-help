<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>凑十法 · 平十法 · 破十法练习</title>
<link rel="stylesheet" href="common.css">
<style>
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(180deg,#eaf2ff 0%,#f3f7fb 220px,#f3f7fb 100%);
    color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:900px;margin:0 auto;padding:16px 16px 60px}
  header.hero{text-align:center;padding:18px 10px 10px}
  header.hero h1{margin:0;font-size:26px;letter-spacing:1px;background:linear-gradient(90deg,#5b8def,#7c5cff);-webkit-background-clip:text;background-clip:text;color:transparent}
  header.hero p{margin:8px 0 0;color:var(--muted);font-size:14px}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px;margin:16px 0}
  .panel h2{margin:0 0 12px;font-size:15px;color:var(--muted);font-weight:700;letter-spacing:.5px}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:14px}
  .count-group{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .count-group .lbl{font-size:14px;color:var(--muted);margin-right:2px}
  .chip{cursor:pointer;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:8px 14px;font-size:14px;font-weight:600;transition:.15s}
  .chip:hover{border-color:var(--brand)}
  .chip.active{background:var(--brand-d);border-color:var(--brand-d);color:#fff}
  .chip .sub{display:block;font-size:11px;font-weight:400;opacity:.8;margin-top:2px}
  .chip.active .sub{color:rgba(255,255,255,.85)}
  .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .btn{cursor:pointer;border:none;border-radius:12px;padding:12px 20px;font-size:15px;font-weight:700;transition:.15s}
  .btn-primary{background:linear-gradient(90deg,#5b8def,#6f6bff);color:#fff;box-shadow:0 6px 16px rgba(91,141,239,.35)}
  .btn-primary:hover{filter:brightness(1.05)}
  .btn-ghost{background:#eef3fb;color:var(--brand-d)}
  .btn-ghost:hover{background:#e2ebf9}

  .meta{display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:12px}
  .meta .pill{background:#eef3fb;color:var(--brand-d);border-radius:999px;padding:4px 12px;font-weight:600}

  /* ===== 题目网格 ===== */
  .q-grid{display:grid;gap:8px}
  .q-grid.cols-2{grid-template-columns:repeat(2,1fr)}
  .q-grid.cols-3{grid-template-columns:repeat(3,1fr)}
  .q-grid.cols-4{grid-template-columns:repeat(4,1fr)}

  /* ===== 题目卡片 ===== */
  .problem{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:8px 8px 6px;position:relative;text-align:center}
  .problem .num{position:absolute;left:6px;top:6px;width:20px;height:20px;border-radius:50%;background:#eef3fb;color:var(--brand-d);font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center}
  .problem.correct{border-color:var(--ok);background:var(--ok-bg)}
  .problem.wrong{border-color:var(--bad);background:var(--bad-bg)}

  /* ===== SVG 分解图 ===== */
  .decomp-svg{display:block;margin:0 auto}
  .decomp-svg text{font-family:inherit}
  .decomp-svg .num-big{font-size:18px;font-weight:800;fill:var(--ink)}
  .decomp-svg .num-mid{font-size:14px;font-weight:700;fill:var(--ink)}
  .decomp-svg .num-small{font-size:11px;font-weight:700;fill:var(--muted)}
  .decomp-svg .split-line{stroke:#d0d7e0;stroke-width:1.5;stroke-linecap:round}

  /* ===== 紧凑输入框 ===== */
  .compact-input{display:inline-flex;align-items:center;gap:3px;margin-top:2px}
  .compact-input input{
    width:36px;height:26px;border:2px dashed #ccc;border-radius:6px;
    font-size:14px;font-weight:700;text-align:center;color:var(--brand);
    background:#fafafa;outline:none;transition:.15s;
  }
  .compact-input input:focus{border-color:var(--brand);background:#fff}
  .compact-input input.correct{border-color:var(--ok);background:var(--ok-bg)}
  .compact-input input.wrong{border-color:var(--bad);background:var(--bad-bg)}
  .compact-input .lbl{font-size:12px;color:var(--muted)}

  .problem .feedback{font-size:11px;font-weight:700;min-height:14px;margin-top:2px}
  /* 题目行 */
  .q-row{display:flex;align-items:center;justify-content:center;gap:2px;margin-bottom:6px}
  .q-row .q-text{font-size:16px;font-weight:800;color:var(--ink)}
  .answer-inp{width:44px;height:30px;border:2px dashed #ccc;border-radius:6px;font-size:15px;font-weight:700;text-align:center;color:var(--brand);background:#fafafa;outline:none;transition:.15s}
  .answer-inp:focus{border-color:var(--brand);background:#fff}
  .answer-inp.correct{border-color:var(--ok);background:var(--ok-bg)}
  .answer-inp.wrong{border-color:var(--bad);background:var(--bad-bg)}
  /* 图形分解行 */
  .decomp-row{text-align:center;margin:2px 0}
  .decomp-inputs{display:flex;justify-content:center;gap:8px;margin-top:0}
  .decomp-inp{width:36px;height:26px;border:2px dashed #ccc;border-radius:6px;font-size:14px;font-weight:700;text-align:center;color:var(--brand);background:#fafafa;outline:none;transition:.15s}
  .decomp-inp:focus{border-color:var(--brand);background:#fff}
  .decomp-inp.correct{border-color:var(--ok);background:var(--ok-bg)}
  .decomp-inp.wrong{border-color:var(--bad);background:var(--bad-bg)}
  /* 组合行 */
  .combine-row{font-size:13px;font-weight:700;color:var(--ink);text-align:center;margin:4px 0;line-height:1.8}
  .combine-inp{width:32px;height:24px;border:2px dashed #ccc;border-radius:5px;font-size:13px;font-weight:700;text-align:center;color:var(--brand);background:#fafafa;outline:none;transition:.15s;vertical-align:middle}
  .combine-inp:focus{border-color:var(--brand);background:#fff}
  .combine-inp.correct{border-color:var(--ok);background:var(--ok-bg)}
  .combine-inp.wrong{border-color:var(--bad);background:var(--bad-bg)}
  /* 思路行 */
  .think-hint{font-size:10px;color:var(--muted);margin-top:2px;line-height:1.4}

  .result{background:linear-gradient(135deg,#eef4ff,#f6efff);border:1px solid var(--line);border-radius:16px;padding:18px;margin:16px 0;text-align:center;box-shadow:var(--shadow)}
  .result .score{font-size:34px;font-weight:800;color:var(--brand-d)}
  .result .detail{font-size:14px;color:var(--ink);margin-top:4px}
  .result .tips{font-size:13px;color:var(--muted);margin-top:8px}
  .empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:10px}

  @media(max-width:640px){
    .q-grid.cols-2,.q-grid.cols-3{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">
  <div style="margin-bottom:10px">
    <a href="math-types.html" class="back-home" id="backLink">← 返回题型选择</a>
  </div>
  <header class="hero">
    <h1>🧮 凑十法 · 平十法 · 破十法</h1>
    <p>小学一年级数学 · 课本同步竖式分解</p>
  </header>

  <section class="panel controls">
    <div class="row">
      <div class="count-group">
        <span class="lbl">① 练习类型：</span>
        <button class="chip active" data-type="cushi">凑十法<span class="sub">看大数，分小数，凑成十</span></button>
        <button class="chip" data-type="pingshi">平十法<span class="sub">减到十，再减剩</span></button>
        <button class="chip" data-type="poshi">破十法<span class="sub">破成十，先减后加</span></button>
        <button class="chip" data-type="mix">混合<span class="sub">三种方法混合</span></button>
      </div>
    </div>
    <div class="row">
      <div class="count-group">
        <span class="lbl">② 题目数量：</span>
        <button class="chip active" data-count="5">5题</button>
        <button class="chip" data-count="10">10题</button>
        <button class="chip" data-count="20">20题</button>
      </div>
      <div class="helper-note" style="margin-top:6px">推荐 10 题，打印输出刚好填满一张 A4 纸</div>
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="genBtn">🎲 生成练习题</button>
      <button class="btn btn-primary" id="checkBtn">✅ 检查答案</button>
      <button class="btn btn-ghost" id="printBtn">📄 生成打印文件</button>
    </div>
  </section>

  <section id="problemsArea">
    <div class="empty">点击「生成练习题」开始吧～</div>
  </section>
  <div id="resultArea"></div>
  <footer>凑十法 · 平十法 · 破十法 — 小学一年级数学基础</footer>
</div>

<script src="common.js"></script>
<script src="print.js"></script>
<script>
function rnd(min,max){ return App.randInt(min,max); }
function pick(arr){ return App.rand(arr); }
function shuffleArr(arr){ return App.shuffle(arr); }

// ========== SVG 分解图生成（题目+分解合并为一张图） ==========
function svgInput(idx, field, w, h){
  return `<foreignObject x="0" y="0" width="${w}" height="${h}">
    <div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;">
      <input type="text" data-idx="${idx}" data-field="${field}" placeholder="?" autocomplete="off"
        style="width:${w-4}px;height:${h-4}px;border:2px dashed #ccc;border-radius:5px;font-size:14px;font-weight:700;text-align:center;color:#5b8def;background:#fafafa;outline:none;font-family:inherit;box-sizing:border-box;"/>
    </div>
  </foreignObject>`;
}

// 凑十法：8+5=[__]，8→2，5→2+3
function cushiFullSVG(big, small, need, rest, idx){
  const w=220, h=100, x1=28, x2=84, x3=140, xAns=168;
  return `<svg class="decomp-svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <text x="${x1}" y="22" class="num-big" text-anchor="middle">${big}</text>
    <text x="${x1+28}" y="22" class="num-big" text-anchor="middle" fill="#5b8def">+</text>
    <text x="${x2}" y="22" class="num-big" text-anchor="middle">${small}</text>
    <text x="${x3}" y="22" class="num-big" text-anchor="middle" fill="#7a879c">=</text>
    ${svgInput(idx, 'answer', 36, 26).replace(/x="0" y="0"/, `x="${xAns-4}" y="8"`)}
    <line x1="${x1}" y1="32" x2="${x1}" y2="62" class="split-line"/>
    <text x="${x1}" y="80" class="num-mid" text-anchor="middle">${need}</text>
    <line x1="${x2}" y1="32" x2="${x2}" y2="50" class="split-line"/>
    <line x1="${x2-26}" y1="50" x2="${x2+26}" y2="50" class="split-line"/>
    <line x1="${x2-26}" y1="50" x2="${x2-26}" y2="62" class="split-line"/>
    <line x1="${x2+26}" y1="50" x2="${x2+26}" y2="62" class="split-line"/>
    <text x="${x2-26}" y="80" class="num-mid" text-anchor="middle">${need}</text>
    <text x="${x2+26}" y="80" class="num-mid" text-anchor="middle">${rest}</text>
  </svg>`;
}

// 平十法：15−7=[__]，15→5，7→5+2
function pingshiFullSVG(total, sub, to10, rest, idx){
  const w=220, h=100, x1=28, x2=84, x3=140, xAns=168;
  return `<svg class="decomp-svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <text x="${x1}" y="22" class="num-big" text-anchor="middle">${total}</text>
    <text x="${x1+28}" y="22" class="num-big" text-anchor="middle" fill="#5b8def">−</text>
    <text x="${x2}" y="22" class="num-big" text-anchor="middle">${sub}</text>
    <text x="${x3}" y="22" class="num-big" text-anchor="middle" fill="#7a879c">=</text>
    ${svgInput(idx, 'answer', 36, 26).replace(/x="0" y="0"/, `x="${xAns-4}" y="8"`)}
    <line x1="${x1}" y1="32" x2="${x1}" y2="62" class="split-line"/>
    <text x="${x1}" y="80" class="num-mid" text-anchor="middle">${to10}</text>
    <line x1="${x2}" y1="32" x2="${x2}" y2="50" class="split-line"/>
    <line x1="${x2-26}" y1="50" x2="${x2+26}" y2="50" class="split-line"/>
    <line x1="${x2-26}" y1="50" x2="${x2-26}" y2="62" class="split-line"/>
    <line x1="${x2+26}" y1="50" x2="${x2+26}" y2="62" class="split-line"/>
    <text x="${x2-26}" y="80" class="num-mid" text-anchor="middle">${to10}</text>
    <text x="${x2+26}" y="80" class="num-mid" text-anchor="middle">${rest}</text>
  </svg>`;
}

// 破十法：13−5=[__]，13→10+3，5→5
function poshiFullSVG(total, sub, to10, tenSub, idx){
  const w=220, h=100, x1=28, x2=84, x3=140, xAns=168;
  return `<svg class="decomp-svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <text x="${x1}" y="22" class="num-big" text-anchor="middle">${total}</text>
    <text x="${x1+28}" y="22" class="num-big" text-anchor="middle" fill="#5b8def">−</text>
    <text x="${x2}" y="22" class="num-big" text-anchor="middle">${sub}</text>
    <text x="${x3}" y="22" class="num-big" text-anchor="middle" fill="#7a879c">=</text>
    ${svgInput(idx, 'answer', 36, 26).replace(/x="0" y="0"/, `x="${xAns-4}" y="8"`)}
    <line x1="${x1}" y1="32" x2="${x1}" y2="50" class="split-line"/>
    <line x1="${x1-26}" y1="50" x2="${x1+26}" y2="50" class="split-line"/>
    <line x1="${x1-26}" y1="50" x2="${x1-26}" y2="62" class="split-line"/>
    <line x1="${x1+26}" y1="50" x2="${x1+26}" y2="62" class="split-line"/>
    <text x="${x1-26}" y="80" class="num-mid" text-anchor="middle">10</text>
    <text x="${x1+26}" y="80" class="num-mid" text-anchor="middle">${to10}</text>
    <line x1="${x2}" y1="32" x2="${x2}" y2="62" class="split-line"/>
    <text x="${x2}" y="80" class="num-mid" text-anchor="middle">${tenSub}</text>
  </svg>`;
}

// ========== 题目生成 ==========
let state = { type:'cushi', count:5, problems:[], answered:false, startTime:0, timerInterval:null };

function buildCushi(){
  const big = rnd(5,9);
  const need = 10 - big;
  const small = rnd(Math.max(2,need), 9);
  const rest = small - need;
  return {
    kind:'cushi', label:'凑十法',
    big, small, need, rest,
    answer: big+small,
    decompInputs: [
      {id:'need8', expect:need},
      {id:'need5', expect:need},
      {id:'rest', expect:rest}
    ],
    combineInputs: [
      {id:'c_need', expect:need},
      {id:'c_rest', expect:rest},
      {id:'c_answer', expect:big+small}
    ],
    combinePrefix: `${big} + `,
    combineMid: ` = 10，10 + `,
    hint: `凑十法：看大数，想大数加几等于10？把小数拆成两部分，先凑成10，再加剩下的数。`
  };
}

function buildPingshi(){
  const total = rnd(11,19);
  const to10 = total - 10;
  const sub = rnd(Math.max(2,to10+1), Math.min(9, total-1));
  const rest = sub - to10;
  return {
    kind:'pingshi', label:'平十法',
    total, sub, to10, rest,
    answer: total-sub,
    decompInputs: [
      {id:'to10_left', expect:to10},
      {id:'to10_right', expect:to10},
      {id:'rest', expect:rest}
    ],
    combineInputs: [
      {id:'c_to10', expect:to10},
      {id:'c_rest', expect:rest},
      {id:'c_answer', expect:total-sub}
    ],
    combinePrefix: `${total} − `,
    combineMid: ` = 10，10 − `,
    hint: `平十法：看减数，把减数拆成两部分，先减到10，再减去剩下的数。`
  };
}

function buildPoshi(){
  const total = rnd(11,19);
  const to10 = total - 10;
  const sub = rnd(2, 9);
  const tenSub = 10 - sub;
  return {
    kind:'poshi', label:'破十法',
    total, sub, to10, tenSub,
    answer: total-sub,
    decompInputs: [
      {id:'ten', expect:10},
      {id:'to10', expect:to10},
      {id:'tenSub', expect:tenSub}
    ],
    combineInputs: [
      {id:'c_tenSub', expect:tenSub},
      {id:'c_answer', expect:total-sub}
    ],
    combinePrefix: `10 − ${sub} = `,
    combineMid: `，`,
    combineSuffix: ` + ${to10} = `,
    hint: `破十法：把被减数拆成10和几，先用10去减，再把剩下的数加回来。`
  };
}

function buildMixed(){
  const r = Math.random();
  if(r<0.35) return buildCushi();
  if(r<0.65) return buildPingshi();
  return buildPoshi();
}

function generate(){
  const builder = {cushi:buildCushi, pingshi:buildPingshi, poshi:buildPoshi, mix:buildMixed}[state.type];
  const seen = new Set();
  const list = [];
  let attempts = 0;
  // 扩大尝试次数，充分利用题目池
  const maxAttempts = Math.max(state.count * 10, 200);
  while(list.length < state.count && attempts < maxAttempts){
    const q = builder();
    const key = q.kind==='cushi' ? `${q.kind}|${q.big}+${q.small}` : `${q.kind}|${q.total}−${q.sub}`;
    if(!seen.has(key)){
      seen.add(key);
      list.push(q);
    }
    attempts++;
  }
  // 如果还不够，不再补充重复题
  state.problems = shuffleArr(list);
  state.answered = false;
  renderProblems();
  resultArea.innerHTML='';
  startTimer();
}

// ========== 计时器 ==========
function startTimer(){
  stopTimer();
  state.startTime = Date.now();
  updateTimer();
  state.timerInterval = setInterval(updateTimer, 1000);
}
function stopTimer(){ if(state.timerInterval){clearInterval(state.timerInterval);state.timerInterval=null;} }
function updateTimer(){
  const t=Math.floor((Date.now()-state.startTime)/1000);
  const el=document.getElementById('timer');
  if(el) el.textContent=`⏱ ${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;
}
function getElapsed(){
  const t=Math.floor((Date.now()-state.startTime)/1000);
  const m=Math.floor(t/60);
  return m>0?`${m}分${t%60}秒`:`${t%60}秒`;
}

// ========== 渲染 ==========
function renderProblems(){
  if(!state.problems.length){
    problemsArea.innerHTML='<div class="empty">点击「生成练习题」开始吧～</div>';
    return;
  }
  const typeNames = {cushi:'凑十法', pingshi:'平十法', poshi:'破十法', mix:'混合练习'};
  const meta = `<div class="meta">
    <span class="pill">${typeNames[state.type]}</span>
    <span class="pill">${state.problems.length} 题</span>
    <span class="pill" id="timer">⏱ 00:00</span>
  </div>`;
  const cols = state.count<=5?'cols-2':(state.count<=10?'cols-3':'cols-4');
  const cards = state.problems.map((p,i)=>{
    // 题目+分解合并SVG（动态生成）
    let svg;
    if(p.kind==='cushi') svg = cushiFullSVG(p.big, p.small, p.need, p.rest, i);
    else if(p.kind==='pingshi') svg = pingshiFullSVG(p.total, p.sub, p.to10, p.rest, i);
    else svg = poshiFullSVG(p.total, p.sub, p.to10, p.tenSub, i);
    
    // 分解填空
    const decompInputsHtml = p.decompInputs.map(inp=>
      `<input type="text" class="decomp-inp" data-idx="${i}" data-field="${inp.id}" placeholder="?" autocomplete="off">`
    ).join('');
    // 组合行文本
    let combineHTML;
    if(p.kind==='poshi'){
      combineHTML = `${p.combinePrefix}<input type="text" class="combine-inp" data-idx="${i}" data-field="c_tenSub" placeholder="?" autocomplete="off">${p.combineMid}<input type="text" class="combine-inp" data-idx="${i}" data-field="c_answer" placeholder="?" autocomplete="off">${p.combineSuffix}`;
    }else{
      combineHTML = `${p.combinePrefix}<input type="text" class="combine-inp" data-idx="${i}" data-field="${p.combineInputs[0].id}" placeholder="?" autocomplete="off">${p.combineMid}<input type="text" class="combine-inp" data-idx="${i}" data-field="${p.combineInputs[1].id}" placeholder="?" autocomplete="off"> = <input type="text" class="combine-inp" data-idx="${i}" data-field="${p.combineInputs[2].id}" placeholder="?" autocomplete="off">`;
    }
    return `<div class="problem" data-i="${i}">
      <div class="num">${i+1}</div>
      <div class="decomp-row">${svg}</div>
      <div class="decomp-inputs">${decompInputsHtml}</div>
      <div class="combine-row">${combineHTML}</div>
      <div class="think-hint">${p.hint}</div>
      <div class="feedback"></div>
    </div>`;
  }).join('');
  problemsArea.innerHTML = meta + `<div class="q-grid ${cols}">${cards}</div>`;
}

// ========== 检查 ==========
function norm(v){ return (v==null?'':(''+v)).trim().replace(/\s+/g,'').toLowerCase(); }

function check(){
  if(!state.problems.length) return;
  stopTimer();
  state.answered = true;
  let correct=0;
  const cards = problemsArea.querySelectorAll('.problem');
  state.problems.forEach((p,i)=>{
    const card=cards[i];
    const fb=card.querySelector('.feedback');
    card.classList.remove('correct','wrong');
    let allOk=true;

    // 检查最终答案
    const answerEl=card.querySelector('[data-field="answer"]');
    if(answerEl){
      answerEl.classList.remove('correct','wrong');
      if(norm(answerEl.value)===norm(String(p.answer))){
        answerEl.classList.add('correct');
      }else{
        answerEl.classList.add('wrong');
        allOk=false;
      }
    }

    // 检查所有填空（分解+组合）
    var allInputs = (p.decompInputs||[]).concat(p.combineInputs||[]);
    allInputs.forEach(function(inp){
      var el=card.querySelector('[data-field="'+inp.id+'"]');
      if(el){
        el.classList.remove('correct','wrong');
        if(norm(el.value)===norm(String(inp.expect))){
          el.classList.add('correct');
        }else{
          el.classList.add('wrong');
          allOk=false;
        }
      }
    });

    if(allOk){
      correct++;
      card.classList.add('correct');
      fb.textContent='✓ 正确';fb.style.color='var(--ok)';
    }else{
      card.classList.add('wrong');
      fb.textContent='✗ 答案：'+p.answer;fb.style.color='var(--bad)';
    }
  });
  const total=state.problems.length;
  const pct=Math.round(correct/total*100);
  const elapsed = getElapsed();
  const tips = correct===total?`🎉 太棒了，全部答对！用时 ${elapsed}`
    : correct>=total*0.8?`👍 表现很好！答对 ${correct}/${total} 题。用时 ${elapsed}`
    : `💪 继续加油！答对 ${correct}/${total} 题。用时 ${elapsed}`;
  resultArea.innerHTML=`<div class="result">
    <div class="score">${correct} / ${total}</div>
    <div class="detail">正确率 ${pct}%</div>
    <div class="tips">${tips}</div>
  </div>`;
}

function printFile(){
  if(!state.problems.length){alert('请先生成练习题！');return;}
  const typeNames = {cushi:'凑十法', pingshi:'平十法', poshi:'破十法', mix:'混合'};
  Print.open('#problemsArea', `小学一年级${typeNames[state.type]}练习`, {pageType:'makeTen'});
}

// ========== 初始化 ==========
const problemsArea = document.getElementById('problemsArea');
const resultArea = document.getElementById('resultArea');
document.getElementById('backLink').href = App.buildLink('math-types.html');

document.querySelectorAll('[data-count]').forEach(chip=>{
  chip.addEventListener('click',function(){
    document.querySelectorAll('[data-count]').forEach(c=>c.classList.remove('active'));
    this.classList.add('active');
    state.count = +this.dataset.count;
  });
});
document.querySelectorAll('[data-type]').forEach(chip=>{
  chip.addEventListener('click',function(){
    document.querySelectorAll('[data-type]').forEach(c=>c.classList.remove('active'));
    this.classList.add('active');
    state.type = this.dataset.type;
    if(state.problems.length) generate();
  });
});
document.getElementById('genBtn').addEventListener('click',generate);
document.getElementById('checkBtn').addEventListener('click',check);
document.getElementById('printBtn').addEventListener('click',printFile);

// 回车快捷批改
document.addEventListener('keydown',function(e){
  if(e.key==='Enter' && state.problems.length>0 && !state.answered) check();
});

generate();
App.initPageController('mathMakeTen', 'math');
</script>
