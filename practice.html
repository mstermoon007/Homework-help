<script>
  // 全局错误捕获与自动恢复（任务：错误处理升级）——运行时异常 / 资源加载失败 / 未处理的 Promise 拒绝
    window.addEventListener('error', function (e) {
      // 资源加载失败（img/script/link）在捕获阶段上报，e.message 为空——仅记录，不打扰用户
      if (!e.message && e.target && e.target !== window) {
        console.error('资源加载失败:', e.target.src || e.target.href || e.target.tagName);
        return;
      }
      console.error('全局错误:', e.error || e.message);
      showGlobalError(e.error || e.message);
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      console.error('未处理的Promise拒绝:', e.reason);
      showGlobalError(e.reason);
    });

    function showGlobalError(reason) {
      var box = document.getElementById('global-error');
      if (!box) return;
      var detailEl = document.getElementById('global-error-plugin-info');
      if (detailEl) {
        detailEl.textContent = String((reason && (reason.message || reason)) || '未知错误').slice(0, 300);
      }
      var actionsEl = document.getElementById('global-error-actions');
      if (actionsEl) {
        actionsEl.innerHTML = '<button onclick="location.reload()" class="eb-btn eb-btn--primary">重新加载页面</button>';
      }
      box.style.display = 'block';
    }

</script>

     （无需重建策略 bundle，独立按需加载）。SVG 生成器(shared/svg-*.js)在 boot 阶段挂载。 -->
<script src="shared/presentation/render-options.js"></script>
<script src="shared/presentation/render-result.js"></script>
<script src="shared/presentation/svg-registry.js"></script>
<script src="shared/generator/graphic-renderer.js"></script>
<!-- R-A04：SVG 语义生成器运行时挂载（须先于首次渲染，svg-registry 的懒种子扫描才能捕获）。
     shared/svg/svg-core.js 提供 SVGUtil；核心渲染族（geometry/calculation/makeTen/chart/diagram/currency）
     挂载 SVGGenerators.math.*；plugins/svg-*.js 挂载 {clock,area,fraction,dataStats,draw,competition}，
     经 graphic-renderer → SVGRenderer 派发链产出 <svg>。 -->
<script src="shared/svg/svg-core.js"></script>
<script src="shared/svg/svg-geometry.js"></script>
<script src="shared/svg/svg-calculation.js"></script>
<script src="shared/svg/svg-make-ten.js"></script>
<script src="shared/svg/svg-chart.js"></script>
<script src="shared/svg/svg-diagram.js"></script>
<script src="shared/svg/svg-currency.js"></script>
<script src="shared/presentation/svg-templates.js"></script>
<script src="plugins/svg-clock.js"></script>
<script src="plugins/svg-area.js"></script>
<script src="plugins/svg-fraction.js"></script>
<script src="plugins/svg-data-stats.js"></script>
<script src="plugins/svg-draw.js"></script>
<script src="plugins/svg-competition.js"></script>
<script src="shared/presentation/html-renderer.js"></script>
<script src="shared/presentation/renderer.js"></script>
<script src="shared/engine/generation-engine.js"></script>
<!-- D007 修复：浏览器需加载 generation/api.js 才能使 GenerationEngine 走正常路径
     （否则 GenerationAPI 为 null 走回退，回退返回不含 generationId，
     导致 PracticeBridge.recordGeneration 因 g.generationId 缺失而跳过，
     _lastGeneration 永不更新 → 跨代去重 seenKeys 不注入 → 重新生成出现重复题） -->
<script src="shared/generation/api.js"></script>
<script src="shared/strategy/comprehensive-strategy.js"></script>
<!-- P7：统一练习会话（P7-R01~R04） -->
<script src="shared/engine/practice-session.js"></script>
<!-- 关联层：UI 指令 → 生成层指令翻译与反馈接受（不改生成层） -->
<script src="shared/bridge/practice-bridge.js"></script>
<script>
(function () {
  'use strict';

  // ============ 全局状态 ============
  // P3-R04：页面仅保留 UI 状态 + Request 所需字段，无 Plugin / Strategy / Generator 依赖
  var state = {
    subject: 'math',       // 科目（URL 或默认）
    grade: 1,              // 当前年级
    exerciseSet: null,     // 当前题目集（legacy 形状，供 check/redo/print 用）
    checkResult: null,     // 当前批改结果
    count: 20,             // 题量
    difficulty: 1,         // 难度（1-10，用户填写，默认 1）
    timerId: null,         // setInterval 句柄
    startTime: 0,          // 开始时间戳
    answered: false,       // 是否已提交
    knowledgePointIds: null // 合并后：交互选择的 KP id 列表（供错题本 / 难度 EMA；深链时回退 urlParams）
  };

  // ============ URL 参数解析 ============
  // 任务3：URL 科目别名归一化（仅 math 可用，其余科目回落 math）
  function canonSubjectForUI(raw) {
    var m = { math: 'math' };
    var r = String(raw || '').toLowerCase();
    return m[r] || 'math';
  }

  function parseUrlParams() {
    var p = new URLSearchParams(window.location.search);
    var grade = Number(p.get('grade'));
    if (!(grade >= 1 && grade <= 6)) grade = 1;
    var count = Number(p.get('count'));
    if (!(count >= 1 && count <= 50)) count = 20;
    var difficulty = Number(p.get('difficulty'));
    if (!(difficulty >= 1 && difficulty <= 10)) difficulty = 1;
    return {
      subject: canonSubjectForUI(p.get('subject')),
      grade: grade,
      count: count,
      difficulty: difficulty,
      // P2-R03：知识点驱动参数
      kp: (p.get('kp') || '').trim() || null,
      kps: (p.get('kps') || '').trim() || null,
      qt: (p.get('qt') || '').trim() || null,
      // 快速模式题型策略白名单：7 类题型 key 列表（select 页传入，生成层规划期过滤用）
      types: (p.get('types') || '').trim() || null,
      // 上下册过滤（select 页快速/教师模式透传：up 上册 / down 下册；缺省全部）
      book: (p.get('book') || '').trim() || null,
      // 模式：quick（快速）/ teacher（教师/专业）等（select 页传入，用于知识点占比展示形态）
      mode: (p.get('mode') || '').trim() || null,
      // P7: 直接打印参数
      print: p.get('print') === '1',
      // M6-R22：自适应模式（legacy|new|shadow），缺省由是否有学习数据决定
      adaptiveMode: (p.get('adaptiveMode') || '').trim() || null,
      // 任务3：兼容旧 host 插件参数（自动反查知识点）
      plugin: (p.get('plugin') || '').trim() || null
    };
  }

  var urlParams = parseUrlParams();

  // 专业（教师）模式：select 页 mode=teacher 进入时，知识点占比展示为「提醒 + 数量填空」
  var isTeacherMode = urlParams.mode === 'teacher';

  // ============ PracticeSession 实例（经关联层构造） ============
  var practiceSession = null;

  // 关联层：把 URL 入参翻译成生成层指令并构造会话（不直接 new 生成层）
  function initPracticeSession() {
    if (!window.PracticeBridge) return;
    practiceSession = window.PracticeBridge.newSession({
      mode: urlParams.adaptiveMode === 'new' ? 'adaptive' : (urlParams.kps ? 'multi-kp' : 'native'),
      subject: urlParams.subject || 'math',
      grade: urlParams.grade, count: urlParams.count, difficulty: urlParams.difficulty,
      knowledgePointId: urlParams.kp,
      knowledgePoints: urlParams.kps ? urlParams.kps.split(',').filter(Boolean) : null,
      questionType: urlParams.qt,
      adaptive: urlParams.adaptiveMode === 'new', learnerProfile: null, state: state
    });
  }

  // 初始化 PracticeSession
  initPracticeSession();

  // ============ 通用 DOM 工具 ============
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }

  // HTML 转义：防止 URL 参数等不可信文本注入到 innerHTML 执行脚本（修复 P0 XSS）
  function esc(s) {
    var d = document.createElement('div');
    d.textContent = (s == null) ? '' : String(s);
    return d.innerHTML;
  }

  // 数字补零（兼容旧浏览器：padStart 在 Safari<10 / Android WebView<50 不支持，见审查 7.2）
  function pad2(n) { return (n < 10 ? '0' : '') + String(n); }

  function showNotice(title, sub, retry) {
    $('controlsPanel').style.display = 'none';
    $('timerDisplay').textContent = '⏱ 00:00';
    var area = $('problemsArea');
    var div = el('div', 'notice');
    div.innerHTML = '<div class="big">' + esc(title) + '</div>' + (sub ? '<div>' + esc(sub) + '</div>' : '');
    if (retry) {
      var btn = el('button', 'btn btn-primary', '重新加载');
      btn.style.marginTop = '14px';
      btn.onclick = function () { location.reload(); };
      div.appendChild(btn);
    }
    area.innerHTML = '';
    area.appendChild(div);
    $('resultArea').classList.remove('show');
  }


  // ============ 计时器 ============
  function fmtTime(t) {
    return pad2(Math.floor(t / 60)) + ':' + pad2(t % 60);
  }
  function startTimer() {
    stopTimer();
    state.startTime = Date.now();
    state.timerId = setInterval(function () {
      $('timerDisplay').textContent = '⏱ ' + fmtTime(Math.floor((Date.now() - state.startTime) / 1000));
    }, 500);
  }
  function stopTimer() {
    if (state.timerId) { clearInterval(state.timerId); state.timerId = null; }
  }
  function getElapsed() {
    return Math.floor((Date.now() - state.startTime) / 1000);
  }
  function elapsedText(sec) {
    var m = Math.floor(sec / 60);
    return m > 0 ? (m + '分' + (sec % 60) + '秒') : (sec + '秒');
  }

  // ============ 生成 + 渲染 ============
  // P3-R04：页面只负责「UI State → Request → Engine → Render → Answer → Result」。
  // 知识规划 / 生成 / 验证 / 渲染 / SVG 全部由 GenerationEngine 内部完成，
  // 页面不再判断 Strategy / Generator / Plugin / Legacy / 难度 / SVG。

  // P1-R01/R03 / P3：统一生成入口（唯一）。页面不再判断 Strategy / Generator / Plugin / Legacy。
  // 关联层：经 PracticeBridge 把 UI 指令翻译给生成层（PracticeSession），并接受 start 反馈。
  // P7-R01: 统一练习入口 —— 由关联层回调 applyExerciseSet 接住生成层反馈。
  function generate() {
    if (!window.PracticeBridge) return;
    state.count = Number(state.count) || 20;
    syncTypeCounts();
    window.PracticeBridge.onStartFeedback(applySessionFeedback);
    // U3 清理：deriveTypeName/state 均在本 IIFE 作用域内定义，恒可用，
    // 原「typeof x !== 'undefined' ? x : null」三元恒取真分支，直接简化为直接引用。
    window.PracticeBridge.start(
      {
        state: state,
        knowledgePoints: state.knowledgePointIds || (urlParams.kps ? urlParams.kps.split(',').filter(Boolean) : null),
        knowledgePointId: state.kp || urlParams.kp || null,
        // 深链 qt 仅作「题型→可见知识点」的勾选过滤器（asmSeedFromUrl 已按 kpVisibleInQT 过滤勾选集合），
        // 不作为强制题型传给生成层；生成层按勾选知识点 + 题型（分题型题量）由决策层选择最优知识点群生成。
        questionType: state.questionType || null,
        questionTypes: state.questionTypes || null,
        titleType: deriveTypeName(),
        // 双量控制：总数量（count）+ 分题型数量（typeCounts，Σ 恒等于总数）。旧 kpAllocation「知识点控制数量」已废除。
        perTypeCount: (state.typeCounts && state.typeCounts.length === 1) ? state.typeCounts[0].count : null,
        typeCounts: state.typeCounts || null,
        raw: { levels: state }
      }
    );
  }

  // 接受生成层 start 的反馈（成功 → 渲染；失败 → 兜底提示）
  function applySessionFeedback(fb) {
    if (!fb || fb.ok !== true) {
      stopTimer();
      $('checkBtn').disabled = true;
      $('revealBtn').disabled = true;
      $('printBtn').disabled = true;
      var msg = (fb && fb.error && fb.error.message) || '生成失败，请重试';
      showNotice('生成失败，请重试', msg);
      return;
    }
    if (fb.html) {
      // 生成层统筹：直接采用 Engine 成品 HTML（含 SVG 图形与固定样式类 style-*），
      // 大服务层不再自行拼题卡，仅做信息流转与页面样式挂载。
      state.lastSemantic = { html: fb.html, questions: fb.questions || [] };
      applyExerciseSet({ questions: fb.questions || [], meta: fb.meta });
    }
    // B5 关联层唯一入口收敛：bridge 经反馈回传真实会话；保存供 printFile() 打印
    //（此前 printFile 打印的是 initPracticeSession 预构造的空壳，无 exerciseSet 会报“请先生成练习题”）。
    if (fb.session) practiceSession = fb.session;
  }

  function applyExerciseSet(set) {
    if (!set || !Array.isArray(set.questions)) throw new Error('generate 必须返回 { questions: [] }');
    state.exerciseSet = set;
    state.checkResult = null;
    state.answered = false;
    showGenProgress(set.questions.length); // 优化点3：先展示进度骨架
    render(set);
    $('checkBtn').disabled = false;
    $('revealBtn').disabled = false;
    $('printBtn').disabled = false;
  }

  // 优化点3：乐观 UI 进度（非阻塞，逐块填充时更新计数）
  function showGenProgress(total) {
    var p = $('genProgress'); if (!p) return;
    p.hidden = false;
    updateGenProgress(0, total);
  }
  function updateGenProgress(done, total) {
    var bar = $('genProgressBar'); var txt = $('genProgressText');
    if (bar) bar.style.width = (total ? Math.round(done / total * 100) : 0) + '%';
    if (txt) txt.textContent = '已生成 ' + done + ' / ' + total + ' 题';
  }
  function hideGenProgress() {
    var p = $('genProgress'); if (p) p.hidden = true;
  }

  // 统一 Sheet 标题：剥离插件 meta.title 中可能自带的年级前缀，
  // 再按「年级 + 题型 + (题量)」统一组装，确保所有生成页面标题格式一致。
  function cleanTypeTitle(raw) {
    if (!raw) return '练习题';
    // 去掉开头的「小学X年级」/「X年级」等年级前缀（部分插件已在 title 内嵌年级）
    return String(raw).replace(/^小学?[一二三四五六1-6]+年级\s*/, '');
  }

  // 统一标题组装（任务3：年级 + 科目 + 题型 [+ 题量]）。
  // 例：「二年级数学 · 口算练习（20题）」；题型名剥离自带年级前缀（cleanTypeTitle），
  // 屏显主标题与打印标题共用该格式，保证「二年级数学 · 竖式计算（50题）」一致。
  function buildTitle(grade, rawName, count) {
    var g = App.getGradeName(grade);
    var s = (App.SUBJECT_NAMES && App.SUBJECT_NAMES[state.subject]) ? App.SUBJECT_NAMES[state.subject] : '';
    var t = cleanTypeTitle(rawName);
    // 上下册标注（select 页 book 参数；仅数学生效）
    var bookTag = '';
    if (state.subject === 'math' && urlParams.book) {
      bookTag = (urlParams.book === 'up') ? ' · 上册' : (urlParams.book === 'down') ? ' · 下册' : '';
    }
    return (count == null) ? (g + s + ' · ' + t + bookTag) : (g + s + ' · ' + t + bookTag + '（' + count + '题）');
  }

  // 插件加载后动态细化 LearningResource 的 name/description（不影响爬虫获取默认内容）
  function updateResourceLD(name, grade) {
    try {
      var g = App.getGradeName(grade);
      var nodes = document.querySelectorAll('script[type="application/ld+json"]');
      for (var i = 0; i < nodes.length; i++) {
        var obj = JSON.parse(nodes[i].textContent);
        if (obj['@type'] === 'LearningResource') {
          obj.name = g + ' ' + name + '练习题';
          obj.description = '自动生成的' + g + name + '练习题，支持在线作答、批改与打印。';
          nodes[i].textContent = JSON.stringify(obj);
          break;
        }
      }
    } catch (e) { /* 忽略，保留默认 schema */ }
  }

  function render(set) {
    var area = $('problemsArea');
    var meta = set.meta || {};
    // 统一主标题：年级 + 科目 + 题型（题量），由 buildTitle 组装。
    var isWrongBook = /错题本/.test(String(meta.title || ''));
    var typeName = isWrongBook ? '错题本 · 练习' : deriveTypeName();
    $('sheetTitle').textContent = buildTitle(state.grade, typeName, set.questions.length);
    updateResourceLD(typeName, state.grade);
    // P3-R04：题目区域统一使用 Engine 渲染成品（state.lastSemantic.html），
    // 不再回退 legacy renderLegacySet / renderGeneric / plugin.render。
    var body;
    if (state.lastSemantic && state.lastSemantic.html) {
      body = state.lastSemantic.html;
    } else {
      // 错题本 / 重做等原始题集：用通用降级渲染（不依赖插件）
      body = renderGeneric(set);
    }
    // 渲染策略（任务 3.3）：先快速拼好整段 HTML（SVG 已在 generate 阶段生成），
    // 解析为离线 DOM 树后分块（每块 8 个）插入文档，避免一次性大量节点插入导致主线程长阻塞；
    // 卡片随插入渐进可见，交互在全部插入完成后再统一绑定（与旧逻辑一致）。
    var tmp = document.createElement('div');
    tmp.innerHTML = body;
    area.innerHTML = '';
    $('resultArea').classList.remove('show');
    $('resultArea').innerHTML = '';

    var target, nodes;
    if (!meta.exam && tmp.firstElementChild &&
        /questions-grid|q-grid/.test(tmp.firstElementChild.className || '')) {
      // 已含网格容器：抽空后分批回填其卡片（保持顺序）
      target = tmp.firstElementChild;
      nodes = Array.prototype.slice.call(target.children);
      while (target.firstChild) target.removeChild(target.firstChild);
    } else if (!meta.exam) {
      // 兜底：原始顶层节点作为卡片，包一层网格容器
      target = document.createElement('div');
      target.className = 'questions-grid';
      nodes = Array.prototype.slice.call(tmp.children);
    } else {
      // 期末模拟卷等：顶层区块直接分批追加
      target = area;
      nodes = Array.prototype.slice.call(tmp.children);
    }
    if (target !== area) area.appendChild(target);

    var CHUNK = 8;
    var ri = 0;
    var schedule = (typeof requestIdleCallback === 'function')
      ? function (fn) { return requestIdleCallback(fn, { timeout: 80 }); }
      : function (fn) { return setTimeout(fn, 16); };

    function finalizeRender() {
      hideGenProgress(); // 优化点3：揭示完成，收起进度
      // a11y：为题目卡补齐分组角色与题号标签（与 renderCard 一致）
      area.querySelectorAll('.question-card, .problem').forEach(function (card, ci) {
        if (!card.getAttribute('role')) card.setAttribute('role', 'group');
        if (!card.getAttribute('aria-label')) {
          var nd = card.getAttribute('data-index');
          card.setAttribute('aria-label', '第 ' + ((nd != null ? Number(nd) + 1 : ci + 1)) + ' 题');
        }
      });
      // 卡片式/文字式网格按题目长度自适应列数（适配 A4 竖版宽度）
      if (!meta.exam) PluginUtil.layout.fitColumns(area, set);
      // 按当前排版估算「填多少题可正好铺满 A4 整页」的推荐值
      updateCountTip();
      // 回车快捷批改
      area.querySelectorAll('input[data-index], input[data-idx]').forEach(function (inp) {
        inp.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') { e.preventDefault(); if (!state.answered) check(); }
        });
      });
      startTimer();
      // 焦点管理（修复 P2 4.2）：生成后将焦点移到首个输入框，键盘用户无需多次 Tab
      var firstInput = area.querySelector('input[data-index], input[data-idx]');
      if (firstInput) firstInput.focus();
    }

    function step() {
      var end = Math.min(ri + CHUNK, nodes.length);
      for (; ri < end; ri++) target.appendChild(nodes[ri]);
      updateGenProgress(ri, nodes.length); // 优化点3：实时「已生成 X/总」
      if (ri < nodes.length) schedule(step);
      else finalizeRender();
    }
    if (!nodes.length) finalizeRender();
    else step();
  }

  // ============ A4 竖版宽度自适应 ============
  // 列数算法已收敛为单一来源：shared/core/common.js 的 PluginUtil.layout
  // （calcOptimalCols / fitColumns / estimateCardWidth / renderLen / gridColumnsFromDom / applySpanning）。
  // 预览与打印共用同一套逻辑，避免双份代码再次漂移。本页仅保留需要 Print.ROUTES 的 A4 宽度换算。

  // A4 竖版可打印宽度（px），与 shared/presentation/print.js 的 @page 边距保持一致
  // 不同题型路由边距不同（如 makeTen 8mm、其余 12mm/10mm），按路由取对应可打印宽
  function a4PrintableWidthPx(pageType) {
    var route = (window.Print && window.Print.ROUTES && window.Print.ROUTES[pageType]) || {};
    var mm = (route.pageMargin || '12mm 10mm').match(/([\d.]+)mm\s+([\d.]+)mm/);
    var h = mm ? parseFloat(mm[2]) : 10; // 左右边距（mm）
    var MM = 96 / 25.4;
    return Math.round((210 - 2 * h) * MM);
  }

  // 插件无 render 时的通用降级渲染
  function renderGeneric(set) {
    var cols = PluginUtil.layout.calcOptimalCols(set, (document.getElementById('problemsArea') || {}).offsetWidth || 1000);
    var html = '<div class="q-grid cols-' + cols + '">';
    set.questions.forEach(function (q, i) {
      html += '<div class="question-card" data-index="' + i + '">' +
        '<span class="num">' + (i + 1) + '</span>' +
        '<span class="q-text">' + esc(q.question || q.text || q.q || '') + '</span>' +
        (q.hint ? '<div style="font-size:11px;color:var(--muted)">💡 ' + esc(q.hint) + '</div>' : '') +
        '<input type="text" class="answer-inp" data-index="' + i + '" autocomplete="off" aria-label="第 ' + (i + 1) + ' 题 答案">' +
        '<div class="feedback"></div>' +
        '</div>';
    });
    html += '</div>';
    return html;
  }

  // ============ 收集答案 ============
  function collectAnswers() {
    var answers = {};
    document.querySelectorAll('#problemsArea input[data-index], #problemsArea input[data-idx]').forEach(function (inp) {
      if (inp.hasAttribute('data-index')) {
        answers[inp.getAttribute('data-index')] = inp.value.trim();
      } else if (inp.hasAttribute('data-idx') && inp.hasAttribute('data-field')) {
        answers[inp.getAttribute('data-idx') + ':' + inp.getAttribute('data-field')] = inp.value.trim();
      }
    });
    return answers;
  }

  // ============ 批改 ============
  // P7-R02: 统一 Checker —— 所有题目通过 check() / AnswerValidator，禁止页面自行判断
  function check() {
    if (!window.PracticeBridge) return;
    var isReadAloud = state.exerciseSet && state.exerciseSet.questions.some(function (q) {
      return q.__semantic && q.__semantic.answerMode === 'read-aloud';
    });
    if (isReadAloud) return; // 跟读类题目无书面批改（按钮已隐藏，此处兜底拦回车等入口）
    stopTimer();
    // 关联层：调用生成层 submit，接受批改反馈（score/results…）
    window.PracticeBridge.onSubmitFeedback(applySessionSubmitFeedback);
    window.PracticeBridge.submit();
  }

  // 接受生成层 submit 的反馈并应用到 UI
  function applySessionSubmitFeedback(fb) {
    if (!fb || fb.ok !== true) {
      var msg = (fb && fb.error && fb.error.message) || '批改出错';
      showNotice('批改出错', msg);
      return;
    }
    if (typeof fb.score !== 'number' || !Array.isArray(fb.results)) {
      showNotice('批改结果不兼容', 'check 必须返回 { score, total, correct, results, correctAnswers }');
      return;
    }
    var result = { score: fb.score, total: fb.total, correct: fb.correct, results: fb.results, correctAnswers: fb.correctAnswers };
    state.checkResult = result;
    state.answered = true;
    markQuestions(result);
    showResult(result);
    recordWrongAndDifficulty(result);
  }

  // 练习上下文 id（用于错题本 / 难度 EMA 持久化，替代原 plugin.id）
  function practiceContextId() {
    var parts = [state.subject, 'g' + state.grade];
    if (state.knowledgePointIds && state.knowledgePointIds.length) parts.push(state.knowledgePointIds[0]);
    else if (urlParams.kp) parts.push(urlParams.kp);
    else if (urlParams.kps) parts.push(urlParams.kps.split(',')[0]);
    else parts.push('all');
    return parts.join('-');
  }

  // 持久化：记录错题到错题本 + 更新难度自适应 EMA（任务2.2）
  function recordWrongAndDifficulty(result) {
    var pid = practiceContextId();
    var answers = collectAnswers();
    result.results.forEach(function (ok, i) {
      if (ok) return;
      var q = state.exerciseSet.questions[i];
      var key = String(i);
      StorageManager.addWrong({
        pluginId: pid,
        questionIndex: i,
        signature: (q && (q.q || q.text || q.rawHtml)) || '',
        questionData: q,
        userAnswer: (answers && answers[key] != null) ? answers[key] : '',
        timestamp: Date.now()
      });
    });
    var rate = result.total ? (result.correct / result.total) : 0;
    StorageManager.updateDifficulty(pid, rate);
    feedLearnerModel(result);
  }

  // M6-R20：批改结果回灌 Learner Model（知识点级掌握度 / 近期表现 / 错因）。
  // P3-R04：知识点来自 URL 参数（kp/kps），不再依赖插件声明。
  function feedLearnerModel(result) {
    if (typeof window.ResultCollector === 'undefined' || typeof window.LearnerStorage === 'undefined' ||
        typeof window.PracticeResult === 'undefined') return;
    try {
      var kpId = (state.knowledgePointIds && state.knowledgePointIds.length) ? state.knowledgePointIds[0]
        : (urlParams.kp || (urlParams.kps ? urlParams.kps.split(',')[0] : null));
      if (!kpId) return;
      var questions = state.exerciseSet.questions || [];
      if (!questions.length) return;
      var answers = collectAnswers();
      var results = [];
      result.results.forEach(function (ok, i) {
        var q = questions[i];
        if (!q) return;
        var userAns = (answers && answers[i] != null) ? answers[i] : '';
        results.push(window.PracticeResult.create({
          questionId: (q.id != null ? q.id : String(i)),
          knowledgePointId: kpId,
          correct: ok === true,
          userAnswer: userAns,
          correctAnswer: (result.correctAnswers && result.correctAnswers[i] != null)
            ? result.correctAnswers[i]
            : (q.answer != null ? q.answer : null),
          responseTime: null,
          questionDifficulty: (typeof q.difficulty === 'number') ? q.difficulty : (state.difficulty || null),
          questionType: (q.questionType || q.type || null),
          spiralLevel: (q.spiralLevel != null) ? q.spiralLevel : null,
          errorType: (q.errorType != null) ? q.errorType : null, // R10：仅接受题面可靠错因，当前无来源→null
          status: (ok === true) ? 'correct' : 'wrong',
          timestamp: Date.now()
        }));
      });
      var next = window.ResultCollector.collect(window.LearnerStorage.load(), results, {
        baseDifficulty: state.difficulty
      });
      window.LearnerStorage.save(next);
    } catch (e) {
      // 学习记录失败不影响批改主流程
      console.warn('[learner] 学习记录失败（不影响批改）:', e && e.message);
    }
  }

  

  function markQuestions(result) {
    var area = $('problemsArea');
    result.results.forEach(function (isRight, i) {
      var card = area.querySelector('.question-card[data-index="' + i + '"], .problem[data-i="' + i + '"]');
      if (!card) return;
      card.classList.remove('correct', 'wrong');
      card.classList.add(isRight ? 'correct' : 'wrong');
      var inp = card.querySelector('input[data-index="' + i + '"]');
      if (inp) {
        inp.classList.remove('correct', 'wrong');
        inp.classList.add(isRight ? 'correct' : 'wrong');
      }
      if (!isRight) {
        var fb = card.querySelector('.feedback');
        var tip = '✗ 正确答案：' + (result.correctAnswers && result.correctAnswers[i]);
        if (fb) { fb.textContent = tip; fb.style.color = 'var(--bad)'; }
      }
    });
  }

  function showResult(result) {
    var total = result.total || (state.exerciseSet && state.exerciseSet.questions.length) || 0;
    var wrong = total - result.correct;
    var tips = result.message || '';
    if (total) tips += ' · 用时 ' + elapsedText(getElapsed());
    if (result.parentCheck) {
      var phHtml = '<div class="result parent-check">' +
        '<div class="score parent">✅ 请家长检查</div>' +
        '<div class="detail">操作题由家长核对完成情况（' + total + ' 题）</div>' +
        '<div class="tips">' + (tips || '请家长检查书写与画图是否正确') + '</div>' +
        '<div class="redo-wrap"><button class="btn btn-ghost" id="redoAllBtn" style="margin-left:0;">重新生成</button></div></div>';
      var phRa = $('resultArea');
      phRa.innerHTML = phHtml;
      phRa.classList.add('show');
      phRa.scrollIntoView({ behavior: 'smooth', block: 'start' });
      $('redoAllBtn').onclick = generate;
      return;
    }
    var html = '<div class="result">' +
      '<div class="score">' + result.score + ' 分</div>' +
      '<div class="detail">答对 ' + result.correct + ' / ' + total + ' 题 · 正确率 ' + (total ? Math.round(result.correct / total * 100) : 0) + '%</div>' +
      '<div class="tips">' + tips + '</div>' +
      '<div class="redo-wrap">' +
      (wrong > 0 ? '<button class="btn btn-ghost" id="redoBtn">错题重做（' + wrong + '）</button>' : '') +
      '<button class="btn btn-ghost" id="redoAllBtn" style="margin-left:8px;">重新生成</button>' +
      '</div></div>';
    var ra = $('resultArea');
    ra.innerHTML = html;
    ra.classList.add('show');
    ra.scrollIntoView({ behavior: 'smooth', block: 'start' });
    var redoBtn = $('redoBtn');
    if (redoBtn) redoBtn.onclick = redoWrong;
    $('redoAllBtn').onclick = generate;
  }

  // ============ 错题重做 ============
  function redoWrong() {
    if (!state.exerciseSet || !state.checkResult) return;
    var wrongIdx = [];
    state.checkResult.results.forEach(function (ok, i) { if (!ok) wrongIdx.push(i); });
    if (!wrongIdx.length) return;
    var wrongQuestions = state.exerciseSet.questions.filter(function (_, i) { return wrongIdx.indexOf(i) !== -1; });
    var set = {
      questions: wrongQuestions,
      meta: (state.exerciseSet.meta || {})
    };
    // P3-R04：清除 Engine 渲染成品，回落通用降级渲染重渲染错题
    state.lastSemantic = null;
    state.exerciseSet = set;
    state.checkResult = null;
    state.answered = false;
    state.count = wrongQuestions.length;
    render(set);
    // 重做即新一轮作答：隐藏上一轮批改结果，并复位「显示答案」状态，
    // 避免陈旧分数误导、以及 revealed 标记与已重渲染 DOM 的状态错位（E2E C1 捕获）。
    var ra = $('resultArea');
    ra.classList.remove('show');
    ra.dataset.revealed = '0';
    $('revealBtn').textContent = '显示答案';
    $('checkBtn').disabled = false;
    $('revealBtn').disabled = false;
    $('printBtn').disabled = false;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ============ 显示/隐藏答案 ============
  function toggleReveal() {
    if (!state.exerciseSet) return;
    var ra = $('resultArea');
    if (ra.dataset.revealed === '1') {
      ra.dataset.revealed = '0';
      $('revealBtn').textContent = '显示答案';
      $('problemsArea').querySelectorAll('.revealed-answer').forEach(function (n) { n.remove(); });
      return;
    }
    ra.dataset.revealed = '1';
    $('revealBtn').textContent = '隐藏答案';
    var result = PluginUtil.computeResult(state.exerciseSet.questions, collectAnswers());
    var cards = $('problemsArea').querySelectorAll('.question-card, .problem');
    result.results.forEach(function (ok, i) {
      var card = cards[i];
      if (!card) return;
      var old = card.querySelector('.revealed-answer');
      if (old) old.remove();
      var ans = result.correctAnswers && result.correctAnswers[i];
      var d = el('div', 'revealed-answer');
      d.style.cssText = 'font-size:12px;color:var(--brand-d);font-weight:700;margin-top:6px';
      d.textContent = '✔ 答案：' + (ans != null ? ans : '—');
      card.appendChild(d);
    });
  }

  // ============ 打印 ============
  // P6-R04: 打印统一经 Engine 产物（state.lastSemantic）或 DOM 克隆，无 Plugin 依赖。
  function printFile() {
    if (!practiceSession && !state.exerciseSet) return;
    showLoopToast(state.exerciseSet ? state.exerciseSet.questions.length : 0); // 优化点4：闭环引导
    // 打印统一经 Engine 产物：单次会话优先 session.print()（走语义题）；
    // 编排聚合会话（聚合 shim 无 print）回退到已渲染的 #problemsArea 整卷打印。
    if (practiceSession && typeof practiceSession.print === 'function') {
      practiceSession.print().catch(function (err) { alert('打印失败：' + err.message); });
    } else if (window.Print && document) {
      var area = document.getElementById('problemsArea');
      var meta = state.exerciseSet && state.exerciseSet.meta;
      window.Print.open(area, (meta && meta.title) || '练习题', { pageType: 'math' });
    } else {
      alert('打印失败：打印模块不可用');
    }
  }

  // 优化点4：生成后闭环引导 Toast（打印→拍照批改→薄弱点追踪）
  function showLoopToast(n) {
    var t = $('loopToast'); if (!t) return;
    var c = $('loopToastCount'); if (c) c.textContent = (n || 0);
    t.hidden = false;
    // 强制 reflow 以便过渡动画生效
    void t.offsetWidth;
    t.classList.add('show');
    clearTimeout(t._hideTimer);
    t._hideTimer = setTimeout(hideLoopToast, 7000);
  }
  function hideLoopToast() {
    var t = $('loopToast'); if (!t) return;
    t.classList.remove('show');
    clearTimeout(t._hideTimer);
    setTimeout(function () { if (!t.classList.contains('show')) t.hidden = true; }, 280);
  }

  // ============ 题量（20 / 30 / 50 / 自定义） ============
  function setCount(n) {
    n = Math.round(Number(n));
    if (!(n >= 1 && n <= 50)) { showNotice('题量无效', '自定义题量请填写 1~50 之间的整数。'); return; }
    state.count = n;
    syncCountUI();
    // 双量互锁守恒：总数量变化 → 分题型数量按最大余数重分配（Σ = 新总数量）
    syncTypeCounts();
    renderKpRatio();
    if (state.exerciseSet) generate();
  }

  // 自定义同框：自定义模式时 chip 变为数字输入框（占位灰字「自定义」，键入即消失）
  function setCustomBox(showInput, focus) {
    var inp = $('customCount');
    var lbl = document.querySelector('#countGroup .custom-chip .custom-label');
    if (inp) {
      inp.style.display = showInput ? '' : 'none';
      if (showInput && focus) inp.focus();
    }
    if (lbl) lbl.style.display = showInput ? 'none' : '';
  }

  function syncCountUI() {
    var chips = document.querySelectorAll('#countGroup .chip');
    chips.forEach(function (c) { c.classList.remove('active'); c.setAttribute('aria-checked', 'false'); });
    var customInp = $('customCount');
    if (state.count === 20 || state.count === 30 || state.count === 50) {
      document.querySelectorAll('#countGroup .chip[data-count="' + state.count + '"]').forEach(function (c) {
        c.classList.add('active'); c.setAttribute('aria-checked', 'true');
      });
      setCustomBox(false);
    } else {
      document.querySelectorAll('#countGroup .chip[data-count="custom"]').forEach(function (c) {
        c.classList.add('active'); c.setAttribute('aria-checked', 'true');
      });
      if (customInp) customInp.value = state.count;
      setCustomBox(true);
    }
    updateCountTip();
  }

  // 根据当前排版实测「填多少题可正好铺满 A4 整页」的推荐值
  function updateCountTip() {
    var tip = $('countTip');
    if (!tip) return;
    var customChip = document.querySelector('#countGroup .chip[data-count="custom"]');
    var isCustom = customChip && customChip.classList.contains('active');
    if (!isCustom || !state.exerciseSet || !state.exerciseSet.questions.length) {
      tip.style.display = 'none';
      return;
    }
    var area = $('problemsArea');
    var src = area.querySelector('.questions-grid, .q-grid');
    if (!src || !src.children.length) { tip.style.display = 'none'; return; }
    // 打印/A4 端：按 A4 可打印宽度动态计算列数（与打印页完全一致，避免屏幕列数硬塞 A4）
    var cfg = 'math';
    var printableW = a4PrintableWidthPx(cfg);
    var fixedCols = state.exerciseSet.meta && state.exerciseSet.meta.columns;
    var cols = fixedCols ? fixedCols : PluginUtil.layout.calcOptimalCols(state.exerciseSet, printableW);
    // 上下边距用于后续高度测算（与 shared/presentation/print.js 的 @page 边距一致）
    var route = (window.Print && window.Print.ROUTES && window.Print.ROUTES[cfg]) || {};
    var m = (route.pageMargin || '12mm 10mm').match(/([\d.]+)mm\s+([\d.]+)mm/);
    var v = m ? parseFloat(m[1]) : 12;   // 上下边距
    var MM = 96 / 25.4;
    var printableH = (297 - 2 * v) * MM;          // 一页内容高（px）

    // 隐藏测量容器：与打印同宽、同列数、同间距，克隆当前卡片循环排布（保留打印端列跨），实测铺满高度
    var meas = $('printMeasure');
    if (!meas) { meas = el('div'); meas.id = 'printMeasure'; area.appendChild(meas); }
    meas.style.cssText = 'position:fixed;left:-20000px;top:0;width:' + printableW + 'px;visibility:hidden;';
    var g = el('div');
    g.style.cssText = 'display:grid;grid-template-columns:repeat(' + cols + ',minmax(0,1fr));gap:14px;grid-auto-flow:row dense;';
    meas.innerHTML = '';
    meas.appendChild(g);
    var pats = [];
    for (var ci = 0; ci < src.children.length; ci++) pats.push(src.children[ci].cloneNode(true));
    var fitted = 0;
    for (var n = 1; n <= 80; n++) {
      g.appendChild(pats[(n - 1) % pats.length].cloneNode(true));
      var kids = g.children;
      var bottom = 0;
      var firstTop = null;
      for (var ki = 0; ki < kids.length; ki++) {
        var r = kids[ki].getBoundingClientRect();
        if (firstTop === null) firstTop = r.top;
        var b = r.top + r.height;
        if (b > bottom) bottom = b;
      }
      if (bottom - firstTop > printableH) break;
      fitted = n;
    }
    // 若 80 题仍铺不满一页，按已测单卡平均高度继续推算（超出 50 上限则取 50）
    if (fitted >= 80 && src.children.length) {
      var kids2 = g.children;
      var hsum = 0;
      for (var hi = 0; hi < kids2.length; hi++) hsum += kids2[hi].getBoundingClientRect().height;
      var avgH = hsum / kids2.length;
      var remain = printableH - (bottom - firstTop);
      fitted += Math.max(0, Math.floor(remain / (avgH + 14)) * cols);
    }
    var n = Math.min(50, Math.max(1, fitted));
    tip.textContent = 'Tips，推荐设置 ' + n + ' 可以打印 A4 整页';
    tip.style.display = '';
  }

  // ============ 左上角快速切换（学科 / 年级） ============
  // ============ 合并：二级页装配区（科目/年级/题型选择） ============
  // 仅 UI 层：复用 KnowledgeBank（catalog-utils.getKPEntries）、MODULE_CATALOG、GeneratorRegistry（原生 KP 覆盖），
  // 与 practice.html 既有的 PracticeSession / generate()；不新增任何引擎依赖。
  function clampNum(n, lo, hi, dft) { n = Number(n); if (!isFinite(n)) return dft; return Math.min(hi, Math.max(lo, Math.round(n))); }

  var asmState = {
    subject: urlParams.subject || 'math',
    grade: urlParams.grade,
    selected: {},
    collapsed: {},
    qt: null,                // 任务3：URL qt 题型过滤（模块id / 细粒度type / 标准题型 / 特殊题型）
    recommendType: null      // 任务3：入口（kps/plugin）推荐题型名（标题 / 提示）
  };
  var asmKpById = {};
  var ASM_LEVEL_TAGS = ['基础', '变式', '综合', '拓展'];
  var ASM_SUBJECT_CONFIG = {
    math: { name: '数学', moduleOrder: ['M0','M1','M2','M3','M4','M5','M6','M7','M8','M9','M10','M11','M12','M13','C1','C2','C3','C4','C5','C6','C7','C8','C9'] }
  };

  // ============ 任务3：URL 入口解析（qt / kps / plugin）与知识点过滤 ============
  // 特殊题型（select.html 的 qtype 语义，同时兼容历史 qt 传参）
  var QT_SPECIAL = { comprehensive: '综合练习', exam: '考试', competition: '竞赛' };
  // R4 决策上收：QT_STD_MODULES 静态过滤表已移除，改由大服务层 module-catalog.js
  // 提供「题型→可见模块」查询（PracticeBridge.visibleModulesForType），UI 只读结果。
  // R9 上收：历史细粒度 qt 展示名（addsub/cushi 等）已并入题型注册表
  // QuestionTypeRegistry.LEGACY_DISPLAY_NAMES，经 PracticeBridge.questionTypeDisplayName 查询，UI 不再持有展示表。

  function asmModuleCatalog() { return window.MODULE_CATALOG || []; }
  function moduleNameOf(mid) {
    var catalog = asmModuleCatalog();
    for (var i = 0; i < catalog.length; i++) if (catalog[i] && catalog[i].id === mid) return catalog[i].name || mid;
    return mid;
  }
  function moduleNameForIds(ids) {
    var mids = {};
    ids.forEach(function (id) { var k = asmKpById[id]; if (k && k.moduleId) mids[k.moduleId] = 1; });
    var keys = Object.keys(mids);
    if (keys.length === 1) return moduleNameOf(keys[0]);
    return keys.length ? '综合练习' : null;
  }
  // 知识点是否落在 qt 过滤范围内（无 qt 视为全部可见）。
  // R4 上收：能力判断委托大服务层可见性查询服务 PracticeBridge.kpVisibleInType，
  // UI 不再持有静态过滤表 / 不做推导，只读查询结果。
  function kpVisibleInQT(k, qt) {
    if (window.PracticeBridge && typeof window.PracticeBridge.kpVisibleInType === 'function') {
      return window.PracticeBridge.kpVisibleInType(k, qt);
    }
    var q = String(qt || '').toLowerCase().trim();
    if (!q) return true;
    if (q === 'competition') return (k.moduleId || '').toUpperCase().charAt(0) === 'C';
    if (k.moduleId && k.moduleId.toLowerCase() === q) return true;
    if (k.type && String(k.type).toLowerCase() === q) return true;
    return false;
  }
  // qt → 展示名（标题 / 提示用）。
  // R4：QT_STD_MODULES 已移除，可见模块查询走大服务层 PracticeBridge.visibleModulesForType；
  // 取首个可见模块名作展示名；bridge 不可用时按模块 id / 细粒度名兜底。
  function qtName(qt) {
    var q = String(qt || '').trim();
    if (QT_SPECIAL[q]) return QT_SPECIAL[q];
    if (/^[MCEN]\d+$/i.test(q)) return moduleNameOf(q.toUpperCase());
    var mods = (window.PracticeBridge && typeof window.PracticeBridge.visibleModulesForType === 'function')
      ? window.PracticeBridge.visibleModulesForType(q)
      : null;
    if (mods && mods.length) return moduleNameOf(mods[0]);
    // R9 上收：细粒度 qt 展示名走大服务层（QuestionTypeRegistry.LEGACY_DISPLAY_NAMES）
    return (window.PracticeBridge && typeof window.PracticeBridge.questionTypeDisplayName === 'function')
      ? window.PracticeBridge.questionTypeDisplayName(q) : null;
  }
  // MATH-14 native-only：旧 plugin= 深链反查知识点。legacy 注册表已删除，
  // 仅按知识库 pluginId 直配 → 兜底该科目年级全部可用（v4.0.0 基线行为）。
  function asmResolvePlugin(plugin, all) {
    var ids = [];
    var direct = all.filter(function (k) { return k.pluginId === plugin; });
    if (direct.length) {
      var avail = direct.filter(function (k) { return k.avail; });
      ids = (avail.length ? avail : direct).map(function (k) { return k.id; });
    } else {
      ids = all.filter(function (k) { return k.avail; }).map(function (k) { return k.id; });
    }
    return { ids: ids, name: null };
  }
  // 当前过滤范围下的可见知识点
  function asmVisibleKps() {
    var all = [];
    asmBuildData().forEach(function (g) { all = all.concat(g.kps); });
    return all;
  }
  // 当前可选题型名（标题用）：入口推荐 > qt 语义 > 当前勾选模块 > 综合练习
  function deriveTypeName() {
    if (asmState.recommendType) return asmState.recommendType;
    var fromQt = urlParams.qt ? qtName(urlParams.qt) : null;
    if (fromQt) return fromQt;
    var ids = Object.keys(asmState.selected).filter(function (id) { var k = asmKpById[id]; return k && k.avail; });
    if (ids.length) { var m = moduleNameForIds(ids); if (m) return m; }
    return '综合练习';
  }
  // 根据 URL 入参（kps / kp / qt / plugin）统一勾选 + 推荐题型；返回是否触发自动生成
  function asmSeedFromUrl() {
    asmState.selected = {};
    asmState.qt = null;
    asmState.recommendType = null;
    // 快速模式题型策略白名单：types 与 kps 同源（select 页 QUICK_TYPE_MAP 映射），
    // 传给生成层作为规划期题型过滤；无 types 时行为与原来完全一致。
    asmState.questionTypes = urlParams.types ? urlParams.types.split(',').filter(Boolean) : null;
    var all = [];
    asmBuildData().forEach(function (g) { all = all.concat(g.kps); });
    if (urlParams.kps) {
      urlParams.kps.split(',').forEach(function (x) { if (x && asmKpById[x]) asmState.selected[x] = true; });
      asmState.recommendType = moduleNameForIds(Object.keys(asmState.selected)) || null;
    } else if (urlParams.kp) {
      if (asmKpById[urlParams.kp]) asmState.selected[urlParams.kp] = true;
      asmState.recommendType = (asmKpById[urlParams.kp] ? moduleNameOf(asmKpById[urlParams.kp].moduleId) : null) || null;
    } else if (urlParams.qt) {
      asmState.qt = urlParams.qt;
      asmVisibleKps().forEach(function (k) { if (k.avail) asmState.selected[k.id] = true; });
    } else if (urlParams.plugin) {
      var r = asmResolvePlugin(urlParams.plugin, all);
      r.ids.forEach(function (id) { if (asmKpById[id]) asmState.selected[id] = true; });
      asmState.recommendType = r.name || null;
    }
    return { auto: !!(urlParams.kp || urlParams.kps || urlParams.qt || urlParams.plugin) };
  }
  // 底部知识页入口：当前知识点 → knowledge/{kpId}.html
  function renderKpLinks() {
    var bar = $('kpLinksBar'); if (!bar) return;
    var ids = Object.keys(asmState.selected).filter(function (id) { return asmKpById[id] && asmKpById[id].avail; });
    if (!ids.length) ids = (state.knowledgePointIds || []).filter(function (id) { return asmKpById[id]; });
    if (!ids.length) { bar.hidden = true; return; }
    var list = $('kpLinksList');
    list.innerHTML = ids.slice(0, 14).map(function (id) {
      var k = asmKpById[id];
      return '<a class="kp-link" href="knowledge/' + esc(id) + '.html" title="' + esc(k && k.name ? k.name : id) + '">'
        + esc(k && k.name ? k.name : id) + '</a>';
    }).join('');
    var canon = { math: 'math' }[state.subject] || state.subject;
    $('kpLinksIndex').href = 'knowledge/knowledge-index.html?subject=' + encodeURIComponent(canon) + '&grade=' + state.grade;
    bar.hidden = false;
  }

  function asmPluginIndex() {
    // MATH-14 native-only：可练判定数据源 = GeneratorRegistry（原生 Generator 声明的 KP 并集）
    var idx = {};
    var reg = (typeof window.GeneratorRegistry !== 'undefined' && window.GeneratorRegistry) || null;
    if (reg && typeof reg.all === 'function') {
      reg.all().forEach(function (r) { (r.knowledgePoints || []).forEach(function (kp) { idx[kp] = true; }); });
    }
    return idx;
  }
  function asmReadStat(kpId) {
    var stat = { attempts: 0, mastery: null, recentAccuracy: null, weak: false, errorProne: false };
    try {
      if (!window.LearnerStorage || !window.LearnerModel) return stat;
      var ls = window.LearnerStorage.load(); if (!ls) return stat;
      var st = window.LearnerModel.getState(ls, kpId);
      stat.attempts = st.attempts || 0;
      stat.mastery = stat.attempts ? (st.mastery || 0) : null;
      stat.recentAccuracy = (typeof st.recentAccuracy === 'number') ? st.recentAccuracy : null;
      stat.errorProne = (window.LearnerModel.getErrors(ls, kpId) || []).length > 0;
      stat.weak = stat.attempts > 0 && (st.mastery < 0.5 || st.recentAccuracy < 0.6);
    } catch (e) {}
    return stat;
  }
  function asmBuildData() {
    var subj = asmState.subject, grade = asmState.grade;
    var entries = (window.CatalogUtils && window.CatalogUtils.getKPEntries)
      ? window.CatalogUtils.getKPEntries(subj, grade) : [];
    var pIdx = asmPluginIndex();
    var catalog = window.MODULE_CATALOG || [];
    var modName = function (mid) {
      for (var i = 0; i < catalog.length; i++) if (catalog[i] && catalog[i].id === mid) return catalog[i].name || mid;
      return mid;
    };
    var kps = [];
    asmKpById = {};
    entries.forEach(function (e) {
      if (!e || !e.id) return;
      var level = clampNum(e.weight, 1, 4, 1);
      var plugin = e.pluginId ? pIdx[e.pluginId] : null;
      // 「可练」判定：注册表存在 + 非占位插件 + 年级在插件 grades 内（与二级页契约一致）
      var avail = !!(plugin && !plugin.isPlaceholder && (!plugin.grades || plugin.grades.indexOf(grade) >= 0));
      var k = { id: e.id, name: e.name || e.id, moduleId: e.moduleId || '', type: e.type || '',
        weight: Number(e.weight) || 1, level: level, tag: ASM_LEVEL_TAGS[level - 1], avail: avail, stat: asmReadStat(e.id),
        pluginId: e.pluginId || '' };
      // 任务3：qt 题型过滤（comprehensive/exam 为全量覆盖，不做视图过滤）
      if (asmState.qt && asmState.qt !== 'comprehensive' && asmState.qt !== 'exam' && !kpVisibleInQT(k, asmState.qt)) return;
      kps.push(k); asmKpById[k.id] = k;
    });
    var buckets = {};
    kps.forEach(function (k) { (buckets[k.moduleId] = buckets[k.moduleId] || []).push(k); });
    var order = (ASM_SUBJECT_CONFIG[subj].moduleOrder || []).slice();
    Object.keys(buckets).forEach(function (mid) { if (order.indexOf(mid) === -1) order.push(mid); });
    var groups = [];
    order.forEach(function (mid) {
      if (!buckets[mid] || !buckets[mid].length) return;
      groups.push({ id: mid, name: modName(mid), kps: buckets[mid] });
    });
    return groups;
  }
  // ============ 分题型题量（双量控制：总数量 + 分题型数量，互锁守恒） ============
  // 数量控制语义：
  //   - 总数量由「数量」区（20/30/50/自定义）控制；分题型默认 = 总数量在所选题型间最大余数均分（Σ = 总数量，守恒）。
  //   - 修改任一题型数量 → 其余题型守恒重分配（Σ 恒等于总数量）；题型数量恒 >= 0。
  //   - 生成层决策（planByType）按题型在知识点池内选择最优化「最优知识点群」、群内均分题量；
  //     旧「每知识点数量填空 / 权重占比 kpAllocation（知识点控制数量）」逻辑已移除。
  var QT_STD_NAMES = {
    oral: '口算', calc: '计算', vertical: '竖式计算', mixed: '混合运算',
    fill: '填空', match: '连线', operation: '算式', draw: '作图',
    picture: '看图列式', apply: '应用题', word: '应用题', stats: '统计',
    reason: '推理', judge: '判断', choice: '选择', open: '开放题', geometry: '几何',
    operate: '操作/作图', sort: '排序'
  };
  function typeDisplayName(t) {
    var canonical = (window.PracticeBridge && typeof window.PracticeBridge.questionTypeDisplayName === 'function')
      ? window.PracticeBridge.questionTypeDisplayName(String(t || '')) : null;
    return canonical || QT_STD_NAMES[t] || String(t || '题型');
  }
  // 当前有效题型顺序（去重）：优先 state.questionTypes，其次 asmState.questionTypes
  function perTypeOrder() {
    var t = (state.questionTypes && state.questionTypes.length) ? state.questionTypes
      : (asmState.questionTypes || null);
    if (!t || !t.length) return [];
    var seen = {}, out = [];
    t.forEach(function (x) { if (x && !seen[String(x)]) { seen[String(x)] = true; out.push(String(x)); } });
    return out;
  }
  function splitEqual(total, n) {
    var out = [];
    if (!n || total < 1) return out;
    var base = Math.floor(total / n), rem = total - base * n;
    for (var i = 0; i < n; i++) out.push(base + (i < rem ? 1 : 0));
    return out;
  }
  // 归一化分题型数量：state.perTypeCount{type:count} 存在、非负、Σ = 总数量（守恒）
  function syncTypeCounts() {
    var total = Number(state.count) || 20;
    var types = perTypeOrder();
    if (!types.length) { state.perTypeCount = null; state.typeCounts = null; return; }
    var map = state.perTypeCount || {};
    var dirty = false;
    types.forEach(function (t) {
      var v = Number(map[t]);
      if (!(v >= 0) || Math.round(v) !== v) { map[t] = 0; dirty = true; }
    });
    var sum = types.reduce(function (a, t) { return a + (Number(map[t]) || 0); }, 0);
    if (!dirty && sum === total) { state.perTypeCount = map; buildTypeCounts(); return; }
    var shares = splitEqual(total, types.length);
    state.perTypeCount = {};
    types.forEach(function (t, i) { state.perTypeCount[t] = shares[i]; });
    buildTypeCounts();
  }
  function buildTypeCounts() {
    var types = perTypeOrder();
    if (!types.length) { state.typeCounts = null; return; }
    state.typeCounts = types.map(function (t) {
      return { questionType: t, count: Math.max(0, Number(state.perTypeCount[t]) || 0) };
    });
  }
  // 修改某题型数量 → 该题型置为输入值，其余题型守恒重分配（Σ 恒 = 总数量）
  function setTypeCount(type, v) {
    var total = Number(state.count) || 20;
    var types = perTypeOrder();
    if (!types.length) return;
    v = Math.max(0, Math.min(total, Math.round(Number(v))));
    state.perTypeCount[type] = v;
    var others = types.filter(function (t) { return t !== type; });
    if (others.length) {
      var shares = splitEqual(total - v, others.length);
      others.forEach(function (t, i) { state.perTypeCount[t] = shares[i]; });
    }
    buildTypeCounts();
  }
  function renderKpRatio() {
    var wrap = $('kpRatio'); if (!wrap) return;
    syncTypeCounts();
    var types = perTypeOrder();
    var ids = Object.keys(asmState.selected).filter(function (id) { return asmKpById[id]; });
    if (!types.length || !ids.length) {
      var e = $('kpRatioEmpty');
      if (e) e.style.display = '';
      wrap.innerHTML = '';
      return;
    }
    var total = Number(state.count) || 20;
    var list = document.createElement('div');
    list.className = 'kp-ratio-list kp-ratio-types';
    types.forEach(function (t) {
      var n = (state.perTypeCount && state.perTypeCount[t]) || 0;
      var item = document.createElement('div');
      item.className = 'kp-ratio-item';
      item.innerHTML =
        '<span class="nm" title="' + esc(typeDisplayName(t)) + '">' + esc(typeDisplayName(t)) + '</span>' +
        '<input type="number" class="kp-blank-num" data-pt="' + esc(t) + '" min="0" max="' + total + '" step="1" value="' + n + '" ' +
          'aria-label="' + esc(typeDisplayName(t)) + ' 题量（可修改，其余题型守恒重分配）">' +
        '<span class="kp-blank-unit">题</span>';
      list.appendChild(item);
    });
    var sep = document.createElement('div');
    sep.className = 'kp-ratio-item sep';
    sep.innerHTML = '<span class="nm">总题量</span><span class="total" id="kpRatioTotal">' + total + ' 题</span>';
    list.appendChild(sep);
    wrap.innerHTML = '';
    wrap.appendChild(list);
    if ($('kpRatioEmpty')) $('kpRatioEmpty').style.display = 'none';
  }
  function bindKpRatio() {
    var wrap = $('kpRatio');
    if (!wrap) return;
    // change / Enter / ↑↓：该题型置为输入值，其余题型守恒重分配（Σ 恒 = 总数量，两量互锁）
    var onCommit = function (e) {
      var inp = e.target && e.target.closest ? e.target.closest('input.kp-blank-num[data-pt]') : null;
      if (!inp || !state.perTypeCount) return;
      var t = inp.getAttribute('data-pt');
      var total = Number(state.count) || 20;
      var v = Math.round(Number(inp.value));
      if (isNaN(v)) { renderKpRatio(); return; }
      setTypeCount(t, Math.min(total, Math.max(0, v)));
      renderKpRatio();
    };
    wrap.addEventListener('change', onCommit);
    wrap.addEventListener('keydown', function (e) {
      var inp = e.target && e.target.closest ? e.target.closest('input.kp-blank-num[data-pt]') : null;
      if (inp) {
        if (e.key === 'Enter') { e.preventDefault(); onCommit(e); inp.blur(); }
        else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); onCommit(e); }
      }
    });
  }

  function asmGenerateFromSelection() {
    var ids = Object.keys(asmState.selected);
    if (!ids.length) { showNotice('请先选择题型', '在上方按模块勾选至少一个知识点（标注「暂不可练」的无法生成）。'); return; }
    state.subject = asmState.subject;
    state.grade = asmState.grade;
    state.knowledgePointIds = ids;   // 供错题本 / 难度 EMA 使用（practiceContextId / feedLearnerModel 优先读取）
    state.questionTypes = asmState.questionTypes || null; // 题型策略白名单（随请求传给生成层）
    // B4 收敛：types+count 双量随 state 透传，generate()→start() 经 state.knowledgePointIds 与
    // state.typeCounts 拿到等价指令，mode 亦自动推导为 multi-kp。知识点题量占比（kpAllocation）
    // 已废除：分题型数量由决策层按最优知识点群分配。
    syncTypeCounts();
    renderKpRatio();
    generate();
  }

  // ============ 按钮绑定 ============
  function bindEvents() {
    document.querySelectorAll('#countGroup .chip').forEach(function (c) {
      c.addEventListener('click', function () {
        if (c.dataset.count === 'custom') {
          document.querySelectorAll('#countGroup .chip').forEach(function (x) { x.classList.remove('active'); x.setAttribute('aria-checked', 'false'); });
          c.classList.add('active');
          c.setAttribute('aria-checked', 'true');
          setCustomBox(true, true);
          updateCountTip();
          return;
        }
        setCount(+c.dataset.count);
      });
    });
    var customInp = $('customCount');
    if (customInp) {
      customInp.addEventListener('change', function () {
        if (customInp.value === '') { syncCountUI(); return; }
        setCount(customInp.value);
      });
      customInp.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); customInp.blur(); }
      });
    }
    $('genBtn').addEventListener('click', generate);
    // P0-002 修复：checkBtn「检查答案」此前仅能经输入框回车触发，按钮点击无绑定。
    $('checkBtn').addEventListener('click', check);
    $('revealBtn').addEventListener('click', toggleReveal);
    $('printBtn').addEventListener('click', printFile);
    // 优化点4：闭环引导 Toast 关闭
    var loopClose = $('loopToastClose');
    if (loopClose) loopClose.addEventListener('click', hideLoopToast);
    // U2 清理：原 resize 防抖回调体为空（自适应难度记忆已移除），为无操作死监听，直接删除。
    // 刷新重置：重新加载页面（原自适应难度记忆功能已移除）
    var refreshResetBtn = $('refreshResetBtn');
    if (refreshResetBtn) refreshResetBtn.addEventListener('click', function () {
      location.reload();
    });

    // 难度数值输入：填写后立即应用（已生成题目则重新生成）
    var diffInput = $('difficultyInput');
    if (diffInput) {
      diffInput.addEventListener('change', function () {
        var v = Number(diffInput.value);
        if (!(v >= 1 && v <= 10)) { diffInput.value = state.difficulty; return; }
        state.difficulty = v;
        diffInput.value = state.difficulty;
        if (state.exerciseSet) generate();
      });
    }

    bindKpRatio();
  }

  // ============ 启动 ============
  // P3-R04：boot 不再加载插件 / 判断 Strategy / Generator / Legacy。
  // 只设置 UI 状态，展示参数面板，并在有知识点参数时自动生成。
  function boot() {
    var rawParams = new URLSearchParams(window.location.search);
    var savedState = StorageManager.loadState();

    state.subject = urlParams.subject || 'math';
    state.grade = urlParams.grade;
    state.count = urlParams.count;
    state.difficulty = urlParams.difficulty;

    // 恢复上次练习设置（仅当 URL 未显式覆盖）
    if (savedState.lastPractice) {
      var ls = savedState.lastPractice.settings || {};
      if (!rawParams.has('count') && ls.count) state.count = ls.count;
      if (!rawParams.has('difficulty') && ls.difficulty) state.difficulty = ls.difficulty;
    }

    // 标题与参数面板
    $('sheetTitle').textContent = buildTitle(state.grade, deriveTypeName(), null);
    $('controlsPanel').style.display = '';
    syncCountUI();
    var diffInput = $('difficultyInput');
    if (diffInput) diffInput.value = state.difficulty;
    $('checkBtn').disabled = true;
    $('revealBtn').disabled = true;
    $('printBtn').disabled = true;

    // 会话切换：清空 SVG 渲染缓存，避免长会话内存只增不减（svg-core.clearCache）
    if (window.SVGUtil && window.SVGUtil.clearCache) window.SVGUtil.clearCache();

    // P3-R03：待生成状态
    var area = $('problemsArea');
    if (window.App && window.App.UIState && window.App.UIState.generationHtml) {
      area.innerHTML = window.App.UIState.generationHtml.idle();
    } else {
      area.innerHTML = '<div class="empty">选择参数后点击「生成练习题」开始～</div>';
    }

    // 知识库分片懒加载：确认科目后按需注入 → 统一解析 URL 入参 → 需要时自动生成
    var ensureKB = (typeof KnowledgeBank !== 'undefined' && KnowledgeBank.ensureKnowledgeData)
      ? KnowledgeBank.ensureKnowledgeData(state.subject)
      : Promise.resolve(null);

    // 任务3：入参归一（kp/kps/qt/plugin）勾选 + 自动生成 + 打印参数支持
    function initFromUrlSeed() {
      var seed = asmSeedFromUrl();
      renderKpRatio();
      renderKpLinks();
      $('sheetTitle').textContent = buildTitle(state.grade, deriveTypeName(), null);
      if (!seed.auto) return;
      // P7: 直接打印参数（生成完成后立即打印）
      if (urlParams.print) {
        state.subject = asmState.subject;
        state.grade = asmState.grade;
        state.knowledgePointIds = Object.keys(asmState.selected);
        state.questionTypes = asmState.questionTypes || null;
        var buildAndPrint = function () {
          // B5 修正：直接打印也统一经关联层唯一入口 PracticeBridge.start()（保留编排 / 分题型数量），
          // 不再绕过关联层直调 new PracticeSession().start()。
          // 打印：单次会话经 session.print()（走语义题 print）；编排聚合会话（聚合 shim 无 print）
          // 回退到已渲染的 #problemsArea 整卷打印。
          window.PracticeBridge.onStartFeedback(function (fb) {
            if (!fb || fb.ok !== true) {
              showNotice('生成失败，请重试', (fb && fb.error && fb.error.message) || '生成失败');
              return;
            }
            applyExerciseSet({ questions: fb.questions || [], meta: fb.meta });
            setTimeout(function () {
              var s = fb.session;
              if (s && typeof s.print === 'function') {
                s.print().catch(function (err) { alert('打印失败：' + err.message); });
              } else if (window.Print && document) {
                var area = document.getElementById('problemsArea');
                window.Print.open(area, (fb.meta && fb.meta.title) || '练习题', { pageType: 'math' });
              } else {
                alert('打印失败：打印模块不可用');
              }
            }, 300);
          });
          syncTypeCounts();
          window.PracticeBridge.start(
            {
              state: state,
              knowledgePoints: state.knowledgePointIds,
              knowledgePointId: state.kp || null,
              qType: null, questionType: state.questionType || null,
              questionTypes: state.questionTypes || null,
              titleType: deriveTypeName(),
              perTypeCount: (state.typeCounts && state.typeCounts.length === 1) ? state.typeCounts[0].count : null,
              typeCounts: state.typeCounts || null,
              raw: { levels: state }
            }
          );
        };
        buildAndPrint();
        return; // 直接打印模式不进入常规流程
      }
      // 题型卡片 / 深链直达：待分片就绪后自动生成
      asmGenerateFromSelection();
    }

    ensureKB.then(initFromUrlSeed).catch(initFromUrlSeed);
  }

  bindEvents();
  boot();
})();
</script>
<script>(function(){var e=document.getElementById('footYear');if(e)e.textContent=new Date().getFullYear();})();</script>
