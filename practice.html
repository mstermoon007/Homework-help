<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>统一练习页 · Homework Help</title>
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/base.css">
<link rel="stylesheet" href="shared/components.css">
<link rel="stylesheet" href="shared/toolbar.css">
<link rel="stylesheet" href="shared/pages.css">
<!-- 练习页专属样式见 shared/pages.css（@layer pages）；共享组件见 components.css，令牌见 tokens.css -->
</head>
<body>
<div class="wrap">
  <!-- 左上角快速切换（学科 + 年级，醒目便利） -->
  <div class="quick-switch" id="quickSwitch">
    <button class="qs-btn" id="qsBtn" title="快速切换学科 / 年级 / 返回首页">快速切换</button>
    <div class="qs-menu" id="qsMenu" style="display:none;">
      <div class="qs-hd">切换学科</div>
      <div class="qs-row" id="qsSubject"></div>
      <div class="qs-hd">切换年级</div>
      <div class="qs-row" id="qsGrade"></div>
      <div class="qs-hd">其他</div>
      <div class="qs-row"><a class="qs-link" href="index.html">返回首页</a></div>
    </div>
  </div>

  <!-- Layer 2: 工具栏（题型/题量/难度 + 操作按钮） -->
  <section class="panel controls" id="controlsPanel" style="display:none;">
    <div class="adaptive-hint" id="adaptiveHint" style="display:none;"></div>
    <div class="controls-grid">
      <div class="controls-settings">
        <div class="row" style="margin-top:0;">
          <div class="group" id="typeGroup" role="radiogroup" aria-label="题型" style="display:none;">
            <span class="lbl">题型：</span>
          </div>
          <div class="group" id="countGroup" role="radiogroup" aria-label="题量">
            <span class="lbl">题量：</span>
            <button class="chip active" data-count="10" role="radio" aria-checked="true">10题</button>
            <button class="chip" data-count="20" role="radio" aria-checked="false">20题</button>
            <button class="chip" data-count="50" role="radio" aria-checked="false">50题</button>
            <button class="chip" data-count="custom" role="radio" aria-checked="false">自定义</button>
            <input type="number" id="customCount" min="1" max="50" step="1" placeholder="自定义"
                   autocomplete="off"
                   style="width:70px;height:30px;border:1.5px solid #c9d4e6;border-radius:8px;font-size:13px;font-weight:700;text-align:center;color:var(--brand-d);background:#fafbff;outline:none;display:none;">
            <span class="count-tip" id="countTip" style="font-size:11px;color:#9aa5b5;font-weight:500;display:none;"></span>
          </div>
          <div class="group" id="difficultyGroup">
            <span class="lbl">难度：</span>
            <input type="number" id="difficultyInput" min="1" max="10" step="1" value="3"
                   title="填写 1-10 的整数，数字越大难度越高（数值更大、逻辑更深）"
                   style="width:64px;height:32px;border:2px solid #d5dff0;border-radius:8px;font-size:15px;font-weight:700;text-align:center;color:var(--brand-d);background:#fafbff;outline:none;">
            <span class="lbl" style="color:var(--muted);font-weight:500;">1~10</span>
          </div>
        </div>
      </div>
      <div class="controls-actions">
        <button class="btn btn-primary" id="genBtn">生成练习题</button>
        <button class="btn btn-primary" id="checkBtn" disabled>检查答案</button>
        <button class="btn btn-ghost" id="revealBtn" disabled>显示答案</button>
        <button class="btn btn-ghost" id="printBtn" disabled>打印页面</button>
        <button class="btn btn-ghost btn-sm" id="refreshResetBtn" title="清除本题型的难度记忆并刷新页面">刷新重置</button>
      </div>
    </div>
  </section>

  <!-- Layer 3: 正式内容区（第一行主题标题 + 第二行起题目卡） -->
  <div class="exercise-content">
    <p class="static-resource-note">本页面为练习生成工具，加载具体题型后可在线练习或打印。静态版本与知识点讲解请访问 <a href="knowledge/index.html">知识库页面</a>。</p>
    <div class="exercise-header">
      <h1 id="sheetTitle">统一练习页</h1>
      <div class="timer" id="timerDisplay">⏱ 00:00</div>
    </div>
    <section id="problemsArea">
      <div class="empty">正在加载练习插件…</div>
    </section>
  </div>

  <section class="result-panel" id="resultArea"></section>

  <footer>Homework Help · 插件化练习框架 · practice.html</footer>
</div>

<link rel="preload" href="shared/common.js" as="script">
<link rel="preload" href="shared/tokens.css" as="style">
<link rel="preload" href="shared/components.css" as="style">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "LearningResource",
  "name": "小学练习题",
  "description": "自动生成的小学练习题，支持在线作答、批改与打印。",
  "educationalLevel": "小学",
  "learningResourceType": "Practice",
  "audience": {
    "@type": "EducationalAudience",
    "educationalRole": "student"
  },
  "url": "https://mstermoon007.github.io/Homework-help/practice.html"
}
</script>
<script src="shared/common.js"></script>
<script src="shared/print.js"></script>
<script src="shared/knowledge-bank.js"></script>
<script src="plugins/registry.js"></script>
<script>
(function () {
  'use strict';

  // ============ 全局状态 ============
  var state = {
    plugin: null,        // 当前插件对象
    grade: 1,            // 当前年级
    exerciseSet: null,   // 当前题目集
    checkResult: null,   // 当前批改结果
    count: 10,           // 题量
    type: null,          // 题型子类别（可选）
    difficulty: 3,       // 难度（1-10，用户填写，默认 3）
    settings: {},        // chip 型设置的当前值（key → 选中值，如 level:「basic」）
    settingNums: {},     // 数字输入型设置的当前值（如口算 maxNum「最大数」）
    hasLevelSetting: false, // 插件是否自带难度分档 chip（如应用题初级/中级/高级/综合）
    timerId: null,       // setInterval 句柄
    startTime: 0,        // 开始时间戳
    answered: false      // 是否已提交
  };

  var registry = (typeof window.PLUGIN_REGISTRY !== 'undefined') ? window.PLUGIN_REGISTRY : [];

  // ============ URL 参数解析 ============
  function parseUrlParams() {
    var p = new URLSearchParams(window.location.search);
    var grade = Number(p.get('grade'));
    if (!(grade >= 1 && grade <= 6)) grade = 1;
    var count = Number(p.get('count'));
    if (!(count >= 1 && count <= 50)) count = 10;
    var difficulty = Number(p.get('difficulty'));
    if (!(difficulty >= 1 && difficulty <= 10)) difficulty = 3;
    return {
      plugin: (p.get('plugin') || '').trim(),
      grade: grade,
      count: count,
      type: (p.get('type') || '').trim() || null,
      difficulty: difficulty
    };
  }

  var urlParams = parseUrlParams();

  // ============ 通用 DOM 工具 ============
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }

  // HTML 转义：防止 URL 参数等不可信文本注入到 innerHTML 执行脚本（修复 P0 XSS）
  function esc(s) {
    var d = document.createElement('div');
    d.textContent = (s == null) ? '' : String(s);
    return d.innerHTML;
  }

  // 数字补零（兼容旧浏览器：padStart 在 Safari<10 / Android WebView<50 不支持，见审查 7.2）
  function pad2(n) { return (n < 10 ? '0' : '') + String(n); }

  function showNotice(title, sub, retry) {
    $('controlsPanel').style.display = 'none';
    $('timerDisplay').textContent = '⏱ 00:00';
    var area = $('problemsArea');
    var div = el('div', 'notice');
    div.innerHTML = '<div class="big">' + esc(title) + '</div>' + (sub ? '<div>' + esc(sub) + '</div>' : '');
    if (retry) {
      var btn = el('button', 'btn btn-primary', '重新加载');
      btn.style.marginTop = '14px';
      btn.onclick = function () { location.reload(); };
      div.appendChild(btn);
    }
    area.innerHTML = '';
    area.appendChild(div);
    $('resultArea').classList.remove('show');
  }

  // ============ 动态插件加载（统一走 App.PluginLoader） ============
  // 脚本去重、5 秒超时、deps 依赖、插件对象缓存、竞态安全，全部由
  // shared/common.js 的 App.PluginLoader 提供；此处仅保留 registry 查询与综合插件预加载逻辑。

  function findRegistryRecord(id) {
    for (var i = 0; i < registry.length; i++) {
      if (registry[i].id === id) return registry[i];
    }
    return null;
  }

  // ============ 综合插件特殊处理：预加载数学子插件 ============
  // 当请求 math-comprehensive 时，先加载当前年级所有数学插件脚本，
  // 将适用的插件对象暂存到 window.__mathSubPlugins，再加载综合插件本身，
  // 确保综合插件能直接调用各子插件生成题目（详见 plugins/math-comprehensive.js 的 ensureSubPlugins）。
  function preloadMathSubPlugins(grade) {
    var records = registry.filter(function (rec) {
      return rec.id.indexOf('math-') === 0 && rec.id !== 'math-comprehensive';
    });
    // 并行加载所有数学子插件（修复 P1 串行加载）：脚本去重/竞态安全由 App.PluginLoader 的
    // scriptCache（按 URL 复用 Promise）+ async=false 保证；__currentPlugin 竞态无碍，
    // 因为综合插件 ensureSubPlugins 会显式恢复为自身对象。
    return Promise.all(records.map(function (rec) {
      return App.PluginLoader.loadPlugin(rec).then(function (p) {
        return (p && p.grades && p.grades.indexOf(grade) !== -1) ? p : null;
      }).catch(function () { return null; });
    })).then(function (loaded) {
      var plugins = loaded.filter(function (p) { return p; });
      window.__mathSubPlugins = plugins;
      return plugins;
    });
  }

  // ============ 设置面板 ============
  function initSettings(plugin, grade) {
    // 主标题统一为「年级 + 题型（+ 题量）」格式；题量在生成后由 render 补入
    $('sheetTitle').textContent = buildTitle(grade, plugin.name, null);
    $('controlsPanel').style.display = '';

    // 题量（保留 URL 默认；10/20/自定义）
    syncCountUI();

    // 难度档位（保留 URL 默认；仅数学插件显示；含数字型难度设置（如口算最大数）的插件由下方统一接管显示）
    var diffInput = $('difficultyInput');
    if (diffInput) diffInput.value = state.difficulty;

    // 题型/难度等设置（若有 settings 元数据）
    var tg = $('typeGroup');
    tg.innerHTML = '';
    tg.style.display = 'none';
    // 清除上次渲染附加的独立设置组（如应用题「难度」行）
    var wrap = tg.parentNode;
    wrap.querySelectorAll('.type-sub-group').forEach(function (g) { g.parentNode.removeChild(g); });
    var hasNumSetting = false;
    if (Array.isArray(plugin.settings) && plugin.settings.length) {
      tg.style.display = '';
      var chipShown = false;
      plugin.settings.forEach(function (s, si) {
        // 数字输入型设置（如口算「难度＝最大数」）：渲染填写框，不用 chip
        if (s.type === 'number') {
          hasNumSetting = true;
          renderNumberSetting(tg, s, si);
          return;
        }
        if (!s.key || !Array.isArray(s.options) || !s.options.length) return;
        // 首个 chip 设置沿用 #typeGroup/#typeChips；后续设置（如难度分档）独立成组
        var container;
        if (!chipShown) {
          container = tg;
        } else {
          var grp = el('div', 'group type-sub-group');
          grp.setAttribute('role', 'radiogroup');
          grp.setAttribute('aria-label', (s.label || '题型'));
          wrap.insertBefore(grp, $('countGroup'));
          container = grp;
        }
        var lbl = el('span', 'lbl', (s.label || '题型') + '：');
        container.appendChild(lbl);
        var chipsBox = el('div', 'type-chips');
        container.appendChild(chipsBox);
        chipShown = true;

        var selected = (s.key === 'type')
          ? (state.type || s.default || s.options[0].value)
          : (state.settings[s.key] || s.default || s.options[0].value);
        if (s.key === 'type') state.type = selected;
        else state.settings[s.key] = selected;
        s.options.forEach(function (o) {
          var c = el('button', 'chip' + (o.value === selected ? ' active' : ''), o.label);
          c.dataset.skey = s.key;
          c.dataset.svalue = o.value;
          c.setAttribute('role', 'radio');
          c.setAttribute('aria-checked', o.value === selected ? 'true' : 'false');
          c.onclick = function () {
            chipsBox.querySelectorAll('.chip').forEach(function (x) {
              x.classList.remove('active');
              x.setAttribute('aria-checked', 'false');
            });
            c.classList.add('active');
            c.setAttribute('aria-checked', 'true');
            if (s.key === 'type') state.type = o.value;
            else state.settings[s.key] = o.value;
            if (state.exerciseSet) generate();
          };
          chipsBox.appendChild(c);
        });
      });
      refreshTypeChips();
    }

    // 难度＝最大数（数字型设置）接管后隐藏通用 1-10 难度档，避免双难度入口
    // 同样，若插件用 chip 设置了难度分档（key 为 level/difficulty），也隐藏通用 1-10 难度档
    var hasLevelSetting = false;
    if (Array.isArray(plugin.settings)) {
      plugin.settings.forEach(function (s) {
        if ((s.key === 'level' || s.key === 'difficulty') && Array.isArray(s.options) && s.options.length) {
          hasLevelSetting = true;
        }
      });
    }
    state.hasLevelSetting = hasLevelSetting;
    var diffGroup = $('difficultyGroup');
    if ((hasNumSetting || hasLevelSetting) && diffGroup) diffGroup.style.display = 'none';
    else if (diffGroup) diffGroup.style.display = (plugin.subject === 'math') ? '' : 'none';

    // 按钮状态
    $('checkBtn').disabled = true;
    $('revealBtn').disabled = true;
    $('printBtn').disabled = true;

    // 跟读类插件（声明 noCheck: true，如 english-alphabet）：无书面答案可批改，隐藏「检查答案」
    $('checkBtn').style.display = plugin.noCheck ? 'none' : '';

    // 页面控制器已禁用（不再显示顶部题型导航栏）
  }

  // 题型/难度按钮换行对齐：换行后的按钮从第一行第一个按钮左对齐；补齐换行行首/行尾圆角与边框
  // 支持多个独立 chips 容器（#typeChips + 各 .type-sub-group 的 .type-chips）
  function refreshTypeChips() {
    var boxes = document.querySelectorAll('.type-chips');
    for (var b = 0; b < boxes.length; b++) {
      var box = boxes[b];
      var chips = box.querySelectorAll('.chip');
      if (!chips.length) continue;
      var prevLeft = null;
      for (var i = 0; i < chips.length; i++) {
        var c = chips[i];
        var left = c.offsetLeft;
        c.classList.toggle('line-start', prevLeft === null || left <= prevLeft);
        prevLeft = left;
      }
      for (var j = 0; j < chips.length; j++) {
        var ch = chips[j];
        var nxt = chips[j + 1];
        ch.classList.toggle('line-end', !nxt || nxt.offsetLeft <= ch.offsetLeft);
      }
    }
  }

  // 数字输入型设置控件（如口算「难度：最大数」，用户自行填写）
  function renderNumberSetting(container, s, si) {
    var box = el('div', 'set-num');
    box.style.cssText = 'display:flex;align-items:center;gap:8px;margin:6px 0 2px 4px;';
    var nl = el('span', 'lbl', (s.label || s.key) + '：');
    var inp = document.createElement('input');
    inp.type = 'number';
    inp.min = s.min != null ? s.min : 1;
    inp.max = s.max != null ? s.max : 100;
    inp.step = s.step || 1;
    if (!(s.key in state.settingNums)) state.settingNums[s.key] = s.default != null ? s.default : '';
    inp.value = state.settingNums[s.key];
    inp.style.cssText = 'width:92px;height:34px;border:1.5px solid #d5dff0;border-radius:9px;font-size:15px;font-weight:700;text-align:center;color:#27324a;outline:none;background:#fff;';
    inp.onchange = function () {
      var v = inp.value === '' ? '' : Number(inp.value);
      if (v === '' && s.default != null) v = s.default;
      state.settingNums[s.key] = v;
      if (state.exerciseSet) generate();
    };
    box.appendChild(nl);
    box.appendChild(inp);
    if (s.hint) {
      var hh = el('span', 'lbl', s.hint);
      hh.style.cssText = 'color:var(--muted);font-size:11px;';
      box.appendChild(hh);
    }
    container.appendChild(box);
  }

  // ============ 计时器 ============
  function fmtTime(t) {
    return pad2(Math.floor(t / 60)) + ':' + pad2(t % 60);
  }
  function startTimer() {
    stopTimer();
    state.startTime = Date.now();
    state.timerId = setInterval(function () {
      $('timerDisplay').textContent = '⏱ ' + fmtTime(Math.floor((Date.now() - state.startTime) / 1000));
    }, 500);
  }
  function stopTimer() {
    if (state.timerId) { clearInterval(state.timerId); state.timerId = null; }
  }
  function getElapsed() {
    return Math.floor((Date.now() - state.startTime) / 1000);
  }
  function elapsedText(sec) {
    var m = Math.floor(sec / 60);
    return m > 0 ? (m + '分' + (sec % 60) + '秒') : (sec + '秒');
  }

  // ============ 生成 + 渲染 ============
  function generate() {
    if (!state.plugin) return;
    try {
      // 自适应难度：基于该 (subject,grade,plugin) 的历史正确率调整难度/题型
      var adjSubj = state.plugin.subject, adjPid = state.plugin.id;
      var adj = (App.Adaptive && App.Adaptive.computeAdjustment)
        ? App.Adaptive.computeAdjustment(adjSubj, state.grade, adjPid)
        : { difficultyDelta: 0, typeBias: null };

      var options = { grade: state.grade, count: state.count };
      if (state.type) options.type = state.type;
      // chip 型设置（如难度分档 level）除 type 外原样传给插件 generate
      Object.keys(state.settings || {}).forEach(function (k) {
        if (k === 'type') return;
        var v = state.settings[k];
        if (v !== '' && v != null) options[k] = v;
      });
      // 数字输入型设置（如口算「难度＝最大数」）原样传给插件 generate
      Object.keys(state.settingNums || {}).forEach(function (k) {
        var v = state.settingNums[k];
        if (v !== '' && v != null) options[k] = v;
      });
      // 自适应难度仅对数学有效（难度数值/题型分布为数学概念，非数学科目隐藏难度控件）
      if (adjSubj === 'math' && !state.hasLevelSetting) {
        // 难度：在用户所选基础难度上叠加自适应调整量（连续表现好↑ / 弱↓）
        options.difficulty = App.Adaptive.adjustedDifficulty(state.difficulty || 3, adj.difficultyDelta);
        // 题型微调：仅当用户未显式选择题型时，按表现偏向更难/更基础子类型
        if (!state.type && adj.typeBias && Array.isArray(state.plugin.settings)) {
          var typeSetting = null;
          state.plugin.settings.forEach(function (s) { if (s.key === 'type') typeSetting = s; });
          if (typeSetting && Array.isArray(typeSetting.options) && typeSetting.options.length) {
            var opt = adj.typeBias === 'hard'
              ? typeSetting.options[typeSetting.options.length - 1]
              : typeSetting.options[0];
            if (opt && opt.value != null) options.type = opt.value;
          }
        }
        // 提示条：告诉用户难度被自动调整了
        var hintEl = $('adaptiveHint');
        if (hintEl) {
          var h = (App.Adaptive && App.Adaptive.hint) ? App.Adaptive.hint(adjSubj, state.grade, adjPid) : '';
          hintEl.textContent = h;
          hintEl.style.display = h ? '' : 'none';
        }
      } else {
        // 插件自带难度分档（如应用题初级/中级/高级/综合）：难度由分档 chip 决定，不叠加自适应
        if (!state.hasLevelSetting && state.difficulty) options.difficulty = state.difficulty;
        var hintEl2 = $('adaptiveHint');
        if (hintEl2) hintEl2.style.display = 'none';
      }
      var result = state.plugin.generate(options);
      if (result && typeof result.then === 'function') {
        // 异步插件（如 math-comprehensive：需先加载子插件）
        $('genBtn').disabled = true;
        $('genBtn').textContent = '正在生成…';
        result.then(function (set) {
          $('genBtn').disabled = false;
          $('genBtn').textContent = '生成练习题';
          applyExerciseSet(set);
        }).catch(function (err) {
          $('genBtn').disabled = false;
          $('genBtn').textContent = '生成练习题';
          stopTimer();
          $('checkBtn').disabled = true;
          $('revealBtn').disabled = true;
          $('printBtn').disabled = true;
          showNotice('生成失败，请重试', err && err.message);
        });
        return;
      }
      applyExerciseSet(result);
    } catch (err) {
      stopTimer();
      $('checkBtn').disabled = true;
      $('revealBtn').disabled = true;
      $('printBtn').disabled = true;
      showNotice('生成失败，请重试', err.message);
    }
  }

  function applyExerciseSet(set) {
    if (!set || !Array.isArray(set.questions)) throw new Error('generate 必须返回 { questions: [] }');
    state.exerciseSet = set;
    state.checkResult = null;
    state.answered = false;
    render(set);
    $('checkBtn').disabled = false;
    $('revealBtn').disabled = false;
    $('printBtn').disabled = false;
  }

  // 统一 Sheet 标题：剥离插件 meta.title 中可能自带的年级前缀，
  // 再按「年级 + 题型 + (题量)」统一组装，确保所有生成页面标题格式一致。
  function cleanTypeTitle(raw) {
    if (!raw) return '练习题';
    // 去掉开头的「小学X年级」/「X年级」等年级前缀（部分插件已在 title 内嵌年级）
    return String(raw).replace(/^小学?[一二三四五六1-6]+年级\s*/, '');
  }

  // 统一标题组装：年级 + 题型（+ 题量）。题型名统一剥离自带的年级前缀（cleanTypeTitle），
  // 年级来自 URL 参数，题量可选——屏显主标题与打印标题共用同一格式，保证「四年级 竖式计算（50题）」一致。
  function buildTitle(grade, rawName, count) {
    var g = App.getGradeName(grade);
    var t = cleanTypeTitle(rawName);
    return (count == null) ? (g + ' ' + t) : (g + ' ' + t + '（' + count + '题）');
  }

  // 插件加载后动态细化 LearningResource 的 name/description（不影响爬虫获取默认内容）
  function updateResourceLD(name, grade) {
    try {
      var g = App.getGradeName(grade);
      var nodes = document.querySelectorAll('script[type="application/ld+json"]');
      for (var i = 0; i < nodes.length; i++) {
        var obj = JSON.parse(nodes[i].textContent);
        if (obj['@type'] === 'LearningResource') {
          obj.name = g + ' ' + name + '练习题';
          obj.description = '自动生成的' + g + name + '练习题，支持在线作答、批改与打印。';
          nodes[i].textContent = JSON.stringify(obj);
          break;
        }
      }
    } catch (e) { /* 忽略，保留默认 schema */ }
  }

  function render(set) {
    var area = $('problemsArea');
    var html = '';
    var meta = set.meta || {};
    // 统一主标题：年级 + 题型（题量），由 buildTitle 组装；屏显 exercise-header 与打印标题共用同一格式。
    // 题目区不再重复渲染内层标题（避免与 exercise-header 重复），打印页由 shared/print.js 注入同样标题。
    $('sheetTitle').textContent = buildTitle(state.grade, meta.title || (state.plugin && state.plugin.name), set.questions.length);
    updateResourceLD((state.plugin && state.plugin.name) || '小学', state.grade);
    // 题目区域由插件完全控制；仅当插件未提供 render 时使用壳的通用降级渲染
    var body = (typeof state.plugin.render === 'function' ? state.plugin.render(set) : renderGeneric(set));
    // 插件未自带网格容器时统一套一层响应式网格，保证所有题目页都能按显示宽度 2/3 题一行排版
    if (!/class="[^"]*(questions-grid|q-grid)/.test(body)) {
      body = '<div class="questions-grid">' + body + '</div>';
    }
    html += body;
    area.innerHTML = html;

    // 卡片式/文字式网格按题目长度自适应列数（适配 A4 竖版宽度）
    PluginUtil.layout.fitColumns(area, set);
    // 按当前排版估算「填多少题可正好铺满 A4 整页」的推荐值
    updateCountTip();

    // 回车快捷批改
    area.querySelectorAll('input[data-index], input[data-idx]').forEach(function (inp) {
      inp.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); if (!state.answered) check(); }
      });
    });
    $('resultArea').classList.remove('show');
    $('resultArea').innerHTML = '';
    startTimer();
    // 焦点管理（修复 P2 4.2）：生成后将焦点移到首个输入框，键盘用户无需多次 Tab
    var firstInput = area.querySelector('input[data-index], input[data-idx]');
    if (firstInput) firstInput.focus();
  }

  // ============ A4 竖版宽度自适应 ============
  // 列数算法已收敛为单一来源：shared/common.js 的 PluginUtil.layout
  // （calcOptimalCols / fitColumns / estimateCardWidth / renderLen / gridColumnsFromDom / applySpanning）。
  // 预览与打印共用同一套逻辑，避免双份代码再次漂移。本页仅保留需要 Print.ROUTES 的 A4 宽度换算。

  // A4 竖版可打印宽度（px），与 shared/print.js 的 @page 边距保持一致
  // 不同题型路由边距不同（如 makeTen 8mm、其余 12mm/10mm），按路由取对应可打印宽
  function a4PrintableWidthPx(pageType) {
    var route = (window.Print && window.Print.ROUTES && window.Print.ROUTES[pageType]) || {};
    var mm = (route.pageMargin || '12mm 10mm').match(/([\d.]+)mm\s+([\d.]+)mm/);
    var h = mm ? parseFloat(mm[2]) : 10; // 左右边距（mm）
    var MM = 96 / 25.4;
    return Math.round((210 - 2 * h) * MM);
  }

  // 插件无 render 时的通用降级渲染
  function renderGeneric(set) {
    var cols = PluginUtil.layout.calcOptimalCols(set, (document.getElementById('problemsArea') || {}).offsetWidth || 1000);
    var html = '<div class="q-grid cols-' + cols + '">';
    set.questions.forEach(function (q, i) {
      html += '<div class="question-card" data-index="' + i + '">' +
        '<span class="num">' + (i + 1) + '</span>' +
        '<span class="q-text">' + esc(q.question || q.text || q.q || '') + '</span>' +
        (q.hint ? '<div style="font-size:11px;color:var(--muted)">💡 ' + esc(q.hint) + '</div>' : '') +
        '<input type="text" class="answer-inp" data-index="' + i + '" autocomplete="off">' +
        '<div class="feedback"></div>' +
        '</div>';
    });
    html += '</div>';
    return html;
  }

  // ============ 收集答案 ============
  function collectAnswers() {
    var answers = {};
    document.querySelectorAll('#problemsArea input[data-index], #problemsArea input[data-idx]').forEach(function (inp) {
      if (inp.hasAttribute('data-index')) {
        answers[inp.getAttribute('data-index')] = inp.value.trim();
      } else if (inp.hasAttribute('data-idx') && inp.hasAttribute('data-field')) {
        answers[inp.getAttribute('data-idx') + ':' + inp.getAttribute('data-field')] = inp.value.trim();
      }
    });
    return answers;
  }

  // ============ 批改 ============
  function check() {
    if (!state.plugin || !state.exerciseSet) return;
    if (state.plugin.noCheck) return; // 跟读类插件无批改（按钮已隐藏，此处兜底拦回车等入口）
    stopTimer();
    var result;
    try {
      result = state.plugin.check(state.exerciseSet, collectAnswers());
    } catch (err) {
      showNotice('批改出错', err.message);
      return;
    }
    if (!result || typeof result.score !== 'number' || !Array.isArray(result.results)) {
      showNotice('批改结果不兼容', 'check 必须返回 { score, total, correct, results, correctAnswers }');
      return;
    }
    state.checkResult = result;
    state.answered = true;
    // 记录本次练习结果，供自适应难度后续调整使用：
    //  - recordSession：题目级采集（q.knowledgePointId / q.difficulty 可选字段），
    //    自动产出 插件级加权摘要 + 知识点级分组记录（KP 仅对竞赛/综合插件生效）
    //  - 兜底：旧式聚合记录（无题目数组/无 results 时）
    if (App.Adaptive && typeof result.total === 'number') {
      var exQs = (state.exerciseSet && Array.isArray(state.exerciseSet.questions)) ? state.exerciseSet.questions : null;
      if (App.Adaptive.recordSession && exQs && Array.isArray(result.results)) {
        App.Adaptive.recordSession(state.plugin.subject, state.grade, state.plugin.id, exQs, result.results);
      } else if (App.Adaptive.record) {
        App.Adaptive.record(state.plugin.subject, state.grade, state.plugin.id, result.correct, result.total);
      }
    }
    markQuestions(result);
    showResult(result);
  }

  function markQuestions(result) {
    var area = $('problemsArea');
    result.results.forEach(function (isRight, i) {
      var card = area.querySelector('.question-card[data-index="' + i + '"], .problem[data-i="' + i + '"]');
      if (!card) return;
      card.classList.remove('correct', 'wrong');
      card.classList.add(isRight ? 'correct' : 'wrong');
      var inp = card.querySelector('input[data-index="' + i + '"]');
      if (inp) {
        inp.classList.remove('correct', 'wrong');
        inp.classList.add(isRight ? 'correct' : 'wrong');
      }
      if (!isRight) {
        var fb = card.querySelector('.feedback');
        var tip = '✗ 正确答案：' + (result.correctAnswers && result.correctAnswers[i]);
        if (fb) { fb.textContent = tip; fb.style.color = 'var(--bad)'; }
      }
    });
  }

  function showResult(result) {
    var total = result.total || (state.exerciseSet && state.exerciseSet.questions.length) || 0;
    var wrong = total - result.correct;
    var tips = result.message || '';
    if (total) tips += ' · 用时 ' + elapsedText(getElapsed());
    var html = '<div class="result">' +
      '<div class="score">' + result.score + ' 分</div>' +
      '<div class="detail">答对 ' + result.correct + ' / ' + total + ' 题 · 正确率 ' + (total ? Math.round(result.correct / total * 100) : 0) + '%</div>' +
      '<div class="tips">' + tips + '</div>' +
      '<div class="redo-wrap">' +
      (wrong > 0 ? '<button class="btn btn-ghost" id="redoBtn">错题重做（' + wrong + '）</button>' : '') +
      '<button class="btn btn-ghost" id="redoAllBtn" style="margin-left:8px;">重新生成</button>' +
      '</div></div>';
    var ra = $('resultArea');
    ra.innerHTML = html;
    ra.classList.add('show');
    ra.scrollIntoView({ behavior: 'smooth', block: 'start' });
    var redoBtn = $('redoBtn');
    if (redoBtn) redoBtn.onclick = redoWrong;
    $('redoAllBtn').onclick = generate;
  }

  // ============ 错题重做 ============
  function redoWrong() {
    if (!state.exerciseSet || !state.checkResult) return;
    var wrongIdx = [];
    state.checkResult.results.forEach(function (ok, i) { if (!ok) wrongIdx.push(i); });
    if (!wrongIdx.length) return;
    var wrongQuestions = state.exerciseSet.questions.filter(function (_, i) { return wrongIdx.indexOf(i) !== -1; });
    var set = {
      questions: wrongQuestions,
      meta: (state.exerciseSet.meta || {})
    };
    state.exerciseSet = set;
    state.checkResult = null;
    state.answered = false;
    state.count = wrongQuestions.length;
    render(set);
    $('checkBtn').disabled = false;
    $('revealBtn').disabled = false;
    $('printBtn').disabled = false;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ============ 显示/隐藏答案 ============
  function toggleReveal() {
    if (!state.plugin || !state.exerciseSet) return;
    var ra = $('resultArea');
    if (ra.dataset.revealed === '1') {
      ra.dataset.revealed = '0';
      $('revealBtn').textContent = '显示答案';
      $('problemsArea').querySelectorAll('.revealed-answer').forEach(function (n) { n.remove(); });
      return;
    }
    ra.dataset.revealed = '1';
    $('revealBtn').textContent = '隐藏答案';
    var result = state.plugin.check(state.exerciseSet, collectAnswers());
    var cards = $('problemsArea').querySelectorAll('.question-card, .problem');
    result.results.forEach(function (ok, i) {
      var card = cards[i];
      if (!card) return;
      var old = card.querySelector('.revealed-answer');
      if (old) old.remove();
      var ans = result.correctAnswers && result.correctAnswers[i];
      var d = el('div', 'revealed-answer');
      d.style.cssText = 'font-size:12px;color:var(--brand-d);font-weight:700;margin-top:6px';
      d.textContent = '✔ 答案：' + (ans != null ? ans : '—');
      card.appendChild(d);
    });
  }

  // ============ 打印 ============
  function printFile() {
    if (!state.plugin || !state.exerciseSet || !state.exerciseSet.questions.length) {
      alert('请先生成练习题！');
      return;
    }
    var cfg = state.plugin.printConfig || {};
    var pageType = cfg.pageType || 'math';
    var title = buildTitle(state.grade, (state.exerciseSet.meta && state.exerciseSet.meta.title) || state.plugin.name || '练习题', state.exerciseSet.questions.length);
    // 列数按题目内容在 A4 可打印宽度内动态计算（非屏幕列数），确保打印页填满 A4 不挤不空
    var a4w = a4PrintableWidthPx(pageType);
    var fixedCols = state.exerciseSet.meta && state.exerciseSet.meta.columns;
    var opts = { pageType: pageType, columns: fixedCols ? fixedCols : PluginUtil.layout.calcOptimalCols(state.exerciseSet, a4w) };
    var area = $('problemsArea');
    // 移除离线测量容器，避免被克隆进打印页
    var measEl = $('printMeasure');
    if (measEl && measEl.parentNode) measEl.parentNode.removeChild(measEl);
    try {
      Print.open(area, title, opts);
    } catch (err) {
      alert('打印失败：' + err.message);
    }
  }

  // ============ 题量（10 / 20 / 自定义） ============
  function setCount(n) {
    n = Math.round(Number(n));
    if (!(n >= 1 && n <= 50)) { showNotice('题量无效', '自定义题量请填写 1~50 之间的整数。'); return; }
    state.count = n;
    syncCountUI();
    if (state.exerciseSet) generate();
  }

  function syncCountUI() {
    var chips = document.querySelectorAll('#countGroup .chip');
    chips.forEach(function (c) { c.classList.remove('active'); c.setAttribute('aria-checked', 'false'); });
    var customInp = $('customCount');
    if (state.count === 10 || state.count === 20 || state.count === 50) {
      document.querySelectorAll('#countGroup .chip[data-count="' + state.count + '"]').forEach(function (c) {
        c.classList.add('active'); c.setAttribute('aria-checked', 'true');
      });
      if (customInp) customInp.style.display = 'none';
    } else {
      document.querySelectorAll('#countGroup .chip[data-count="custom"]').forEach(function (c) {
        c.classList.add('active'); c.setAttribute('aria-checked', 'true');
      });
      if (customInp) {
        customInp.style.display = '';
        customInp.value = state.count;
      }
    }
    updateCountTip();
  }

  // 根据当前排版实测「填多少题可正好铺满 A4 整页」的推荐值
  function updateCountTip() {
    var tip = $('countTip');
    if (!tip) return;
    var customChip = document.querySelector('#countGroup .chip[data-count="custom"]');
    var isCustom = customChip && customChip.classList.contains('active');
    if (!isCustom || !state.exerciseSet || !state.exerciseSet.questions.length) {
      tip.style.display = 'none';
      return;
    }
    var area = $('problemsArea');
    var src = area.querySelector('.questions-grid, .q-grid');
    if (!src || !src.children.length) { tip.style.display = 'none'; return; }
    // 打印/A4 端：按 A4 可打印宽度动态计算列数（与打印页完全一致，避免屏幕列数硬塞 A4）
    var cfg = (state.plugin && state.plugin.printConfig && state.plugin.printConfig.pageType) || 'math';
    var printableW = a4PrintableWidthPx(cfg);
    var fixedCols = state.exerciseSet.meta && state.exerciseSet.meta.columns;
    var cols = fixedCols ? fixedCols : PluginUtil.layout.calcOptimalCols(state.exerciseSet, printableW);
    // 上下边距用于后续高度测算（与 shared/print.js 的 @page 边距一致）
    var route = (window.Print && window.Print.ROUTES && window.Print.ROUTES[cfg]) || {};
    var m = (route.pageMargin || '12mm 10mm').match(/([\d.]+)mm\s+([\d.]+)mm/);
    var v = m ? parseFloat(m[1]) : 12;   // 上下边距
    var MM = 96 / 25.4;
    var printableH = (297 - 2 * v) * MM;          // 一页内容高（px）

    // 隐藏测量容器：与打印同宽、同列数、同间距，克隆当前卡片循环排布（保留打印端列跨），实测铺满高度
    var meas = $('printMeasure');
    if (!meas) { meas = el('div'); meas.id = 'printMeasure'; area.appendChild(meas); }
    meas.style.cssText = 'position:fixed;left:-20000px;top:0;width:' + printableW + 'px;visibility:hidden;';
    var g = el('div');
    g.style.cssText = 'display:grid;grid-template-columns:repeat(' + cols + ',minmax(0,1fr));gap:14px;grid-auto-flow:row dense;';
    meas.innerHTML = '';
    meas.appendChild(g);
    var pats = [];
    for (var ci = 0; ci < src.children.length; ci++) pats.push(src.children[ci].cloneNode(true));
    var fitted = 0;
    for (var n = 1; n <= 80; n++) {
      g.appendChild(pats[(n - 1) % pats.length].cloneNode(true));
      var kids = g.children;
      var bottom = 0;
      var firstTop = null;
      for (var ki = 0; ki < kids.length; ki++) {
        var r = kids[ki].getBoundingClientRect();
        if (firstTop === null) firstTop = r.top;
        var b = r.top + r.height;
        if (b > bottom) bottom = b;
      }
      if (bottom - firstTop > printableH) break;
      fitted = n;
    }
    // 若 80 题仍铺不满一页，按已测单卡平均高度继续推算（超出 50 上限则取 50）
    if (fitted >= 80 && src.children.length) {
      var kids2 = g.children;
      var hsum = 0;
      for (var hi = 0; hi < kids2.length; hi++) hsum += kids2[hi].getBoundingClientRect().height;
      var avgH = hsum / kids2.length;
      var remain = printableH - (bottom - firstTop);
      fitted += Math.max(0, Math.floor(remain / (avgH + 14)) * cols);
    }
    var n = Math.min(50, Math.max(1, fitted));
    tip.textContent = 'Tips，推荐设置 ' + n + ' 可以打印 A4 整页';
    tip.style.display = '';
  }

  // ============ 左上角快速切换（学科 / 年级） ============
  function buildQuickSwitch() {
    var subjectRow = $('qsSubject');
    var gradeRow = $('qsGrade');
    if (!subjectRow || !gradeRow) return;
    subjectRow.innerHTML = '';
    gradeRow.innerHTML = '';
    var current = state.plugin && state.plugin.subject;

    var subjMap = {
      math: App.ROUTES.mathTypes,
      chinese: App.ROUTES.chineseTypes,
      english: App.ROUTES.englishTypes
    };
    Object.keys(subjMap).forEach(function (s) {
      var a = el('a', 'qs-subj' + (s === current ? ' active' : ''),
        App.SUBJECT_NAMES[s] || s);
      a.href = App.buildLink(subjMap[s], state.grade);
      subjectRow.appendChild(a);
    });

    var target = subjMap[current] || subjMap.math;
    for (var g = 1; g <= 6; g++) {
      var b = el('a', 'qs-grade' + (g === state.grade ? ' active' : ''),
        App.getGradeName(g));
      b.href = App.buildLink(target, g);
      gradeRow.appendChild(b);
    }
  }

  function bindQuickSwitch() {
    var btn = $('qsBtn');
    var menu = $('qsMenu');
    if (!btn || !menu) return;
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      menu.style.display = (menu.style.display === 'none') ? '' : 'none';
    });
    document.addEventListener('click', function (e) {
      if (!menu.contains(e.target) && e.target !== btn) menu.style.display = 'none';
    });
  }

  // ============ 按钮绑定 ============
  function bindEvents() {
    document.querySelectorAll('#countGroup .chip').forEach(function (c) {
      c.addEventListener('click', function () {
        if (c.dataset.count === 'custom') {
          var customInp = $('customCount');
          document.querySelectorAll('#countGroup .chip').forEach(function (x) { x.classList.remove('active'); x.setAttribute('aria-checked', 'false'); });
          c.classList.add('active');
          c.setAttribute('aria-checked', 'true');
          if (customInp) { customInp.style.display = ''; customInp.focus(); }
          updateCountTip();
          return;
        }
        setCount(+c.dataset.count);
      });
    });
    var customInp = $('customCount');
    if (customInp) {
      customInp.addEventListener('change', function () {
        if (customInp.value === '') { syncCountUI(); return; }
        setCount(customInp.value);
      });
      customInp.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); customInp.blur(); }
      });
    }
    $('genBtn').addEventListener('click', generate);
    $('checkBtn').addEventListener('click', check);
    $('revealBtn').addEventListener('click', toggleReveal);
    $('printBtn').addEventListener('click', printFile);
    // 窗口尺寸变化时重新计算题型按钮换行行首/行尾
    var rt;
    window.addEventListener('resize', function () {
      clearTimeout(rt);
      rt = setTimeout(refreshTypeChips, 120);
    });
    // 刷新重置：先清除本题型的难度记忆，再刷新页面（功能合并为一个按钮）
    var refreshResetBtn = $('refreshResetBtn');
    if (refreshResetBtn) refreshResetBtn.addEventListener('click', function () {
      if (App.Adaptive && App.Adaptive.reset) {
        App.Adaptive.reset(state.plugin.subject, state.grade, state.plugin.id);
      }
      location.reload();
    });

    // 难度数值输入：填写后立即应用（已生成题目则重新生成）
    var diffInput = $('difficultyInput');
    if (diffInput) {
      diffInput.addEventListener('change', function () {
        state.difficulty = App.diffLevel(diffInput.value);
        diffInput.value = state.difficulty;
        if (state.exerciseSet) generate();
      });
    }

    bindQuickSwitch();
  }

  // ============ 启动 ============
  function boot() {
    var pluginId = urlParams.plugin;
    var record = pluginId ? findRegistryRecord(pluginId) : null;
    if (!pluginId || !record) {
      showNotice('题型不存在', 'URL 中的 plugin 参数「' + (pluginId || '(空)') + '」未在 plugins/registry.js 注册，请返回首页选择。', true);
      return;
    }
    state.grade = urlParams.grade;
    state.count = urlParams.count;
    state.type = urlParams.type;
    state.difficulty = urlParams.difficulty;
    buildQuickSwitch(); // 提前构建，加载失败时菜单也可用

    // 综合插件：先预加载数学子插件，再加载综合插件本身
    var loadPromise = (record.id === 'math-comprehensive')
      ? preloadMathSubPlugins(state.grade).then(function () { return App.PluginLoader.loadPlugin(record); })
      : App.PluginLoader.loadPlugin(record);

    loadPromise
      .then(function (plugin) {
        state.plugin = plugin;
        if (plugin.grades && plugin.grades.indexOf(state.grade) === -1) {
          // 年级不适用：仍加载，但给出提示并自动使用最近可用年级
          var nearest = plugin.grades.slice().sort(function (a, b) {
            return Math.abs(a - state.grade) - Math.abs(b - state.grade);
          })[0];
          showNotice('该插件不适用于 ' + App.getGradeName(state.grade),
            '建议使用 ' + App.getGradeName(nearest) + '。已自动切换到 ' + App.getGradeName(nearest) + '。');
          state.grade = nearest;
        }
        initSettings(plugin, state.grade);
        buildQuickSwitch();
        $('problemsArea').innerHTML = '<div class="empty">点击「生成练习题」开始吧～</div>';
        generate();
      })
      .catch(function (err) {
        showNotice('加载失败', err.message, true);
      });
  }

  bindEvents();
  boot();
})();
</script>
</body>
</html>
