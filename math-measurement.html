  .problem .opt{cursor:pointer;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 16px;font-size:14px;font-weight:600;transition:.15s}

<script>
function rnd(min,max){ return App.randInt(min,max); }
function pick(arr){ return App.rand(arr); }
function shuffleArr(arr){ return App.shuffle(arr); }

// ========== 题目生成器 ==========
var state = { count:5, type:'all', problems:[], revealed:false };

// ── 时钟 SVG ──
function clockSVG(h, m){
  var hAngle = ((h % 12) * 30 + m * 0.5) * Math.PI / 180;
  var mAngle = (m * 6) * Math.PI / 180;
  var hx = 50 + 28 * Math.sin(hAngle);
  var hy = 50 - 28 * Math.cos(hAngle);
  var mx = 50 + 40 * Math.sin(mAngle);
  var my = 50 - 40 * Math.cos(mAngle);
  var ticks = '';
  for(var i=0;i<12;i++){
    var a = (i*30) * Math.PI/180;
    var x1 = 50 + 42 * Math.sin(a), y1 = 50 - 42 * Math.cos(a);
    var x2 = 50 + 46 * Math.sin(a), y2 = 50 - 46 * Math.cos(a);
    ticks += '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="#333" stroke-width="2" stroke-linecap="round"/>';
  }
  return '<svg class="clock-svg" width="120" height="120" viewBox="0 0 100 100">'+
    '<circle cx="50" cy="50" r="48" fill="#fff" stroke="#333" stroke-width="2.5"/>'+
    '<circle cx="50" cy="50" r="2.5" fill="#333"/>'+
    ticks+
    '<line x1="50" y1="50" x2="'+hx+'" y2="'+hy+'" stroke="#333" stroke-width="4" stroke-linecap="round"/>'+
    '<line x1="50" y1="50" x2="'+mx+'" y2="'+my+'" stroke="#555" stroke-width="2.5" stroke-linecap="round"/>'+
    '</svg>';
}

// ── 认识时间（上册）──

// 看钟面读写时间
function genClockRead(){
  var h = rnd(1,12);
  var m = rnd(0,11) * 5;
  while(m===60) m=0;
  var timeStr = h + '时' + (m===0?'':(m+'分'));
  var digital = h + ':' + (m<10?'0':'') + m;
  if(rnd(0,1)===0){
    return {
      q: '看钟面，写出时间：',
      svg: clockSVG(h,m),
      answer: digital,
      answerDisplay: timeStr,
      type:'time', subtype:'read',
      inputType:'text'
    };
  }else{
    return {
      q: '<b>'+timeStr+'</b> 在钟面上，时针指向（  ）和（  ）之间，分针指向（  ）',
      answer: h+','+(h===12?1:h+1)+','+(m===0?12:m/5),
      answerDisplay: h+'和'+(h===12?1:h+1)+'之间，分针指向'+(m===0?12:m/5),
      type:'time', subtype:'hands',
      inputType:'text'
    };
  }
}

// 时间写法互转
function genTimeWrite(){
  var h = rnd(1,12);
  var m = rnd(0,11) * 5;
  var chinese = h + '时' + (m===0?'':(m+'分'));
  var digital = h + ':' + (m<10?'0':'') + m;
  if(rnd(0,1)===0){
    return {
      q: chinese + ' 写作（  :  ）',
      answer: digital,
      type:'time', subtype:'write',
      inputType:'text'
    };
  }else{
    return {
      q: '<b>'+digital+'</b> 读作（  ）',
      answer: chinese,
      type:'time', subtype:'readcn',
      inputType:'text'
    };
  }
}

// 时间单位换算
function genTimeConvert(){
  var qs = [
    {q:'1时 =（  ）分', a:'60', hint:'1时=60分'},
    {q:'2时 =（  ）分', a:'120', hint:'2×60=120'},
    {q:'60分 =（  ）时', a:'1', hint:'60分=1时'},
    {q:'120分 =（  ）时', a:'2', hint:'120÷60=2'},
    {q:'半时 =（  ）分', a:'30', hint:'半小时=30分'},
    {q:'90分 =（  ）时（  ）分', a:'1,30', hint:'90÷60=1时余30分', multi:2},
    {q:'1时30分 =（  ）分', a:'90', hint:'60+30=90'},
    {q:'2时15分 =（  ）分', a:'135', hint:'2×60+15=135'},
    {q:'100分 =（  ）时（  ）分', a:'1,40', hint:'100÷60=1时余40分', multi:2},
    {q:'3时 =（  ）分', a:'180', hint:'3×60=180'}
  ];
  var c = pick(qs);
  return {
    q: c.q, answer: c.a,
    hint: c.hint,
    type:'time', subtype:'convert',
    inputType: c.multi?'multi':'text',
    inputCount: c.multi||1
  };
}

// ── 质量单位（下册）──

// 质量单位认识
function genWeightUnit(){
  var qs = [
    {q:'计量比较轻的物品，通常用（  ）作单位', a:'克', opts:['克','千克','斤','吨']},
    {q:'计量比较重的物品，通常用（  ）作单位', a:'千克', opts:['克','千克','斤','吨']},
    {q:'1千克 =（  ）克', a:'1000', hint:'1千克=1000克'},
    {q:'一个鸡蛋大约重 50（  ）', a:'克', opts:['克','千克','斤','吨']},
    {q:'一袋大米大约重 25（  ）', a:'千克', opts:['克','千克','斤','吨']},
    {q:'一个苹果大约重 200（  ）', a:'克', opts:['克','千克','斤','吨']},
    {q:'一头牛大约重 500（  ）', a:'千克', opts:['克','千克','斤','吨']},
    {q:'一枚2分硬币大约重 1（  ）', a:'克', opts:['克','千克','斤','吨']}
  ];
  var c = pick(qs);
  var result = { q:c.q, answer:c.a, type:'weight', subtype:'unit' };
  if(c.opts){
    result.options = shuffleArr(c.opts);
    result.inputType = 'choice';
  }else{
    result.inputType = 'text';
    result.hint = c.hint;
  }
  return result;
}

    {q:'8000克 =（  ）千克', a:'8'},
    {q:'3千克500克 =（  ）克', a:'3500'},
    {q:'2500克 =（  ）千克（  ）克', a:'2,500', multi:2},
    {q:'4千克200克 =（  ）克', a:'4200'},
    {q:'1600克 =（  ）千克（  ）克', a:'1,600', multi:2}

    {a:'800克', b:'1千克', cmp:'＜'},
    {a:'5千克', b:'5000克', cmp:'＝'},
    {a:'1500克', b:'2千克', cmp:'＜'},
    {a:'4千克', b:'3800克', cmp:'＞'},
    {a:'1000克', b:'1千克', cmp:'＝'},
    {a:'600克', b:'1千克', cmp:'＜'},
    {a:'3千克', b:'3000克', cmp:'＝'},

// ── 长度单位（上册）──

// 长度单位认识
function genLengthUnit(){
  var qs = [
    {q:'量比较短的物体，通常用（  ）作单位', a:'厘米', opts:['厘米','米','毫米','分米']},
    {q:'量比较长的物体，通常用（  ）作单位', a:'米', opts:['厘米','米','千米','分米']},

    {q:'教室的门大约高 2（  ）', a:'米', opts:['厘米','米','分米','千米']},

// 尺子读刻度 SVG
function rulerSVG(startCM, endCM, objLen){
  var w = 560, h = 80;
  var pxPerCM = 40;
  var offsetX = 30;
  var svg = '<svg class="ruler-svg" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">';
  // 尺子主体
  svg += '<rect x="'+offsetX+'" y="20" width="'+(pxPerCM*12)+'" height="28" fill="#fff8e1" stroke="#795548" stroke-width="2" rx="2"/>';
  // 刻度线
  for(var i=0;i<=12;i++){
    var x = offsetX + i*pxPerCM;
    var isCm = (i%1===0);
    var tickH = 22;
    if(i===0||i===12) tickH = 28;
    svg += '<line x1="'+x+'" y1="20" x2="'+x+'" y2="'+(20+tickH)+'" stroke="#333" stroke-width="'+(isCm?2:1)+'"/>';
    if(i%2===0){
      svg += '<text x="'+x+'" y="56" text-anchor="middle" font-size="11" fill="#333">'+i+'</text>';
    }
  }
  // 物体
  var objX = offsetX + startCM * pxPerCM;
  var objW = objLen * pxPerCM;
  svg += '<rect x="'+objX+'" y="2" width="'+objW+'" height="16" fill="#5b8def" opacity="0.3" stroke="#5b8def" stroke-width="1.5" rx="2"/>';
  svg += '<text x="'+(objX+objW/2)+'" y="14" text-anchor="middle" font-size="10" fill="#5b8def" font-weight="700">?</text>';
  svg += '</svg>';
  return svg;
}

// 读尺子
function genRulerRead(){
  var startCM = rnd(0,8);
  var objLen = rnd(1, 12-startCM);
  var endCM = startCM + objLen;
  var mode = rnd(0,2);
  if(mode===0){
    return {
      q: '看图，物体的长度是多少厘米？',
      svg: rulerSVG(startCM, endCM, objLen),
      answer: String(objLen),
      answerDisplay: objLen+'厘米',
      type:'length', subtype:'ruler',
      inputType:'text'
    };
  }else if(mode===1){
    return {
      q: '画一条长 <b>'+objLen+'厘米</b> 的线段，从尺子的（  ）厘米处画到（  ）厘米处',
      answer: startCM+','+endCM,
      answerDisplay: startCM+'厘米到'+endCM+'厘米',
      type:'length', subtype:'draw',
      inputType:'text'
    };
  }else{
    return {
      q: '一根绳子长 <b>'+objLen+'厘米</b>，用尺子测量时，一头对准（  ）厘米，另一头对准（  ）厘米',
      answer: startCM+','+endCM,
      answerDisplay: startCM+'厘米和'+endCM+'厘米',
      type:'length', subtype:'measure',
      inputType:'text'
    };
  }
}

// ========== 生成入口 ==========
function generate(){
  var gens = [];
  if(state.type==='all'||state.type==='time'){
    gens.push(genClockRead, genTimeWrite, genTimeConvert);
  }
  if(state.type==='all'||state.type==='weight'){
    gens.push(genWeightUnit, genWeightConvert, genWeightCompare);
  }
  if(state.type==='all'||state.type==='length'){
    gens.push(genLengthUnit, genLengthConvert, genLengthCompare, genRulerRead);
  }

  var list = [];
  var seen = {};
  for(var i=0;i<state.count;i++){
    var q;
    var attempts=0;
    do{
      q = pick(gens)();
      attempts++;
    }while(seen[q.q] && attempts<20);
    seen[q.q]=true;
    list.push(q);
  }
  state.problems = list;
  state.revealed = false;
  renderProblems();
  resultArea.innerHTML='';
}

function renderProblems(){
  if(!state.problems.length){
    problemsArea.innerHTML='<div class="empty">点击「生成练习题」开始吧～</div>';
    return;
  }
  var typeNames = {all:'全部', time:'认识时间', weight:'质量单位', length:'长度单位'};
  var meta = '<div class="meta">'+
    '<span class="pill">'+state.problems.length+' 题</span>'+
    '<span class="pill">'+typeNames[state.type]+'</span>'+
    '</div>';

  var cards = state.problems.map(function(p,i){
    var svgHtml = p.svg?p.svg:'';
    var inputHtml = '';
    if(p.inputType==='choice'){
      inputHtml = '<div class="options">'+p.options.map(function(o){
        return '<span class="opt" data-ans="'+o+'">'+o+'</span>';
      }).join('')+'</div>';
    }else if(p.inputType==='multi'){
      var inputs = '';
      for(var j=0;j<p.inputCount;j++){
        inputs += '<input type="text" inputmode="numeric" placeholder="?" autocomplete="off" data-idx="'+j+'">';
      }
      inputHtml = '<div class="input-group">'+inputs+'</div>';
    }else{
      inputHtml = '<div class="input-group"><input type="text" placeholder="填写答案" autocomplete="off"></div>';
    }
    var badgeClass = p.type==='time'?'time':p.type==='weight'?'weight':'length';
    var badgeLabels = {time:'认识时间', weight:'质量单位', length:'长度单位'};
    var answerText = p.answerDisplay || p.answer;
    return '<div class="problem" data-i="'+i+'">'+
      '<div class="num">'+(i+1)+'</div>'+
      '<span class="badge '+badgeClass+'">'+badgeLabels[p.type]+'</span>'+
      '<p class="q">'+p.q+'</p>'+
      svgHtml+
      inputHtml+
      '<div class="ans">'+
        '<span class="feedback"></span>'+
        '<span class="reveal hide">正确答案：'+answerText+'</span>'+
      '</div>'+
    '</div>';
  }).join('');
  problemsArea.innerHTML = meta + cards;

  problemsArea.querySelectorAll('.opt').forEach(function(opt){
    opt.addEventListener('click',function(){
      var card = this.closest('.problem');
      card.querySelectorAll('.opt').forEach(function(o){ o.classList.remove('chosen'); });
      this.classList.add('chosen');
    });
  });
}

function check(){
  if(!state.problems.length) return;
  var correct=0;
  var cards = problemsArea.querySelectorAll('.problem');
  state.problems.forEach(function(p,i){
    var card=cards[i];
    var fb=card.querySelector('.feedback');
    card.classList.remove('correct','wrong');

    var userAnswer;
    if(p.inputType==='choice'){
      var chosen=card.querySelector('.opt.chosen');
      userAnswer = chosen?chosen.dataset.ans:'';
    }else if(p.inputType==='multi'){
      var inputs = card.querySelectorAll('input');
      userAnswer = Array.from(inputs).map(function(inp){ return inp.value.trim(); }).join(',');
    }else{
      var input = card.querySelector('input');
      userAnswer = (input?input.value:'').trim();
    }

    var normUser = userAnswer.replace(/\s+/g,'').toLowerCase();
    var normRight = String(p.answer).replace(/\s+/g,'').toLowerCase();

    if(!userAnswer){
      fb.textContent='未作答';fb.style.color='var(--warn)';card.classList.add('wrong');
    }else if(normUser===normRight){
      fb.textContent='✓ 正确';fb.style.color='var(--ok)';card.classList.add('correct');correct++;
    }else{
      fb.textContent='✗ 正确答案：'+(p.answerDisplay || p.answer);
      fb.style.color='var(--bad)';card.classList.add('wrong');
    }
  });
  var total=state.problems.length;
  var pct=Math.round(correct/total*100);
  var tips = correct===total?'太棒了，全部答对！👏':correct>=total*0.8?'表现很好，再练练就满分啦！💪':'别灰心，把错题弄懂，下次一定行！🌟';
  resultArea.innerHTML='<div class="result">'+
    '<div class="score">'+correct+' / '+total+'</div>'+
    '<div class="detail">正确率 '+pct+'% &nbsp;·&nbsp; '+tips+'</div>'+
    '</div>';
}

function toggleReveal(){
  state.revealed=!state.revealed;
  problemsArea.querySelectorAll('.reveal').forEach(function(r){ r.classList.toggle('hide',!state.revealed); });
  document.getElementById('revealBtn').textContent = state.revealed?'🙈 隐藏答案':'👀 显示答案';
}

function printFile(){
  if(!state.problems.length){alert('请先生成练习题！');return;}
  Print.open('#problemsArea','二年级数学·常见量换算与测量',{pageType:'measurement'});
}

// ========== 初始化 ==========
var problemsArea = document.getElementById('problemsArea');
var resultArea = document.getElementById('resultArea');
var grade = App.getGradeParam();
document.getElementById('gradeTitle').textContent = App.getGradeName(grade);
document.getElementById('backLink').href = App.buildLink('math-types.html');

document.querySelectorAll('[data-count]').forEach(function(chip){
  chip.addEventListener('click',function(){
    document.querySelectorAll('[data-count]').forEach(function(c){ c.classList.remove('active'); });
    this.classList.add('active');
    state.count = +this.dataset.count;
  });
});
document.querySelectorAll('[data-type]').forEach(function(chip){
  chip.addEventListener('click',function(){
    document.querySelectorAll('[data-type]').forEach(function(c){ c.classList.remove('active'); });
    this.classList.add('active');
    state.type = this.dataset.type;
    if(state.problems.length) generate();
  });
});
document.getElementById('genBtn').addEventListener('click',generate);
document.getElementById('checkBtn').addEventListener('click',check);
document.getElementById('revealBtn').addEventListener('click',toggleReveal);
document.getElementById('printBtn').addEventListener('click',printFile);
App.initPageController('mathMeasurement', 'math');
</script>
</body>
