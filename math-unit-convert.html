<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一年级数学单位换算练习</title>
<link rel="stylesheet" href="common.css">
<style>
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(180deg,#eaf2ff 0%,#f3f7fb 220px,#f3f7fb 100%);
    color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1200px;margin:0 auto;padding:16px 16px 60px}
  header.hero{text-align:center;padding:18px 10px 10px}
  header.hero h1{margin:0;font-size:26px;letter-spacing:1px;background:linear-gradient(90deg,#5b8def,#7c5cff);-webkit-background-clip:text;background-clip:text;color:transparent}
  header.hero p{margin:8px 0 0;color:var(--muted);font-size:14px}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px;margin:16px 0}
  .panel h2{margin:0 0 12px;font-size:15px;color:var(--muted);font-weight:700;letter-spacing:.5px}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:14px}
  .count-group{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .count-group .lbl{font-size:14px;color:var(--muted);margin-right:2px}
  .chip{cursor:pointer;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:8px 14px;font-size:14px;font-weight:600;transition:.15s}
  .chip:hover{border-color:var(--brand)}
  .chip.active{background:var(--brand-d);border-color:var(--brand-d);color:#fff}
  .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .btn{cursor:pointer;border:none;border-radius:12px;padding:12px 20px;font-size:15px;font-weight:700;transition:.15s}
  .btn-primary{background:linear-gradient(90deg,#5b8def,#6f6bff);color:#fff;box-shadow:0 6px 16px rgba(91,141,239,.35)}
  .btn-primary:hover{filter:brightness(1.05)}
  .btn-ghost{background:#eef3fb;color:var(--brand-d)}
  .btn-ghost:hover{background:#e2ebf9}
  .meta{display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:8px}
  .meta .pill{background:#eef3fb;color:var(--brand-d);border-radius:999px;padding:4px 12px;font-weight:600}

  .problem{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px 16px 16px 52px;margin:12px 0;position:relative}
  .problem .num{position:absolute;left:14px;top:16px;width:26px;height:26px;border-radius:50%;background:#eef3fb;color:var(--brand-d);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center}
  .problem .q{font-size:16px;margin:0 0 10px;line-height:1.7}
  .problem .ans{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .problem input{width:120px;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:16px;color:var(--ink);outline:none;transition:.15s}
  .problem input:focus{border-color:var(--brand)}
  .problem .unit{font-size:14px;color:var(--muted)}
  .problem .feedback{font-size:13px;font-weight:700;min-height:18px}
  .problem .reveal{font-size:13px;color:var(--warn);font-weight:600}
  .problem .reveal.hide{display:none}
  .problem.correct{border-color:var(--ok);background:var(--ok-bg)}
  .problem.wrong{border-color:var(--bad);background:var(--bad-bg)}

  .clock-svg{display:block;margin:0 auto}
  .scene-box{display:flex;align-items:center;justify-content:center;gap:20px;padding:16px;background:#f8fafd;border-radius:12px;margin:8px 0;flex-wrap:wrap}

  .result{background:linear-gradient(135deg,#eef4ff,#f6efff);border:1px solid var(--line);border-radius:16px;padding:18px;margin:16px 0;text-align:center;box-shadow:var(--shadow)}
  .result .score{font-size:34px;font-weight:800;color:var(--brand-d)}
  .result .detail{font-size:14px;color:var(--ink);margin-top:4px}
  .empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <div style="margin-bottom:10px">
    <a href="math-types.html" class="back-home" id="backLink">← 返回题型选择</a>
  </div>
  <header class="hero">
    <h1>⏰ <span id="gradeTitle">一年级</span>数学单位换算</h1>
    <p>认读时钟 · 元角分换算 · 简单计算</p>
  </header>

  <section class="panel controls">
    <div class="row">
      <div class="count-group">
        <span class="lbl">① 题目数量：</span>
        <button class="chip active" data-count="5">5题</button>
        <button class="chip" data-count="10">10题</button>
        <button class="chip" data-count="15">15题</button>
        <button class="chip" data-count="20">20题</button>
      </div>
    </div>
    <div class="row">
      <div class="count-group">
        <span class="lbl">② 练习类型：</span>
        <button class="chip active" data-type="all">全部</button>
        <button class="chip" data-type="clock">认读时钟</button>
        <button class="chip" data-type="money">元角分换算</button>
        <button class="chip" data-type="calc">简单计算</button>
      </div>
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="genBtn">🎲 生成练习题</button>
      <button class="btn btn-primary" id="checkBtn">✅ 检查答案</button>
      <button class="btn btn-ghost" id="revealBtn">👀 显示答案</button>
      <button class="btn btn-ghost" id="printBtn">📄 生成打印文件</button>
    </div>
  </section>

  <section id="problemsArea">
    <div class="empty">点击「生成练习题」开始吧～</div>
  </section>
  <div id="resultArea"></div>
  <footer>题目由程序随机生成，仅供参考练习。</footer>
</div>

<script src="common.js"></script>
<script src="print.js"></script>
<script>
function rnd(min,max){ return App.randInt(min,max); }
function pick(arr){ return App.rand(arr); }
function shuffleArr(arr){ return App.shuffle(arr); }

// ========== 时钟 SVG 生成 ==========
function clockSVG(hour, minute){
  const cx=50, cy=50, r=44;
  const hAngle = ((hour%12)*30 + minute*0.5 - 90) * Math.PI/180;
  const mAngle = (minute*6 - 90) * Math.PI/180;
  const hx = cx + r*0.5*Math.cos(hAngle);
  const hy = cy + r*0.5*Math.sin(hAngle);
  const mx = cx + r*0.75*Math.cos(mAngle);
  const my = cy + r*0.75*Math.sin(mAngle);
  return `<svg class="clock-svg" width="120" height="120" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="44" fill="#fff" stroke="#5b8def" stroke-width="3"/>
    <circle cx="50" cy="50" r="2" fill="#5b8def"/>
    <line x1="50" y1="50" x2="${hx.toFixed(1)}" y2="${hy.toFixed(1)}" stroke="#27324a" stroke-width="4" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="${mx.toFixed(1)}" y2="${my.toFixed(1)}" stroke="#5b8def" stroke-width="2.5" stroke-linecap="round"/>
    <text x="50" y="10" text-anchor="middle" font-size="10" fill="#7a879c" font-weight="700">12</text>
    <text x="84" y="54" text-anchor="middle" font-size="10" fill="#7a879c" font-weight="700">3</text>
    <text x="50" y="96" text-anchor="middle" font-size="10" fill="#7a879c" font-weight="700">6</text>
    <text x="16" y="54" text-anchor="middle" font-size="10" fill="#7a879c" font-weight="700">9</text>
  </svg>`;
}

// ========== 题目生成器 ==========
let state = { count:5, type:'all', problems:[], revealed:false };

function genClock(){
  const types = [
    function(){ // 整点
      const h = rnd(1,12);
      const hStr = h<10?h+'时':h+'时';
      return { q:'钟面上显示的是几时？', svg:clockSVG(h,0), answer:hStr, type:'clock' };
    },
    function(){ // 半时
      const h = rnd(1,12);
      const hStr = h+'时30分';
      return { q:'钟面上显示的是几时几分？', svg:clockSVG(h,30), answer:hStr, type:'clock' };
    },
    function(){ // 给定文字描述，补充钟面
      const h = rnd(1,12);
      const m = [0,30][rnd(0,1)];
      const timeStr = m===0?h+'时':h+'时30分';
      return { q:`请写出钟面显示的时间：`, svg:clockSVG(h,m), answer:timeStr, type:'clock' };
    },
    function(){ // 过几小时
      const h = rnd(1,9), add = rnd(1,4);
      return { q:`现在是 ${h} 时，过了 ${add} 小时后是几时？`, svg:'', answer:(h+add)+'时', type:'clock' };
    },
  ];
  return pick(types)();
}

function genMoney(){
  const types = [
    function(){ // 元→角
      const y = rnd(1,9);
      return { q:`${y} 元 = （ ）角`, answer:y*10+'角', unit:'角', type:'money' };
    },
    function(){ // 角→分
      const j = rnd(1,9);
      return { q:`${j} 角 = （ ）分`, answer:j*10+'分', unit:'分', type:'money' };
    },
    function(){ // 元角→角
      const y = rnd(1,5), j = rnd(1,9);
      return { q:`${y} 元 ${j} 角 = （ ）角`, answer:(y*10+j)+'角', unit:'角', type:'money' };
    },
    function(){ // 角→元角
      const total = rnd(11,99);
      const y = Math.floor(total/10), j = total%10;
      return { q:`${total} 角 = （ ）元（ ）角`, answer:y+'元'+j+'角', type:'money' };
    },
    function(){ // 分→角分
      const total = rnd(11,99);
      const j = Math.floor(total/10), f = total%10;
      return { q:`${total} 分 = （ ）角（ ）分`, answer:j+'角'+f+'分', type:'money' };
    },
    function(){ // 比较大小
      const a = rnd(1,9), b = rnd(1,9);
      if(a===b) return genMoney();
      const ans = a>b?'＞':'＜';
      return { q:`${a} 元 ○ ${b*10} 角（填 ＞、＜ 或 ＝）`, answer:ans, type:'money' };
    },
  ];
  return pick(types)();
}

function genCalc(){
  const types = [
    function(){ // 元角加减
      const y = rnd(1,3), j1 = rnd(1,9), j2 = rnd(1,9);
      const total = j1+j2;
      const yPlus = Math.floor(total/10);
      const jRemain = total%10;
      return { q:`${y} 元 ${j1} 角 + ${j2} 角 = （ ）元（ ）角`, answer:(y+yPlus)+'元'+jRemain+'角', type:'calc' };
    },
    function(){ // 角角加减
      const j1 = rnd(10,50), j2 = rnd(1,Math.min(j1-1,30));
      const diff = j1-j2;
      return { q:`${j1} 角 - ${j2} 角 = （ ）角`, answer:diff+'角', unit:'角', type:'calc' };
    },
    function(){ // 元角减法
      const y = rnd(2,5), j1 = rnd(1,9), j2 = rnd(1,Math.min(y*10+j1-1,20));
      const totalJ = y*10+j1;
      const diff = totalJ - j2;
      const y2 = Math.floor(diff/10), jRemain = diff%10;
      return { q:`${y} 元 ${j1} 角 - ${j2} 角 = （ ）元（ ）角`, answer:y2+'元'+jRemain+'角', type:'calc' };
    },
    function(){ // 时钟计算
      const h = rnd(1,9), m1 = rnd(0,5)*10, m2 = rnd(1,6)*10;
      const totalM = m1+m2;
      const hPlus = Math.floor(totalM/60);
      const mRemain = totalM%60;
      const hFinal = h+hPlus;
      const ans = mRemain===0?(hFinal+'时'):(hFinal+'时'+mRemain+'分');
      return { q:`${h} 时 ${m1} 分 + ${m2} 分 = 几时几分？`, answer:ans, type:'calc' };
    },
    function(){ // 综合换算
      const y = rnd(1,3), j = rnd(1,5);
      return { q:`${y} 元 ${j} 角 = ${y*10+j} 角，再加 ${rnd(1,9)} 角是多少角？`, answer:(y*10+j+rnd(1,9))+'角', unit:'角', type:'calc' };
    },
  ];
  return pick(types)();
}

function generate(){
  const gens = [];
  if(state.type==='all'||state.type==='clock') gens.push(genClock);
  if(state.type==='all'||state.type==='money') gens.push(genMoney);
  if(state.type==='all'||state.type==='calc') gens.push(genCalc);

  const list = [];
  for(let i=0;i<state.count;i++){
    list.push(pick(gens)());
  }
  state.problems = list;
  state.revealed = false;
  renderProblems();
  resultArea.innerHTML='';
}

function renderProblems(){
  if(!state.problems.length){
    problemsArea.innerHTML='<div class="empty">点击「生成练习题」开始吧～</div>';
    return;
  }
  const typeNames = {all:'全部', clock:'认读时钟', money:'元角分换算', calc:'简单计算'};
  const meta = `<div class="meta">
    <span class="pill">${state.problems.length} 题</span>
    <span class="pill">${typeNames[state.type]}</span>
  </div>`;
  const cards = state.problems.map((p,i)=>{
    const svgHtml = p.svg?`<div class="scene-box">${p.svg}</div>`:'';
    const unitHtml = p.unit?`<span class="unit">${p.unit}</span>`:'';
    return `<div class="problem" data-i="${i}">
      <div class="num">${i+1}</div>
      <p class="q">${p.q}</p>
      ${svgHtml}
      <div class="ans">
        <input type="text" placeholder="填答案" autocomplete="off">
        ${unitHtml}
        <span class="feedback"></span>
        <span class="reveal hide">正确答案：${p.answer}</span>
      </div>
    </div>`;
  }).join('');
  problemsArea.innerHTML = meta + cards;
}

function norm(v){ return (v==null?'':(''+v)).trim().replace(/\s+/g,'').toLowerCase(); }

function check(){
  if(!state.problems.length) return;
  let correct=0;
  const cards = problemsArea.querySelectorAll('.problem');
  state.problems.forEach((p,i)=>{
    const card=cards[i];
    const input=card.querySelector('input');
    const fb=card.querySelector('.feedback');
    const user=norm(input.value);
    const right=norm(p.answer);
    card.classList.remove('correct','wrong');
    if(user===''){
      fb.textContent='未作答';fb.style.color='var(--warn)';card.classList.add('wrong');
    }else if(user===right){
      fb.textContent='✓ 正确';fb.style.color='var(--ok)';card.classList.add('correct');correct++;
    }else{
      fb.textContent=`✗ 正确答案：${p.answer}`;fb.style.color='var(--bad)';card.classList.add('wrong');
    }
  });
  const total=state.problems.length;
  const pct=Math.round(correct/total*100);
  const tips = correct===total?'太棒了，全部答对！👏':correct>=total*0.8?'表现很好，再练练就满分啦！💪':'别灰心，把错题弄懂，下次一定行！🌟';
  resultArea.innerHTML=`<div class="result">
    <div class="score">${correct} / ${total}</div>
    <div class="detail">正确率 ${pct}% &nbsp;·&nbsp; ${tips}</div>
  </div>`;
}

function toggleReveal(){
  state.revealed=!state.revealed;
  problemsArea.querySelectorAll('.reveal').forEach(r=>r.classList.toggle('hide',!state.revealed));
  document.getElementById('revealBtn').textContent = state.revealed?'🙈 隐藏答案':'👀 显示答案';
}

function printFile(){
  if(!state.problems.length){alert('请先生成练习题！');return;}
  Print.open('#problemsArea','一年级数学单位换算练习',{pageType:'unitConvert'});
}

// ========== 初始化 ==========
const problemsArea = document.getElementById('problemsArea');
const resultArea = document.getElementById('resultArea');
const grade = App.getGradeParam();
document.getElementById('gradeTitle').textContent = App.getGradeName(grade);
document.getElementById('backLink').href = App.buildLink('math-types.html');

document.querySelectorAll('[data-count]').forEach(chip=>{
  chip.addEventListener('click',function(){
    document.querySelectorAll('[data-count]').forEach(c=>c.classList.remove('active'));
    this.classList.add('active');
    state.count = +this.dataset.count;
  });
});
document.querySelectorAll('[data-type]').forEach(chip=>{
  chip.addEventListener('click',function(){
    document.querySelectorAll('[data-type]').forEach(c=>c.classList.remove('active'));
    this.classList.add('active');
    state.type = this.dataset.type;
    if(state.problems.length) generate();
  });
});
document.getElementById('genBtn').addEventListener('click',generate);
document.getElementById('checkBtn').addEventListener('click',check);
document.getElementById('revealBtn').addEventListener('click',toggleReveal);
document.getElementById('printBtn').addEventListener('click',printFile);
App.initPageController('mathUnitConvert', 'math');
</script>
</body>
</html>
